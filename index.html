  openSheet({
    title: editing ? t('debtEdit') : t('debtNew'),
    submitText: editing ? t('save') : t('add'),
    body: `
      <label class="field"><span class="field-label">${esc(t('debtDirection'))}</span>
        <select name="direction" id="debt-direction">
          <option value="i_owe" ${editing && editing.direction==='i_owe'?'selected':''}>${esc(t('debtDirIOwe'))}</option>
          <option value="owe_me" ${editing && editing.direction==='owe_me'?'selected':''}>${esc(t('debtDirOweMe'))}</option>
        </select>
      </label>
      <label class="field"><span class="field-label">${esc(t('debtPerson'))}</span><input name="person" type="text" required maxlength="80" placeholder="${esc(t('debtPersonPlaceholder'))}" value="${editing?esc(editing.person):''}"></label>
      <label class="field"><span class="field-label">${esc(t('debtAmount'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal" value="${editing?editing.amount:''}"></div>
      </label>
      <div class="field"><span class="field-label">${esc(t('debtPurpose'))}</span>${renderPurposePickerButton('debt', editing?editing.purpose:initialPurpose, editing?editing.purposeCustom:'')}</div>
      <div class="field"><span class="field-label">${esc(t('debtMethod'))}</span>${renderMethodPickerButton(editing?editing.method:initialMethod, methodLabel(editing?editing.method:initialMethod), editing?editing.methodCustom:'')}</div>
      <label class="field"><span class="field-label">${esc(t('debtLinkMode'))}</span>
        <select name="linkMode" id="debt-link-mode">
          <option value="record_only" ${initialLinkMode==='record_only'?'selected':''}>${esc(t('debtLinkRecordOnly'))}</option>
          <option value="account" ${initialLinkMode==='account'?'selected':''}>${esc(t('debtLinkAccount'))}</option>
        </select>
      </label>
      <p class="hint" id="debt-link-hint">${esc(t('debtLinkHintRecordOnly'))}</p>
      <label class="field" id="debt-linked-account-wrap" style="display:${initialLinkMode==='account'?'block':'none'}">
        <span class="field-label">${esc(t('debtLinkedAccount'))}</span>
        <select name="linkedAccountId">${accountOptions(initialAccountId)}</select>
      </label>
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('debtDate'))}</span><input name="date" type="date" required value="${editing?localDateStr(editing.eventAt||editing.date):nowLocalDate()}"></label>
        <label class="field"><span class="field-label">${esc(t('debtTime'))}</span><input name="time" type="time" step="1" required value="${editing?localTimeSecStr(editing.eventAt||editing.date):nowLocalTime()}"></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('debtDueDate'))}</span><input name="dueDate" type="date" value="${editing && editing.dueDate ? esc(editing.dueDate) : ''}"></label>
      <label class="field"><span class="field-label">${esc(t('debtReason'))}</span><textarea name="reason" maxlength="4000" placeholder="${esc(t('debtReasonPlaceholder'))}">${editing?esc(editing.reason||''):''}</textarea></label>
      <p class="hint">${esc(t('debtImportantNote'))}</p>`,
    onSubmit(d){
      const person = (d.person || '').trim();
      const amount = round2(parseFloat(d.amount));
      if(!person){ toast(t('catEnterName')); return false; }
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      const eventAt = combineDateTime(d.date || nowLocalDate(), d.time || nowLocalTime());
      const linkMode = d.linkMode === 'account' ? 'account' : 'record_only';
      const linkedAccountId = linkMode === 'account' ? d.linkedAccountId : null;

      if(editing){
        // 回滚旧的联动（如果有）
        if(editing.linkMode === 'account' && editing.linkedAccountId){
          const oldAcc = getAccount(editing.linkedAccountId);
          if(oldAcc){
            if(editing.direction === 'owe_me') oldAcc.balance = round2((Number(oldAcc.balance)||0) + Number(editing.amount||0));
            else oldAcc.balance = round2((Number(oldAcc.balance)||0) - Number(editing.amount||0));
          }
        }
        // 应用新联动
        if(linkMode === 'account'){
          const acc = getAccount(linkedAccountId);
          if(!acc){ toast(t('accountNotExist')); return false; }
          if(d.direction === 'owe_me'){
            if(round2(Number(acc.balance)||0) < amount){ toast(t('insufficientBalance')); return false; }
            acc.balance = round2((Number(acc.balance)||0) - amount);
          }else{
            acc.balance = round2((Number(acc.balance)||0) + amount);
          }
        }
        editing.direction = d.direction;
        editing.person = person; editing.amount = amount;
        editing.purpose = (d.purpose || '').trim();
        editing.purposeCustom = (d.purposeCustom || '').trim();
        editing.method = (d.method || '').trim();
        editing.methodCustom = (d.methodCustom || '').trim();
        editing.eventAt = eventAt;
        editing.date = eventAt;
        editing.dueDate = d.dueDate || '';
        editing.reason = (d.reason || '');
        editing.linkMode = linkMode;
        editing.linkedAccountId = linkedAccountId;
        editing.updatedAt = Date.now();
        if(!Array.isArray(editing.editHistory)) editing.editHistory = [];
        editing.editHistory.push(Date.now());
        const paid = Number(editing.paid) || 0;
        if(paid >= amount && amount > 0) editing.status = 'paid';
        else if(paid > 0) editing.status = 'partial';
        else editing.status = 'unpaid';
        afterChange(); toast(t('debtUpdated'));
      }else{
        if(linkMode === 'account'){
          const acc = getAccount(linkedAccountId);
          if(!acc){ toast(t('accountNotExist')); return false; }
          if(d.direction === 'owe_me'){
            if(round2(Number(acc.balance)||0) < amount){ toast(t('insufficientBalance')); return false; }
            acc.balance = round2((Number(acc.balance)||0) - amount);
          }else{
            acc.balance = round2((Number(acc.balance)||0) + amount);
          }
        }
        const eventId = 'EVT-' + Date.now().toString(36).toUpperCase();
        state.debts.push({
          id: uid(), eventId,
          direction: d.direction || 'i_owe', person, amount,
          purpose: (d.purpose || '').trim(), purposeCustom: (d.purposeCustom || '').trim(),
          method: (d.method || '').trim(), methodCustom: (d.methodCustom || '').trim(),
          eventAt, date: eventAt,
          timezone: 'Asia/Kuala_Lumpur',
          dueDate: d.dueDate || '', reason: (d.reason || ''),
          paid: 0, payments: [], status: 'unpaid',
          linkMode, linkedAccountId,
          editHistory: [],
          createdAt: Date.now(), updatedAt: Date.now()
        });
        saveState();
        afterChange(); toast(t('debtCreated'));
      }
      return true;
    },
    afterRender(root){
      bindPurposePicker(root, 'debt'); bindMethodPicker(root);
      const sel = root.querySelector('#debt-link-mode');
      const hint = root.querySelector('#debt-link-hint');
      const wrap = root.querySelector('#debt-linked-account-wrap');
      if(sel && hint && wrap){
        const update = () => {
          if(sel.value === 'account'){
            hint.textContent = t('debtLinkHintLinked');
            wrap.style.display = 'block';
          }else{
            hint.textContent = t('debtLinkHintRecordOnly');
            wrap.style.display = 'none';
          }
        };
        sel.addEventListener('change', update);
        update();
      }
    }
  });
}
function debtMenu(id){
  const d = getDebt(id);
  if(!d) return;
  const acts = [
    { label: t('debtRepay'), icon:'💵', onClick: () => openDebtRepay(id) },
    { label: t('edit'), icon:'✏️', onClick: () => openDebtForm(id) }
  ];
  if(d.status !== 'cancelled'){
    acts.push({ label: t('debtCancel'), icon:'🚫', danger:true, onClick: () => {
      confirmDialog(t('debtCancelConfirm'), () => {
        d.status = 'cancelled'; d.updatedAt = Date.now(); afterChange(); toast(t('debtCancelled'));
      });
    }});
  }
  acts.push({ label: t('delete'), icon:'🗑', danger:true, onClick: () => {
    confirmDialog(t('debtDeleteConfirm'), () => {
      // 回滚联动
      if(d.linkMode === 'account' && d.linkedAccountId){
        const acc = getAccount(d.linkedAccountId);
        if(acc){
          if(d.direction === 'owe_me') acc.balance = round2((Number(acc.balance)||0) + Number(d.amount||0));
          else acc.balance = round2((Number(acc.balance)||0) - Number(d.amount||0));
        }
      }
      state.debts = state.debts.filter(x => x.id !== id);
      afterChange(); toast(t('debtDeleted'));
    });
  }});
  openActionSheet(d.person, acts);
}
function openDebtRepay(id){
  const d = getDebt(id);
  if(!d) return;
  const remain = round2(Math.max(Number(d.amount) - Number(d.paid||0), 0));
  if(remain <= 0){ toast(t('debtStatusPaid')); return; }
  const useAccount = d.linkMode === 'account' && d.linkedAccountId;
  openSheet({
    title: t('debtRepayTitle'), submitText: t('debtRepayBtn'),
    body: `
      <div class="asset-rows" style="margin-bottom:14px">
        <div class="ar"><span>${esc(t('debtAmount'))}</span><b>${money(d.amount)}</b></div>
        <div class="ar"><span>${esc(t('debtPaid'))}</span><b>${money(d.paid||0)}</b></div>
        <div class="ar"><span>${esc(t('debtRemain'))}</span><b>${money(remain)}</b></div>
      </div>
      <label class="field"><span class="field-label">${esc(t('debtRepayAmount'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal"></div>
      </label>
      ${ useAccount ? `
      <p class="hint">${esc(t('debtLinkedAccount'))}: ${esc((getAccount(d.linkedAccountId)||{}).name||'—')}</p>
      ` : `
      <label class="field"><span class="field-label">${esc(t('account'))}（可选，用于记录实际资金流）</span>
        <select name="accountId"><option value="">${esc(t('none'))}</option>${accountOptions()}</select>
      </label>` }
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('date'))}</span><input name="date" type="date" value="${nowLocalDate()}" required></label>
        <label class="field"><span class="field-label">${esc(t('time'))}</span><input name="time" type="time" step="1" value="${nowLocalTime()}" required></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('debtRepayNote'))}</span><textarea name="note" maxlength="4000"></textarea></label>
      <p class="hint">${esc(t('debtRepayHint'))}</p>`,
    onSubmit(dd){
      const amount = round2(parseFloat(dd.amount));
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      if(amount > remain + 0.001){ toast(t('debtExceed')); return false; }

      // 还款与账户联动：
      // 若 debt.linkMode === 'account'，则自动到 d.linkedAccountId
      // 否则读取用户选择的 accountId（可选，仅用于记录资金流）
      let targetAcc = null;
      if(d.linkMode === 'account' && d.linkedAccountId){
        targetAcc = getAccount(d.linkedAccountId);
      }else if(dd.accountId){
        targetAcc = getAccount(dd.accountId);
      }

      if(targetAcc){
        // owe_me: 别人欠我，收到还款 → 账户 +
        // i_owe: 我欠别人，我付款 → 账户 -
        if(d.direction === 'owe_me'){
          targetAcc.balance = round2((Number(targetAcc.balance)||0) + amount);
        }else{
          if(round2(Number(targetAcc.balance)||0) < amount){ toast(t('insufficientBalance')); return false; }
          targetAcc.balance = round2((Number(targetAcc.balance)||0) - amount);
        }
      }

      d.payments = Array.isArray(d.payments) ? d.payments : [];
      d.payments.push({
        id: uid(), amount,
        eventAt: combineDateTime(dd.date || nowLocalDate(), dd.time || nowLocalTime()),
        note: (dd.note || ''),
        accountId: targetAcc ? targetAcc.id : null,
        createdAt: Date.now()
      });
      d.paid = round2(Number(d.paid||0) + amount);
      if(d.paid >= Number(d.amount) - 0.001){ d.status = 'paid'; d.paid = Number(d.amount); }
      else { d.status = 'partial'; }
      d.updatedAt = Date.now();
      if(!Array.isArray(d.editHistory)) d.editHistory = [];
      d.editHistory.push(Date.now());
      afterChange(); toast(t('debtRepayRecorded')); return true;
    }
  });
}
function debtCard(d){
  const amount = Number(d.amount)||0;
  const paid = Number(d.paid)||0;
  const remain = Math.max(amount - paid, 0);
  const pct = amount > 0 ? Math.min(paid / amount * 100, 100) : 0;
  const dirCls = d.direction === 'i_owe' ? 'st-debt-iowe' : 'st-debt-oweme';
  const dirLabel = d.direction === 'i_owe' ? t('debtIOwe') : t('debtOweMe');
  const statusLabel = d.status === 'paid' ? t('debtStatusPaid') : d.status === 'partial' ? t('debtStatusPartial') : d.status === 'cancelled' ? t('debtStatusCancelled') : t('debtStatusUnpaid');
  const statusCls = d.status === 'paid' ? 'st-done' : d.status === 'partial' ? 'st-partial' : d.status === 'cancelled' ? 'st-end' : 'st-active';
  const startMs = dateFromISO(d.eventAt||d.date).getTime();
  const days = Math.max(0, Math.round((Date.now() - startMs) / 86400000));
  const durText = `${days} ${t('debtDays')}`;
  let dueText = '';
  if(d.dueDate){
    const dd = new Date(d.dueDate);
    const diff = Math.ceil((dd - new Date()) / 86400000);
    if(diff > 0) dueText = ' · ' + t('debtDueIn', { n: diff });
    else if(diff === 0) dueText = ' · ' + t('debtDueToday');
    else dueText = ' · ' + t('debtOverdue');
  }
  const purposeText = d.purposeCustom ? d.purposeCustom : debtPurposeDisplay(d.purpose);
  const methodText = d.methodCustom ? d.methodCustom : methodDisplay(d.method);
  const linkTag = d.linkMode === 'account' ? ' · 🔗' : '';
  const linkedAcc = d.linkedAccountId ? getAccount(d.linkedAccountId) : null;
  const noteFull = d.reason || '';
  return `<div class="debt-card">
    <div class="debt-top">
      <div style="min-width:0;flex:1">
        <div class="debt-name">${esc(d.person)}
          <span class="badge ${dirCls}">${esc(dirLabel)}</span>
          <span class="badge ${statusCls}">${esc(statusLabel)}</span>
        </div>
        <div class="goal-sub">${esc(localDateTimeStr(d.eventAt||d.date))}${dueText} · ${esc(durText)}${linkTag}</div>
        ${purposeText ? `<div class="goal-sub">${esc(purposeText)}${methodText ? ' · ' + esc(methodText) : ''}</div>` : (methodText ? `<div class="goal-sub">${esc(methodText)}</div>` : '')}
        ${linkedAcc ? `<div class="goal-sub">🔗 ${esc(linkedAcc.name)}</div>` : ''}
        ${noteFull ? `<div class="goal-sub note-full">${esc(noteFull)}</div>` : ''}
      </div>
      <button class="icon-btn sm" onclick="debtMenu('${d.id}')">⋯</button>
    </div>
    <div class="goal-amt"><b>${money(remain)}</b><span> / ${money(amount)}</span></div>
    <div class="bar-track"><div class="bar-fill ${d.status==='paid'?'alt':'debt'}" style="width:${pct.toFixed(1)}%"></div></div>
    <div class="goal-foot"><span>${esc(t('debtPaid'))}: ${money(paid)}</span><span>${esc(t('debtRemain'))}: ${money(remain)}</span></div>
    <div class="debt-acts">
      ${d.status !== 'paid' && d.status !== 'cancelled' ? `<button class="btn soft" onclick="openDebtRepay('${d.id}')">${esc(t('debtRepay'))}</button>` : ''}
      <button class="btn soft" onclick="openDebtForm('${d.id}')">${esc(t('edit'))}</button>
      <button class="btn soft" onclick="debtMenu('${d.id}')">${esc(t('assetMore'))}</button>
    </div>
  </div>`;
}

      <div class="field"><span class="field-label">${esc(t('mgPurpose'))}</span>${renderPurposePickerButton('mg', editing?editing.purpose:initialPurpose, editing?editing.purposeCustom:'')}</div>
      <div class="field"><span class="field-label">${esc(t('mgMethod'))}</span>${renderMethodPickerButton(editing?editing.method:initialMethod, methodLabel(editing?editing.method:initialMethod), editing?editing.methodCustom:'')}
        <p class="hint" style="margin-top:6px">${esc(t('mgMethodHint'))}</p>
      </div>
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('mgDate'))}</span><input name="date" type="date" required value="${editing?localDateStr(editing.eventAt||editing.date):nowLocalDate()}"></label>
        <label class="field"><span class="field-label">${esc(t('mgTime'))}</span><input name="time" type="time" step="1" required value="${editing?localTimeSecStr(editing.eventAt||editing.date):nowLocalTime()}"></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('mgNote'))}</span><textarea name="note" maxlength="4000">${editing?esc(editing.note||''):''}</textarea></label>
      <p class="hint">${esc(t('mgImportantNote'))}</p>`,
    onSubmit(d){
      const person = (d.person || '').trim();
      const amount = round2(parseFloat(d.amount));
      if(!person){ toast(t('catEnterName')); return false; }
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      const acc = getAccount(d.accountId);
      if(!acc){ toast(t('accountNotExist')); return false; }
      const eventAt = combineDateTime(d.date || nowLocalDate(), d.time || nowLocalTime());
      const nature = d.nature || 'gift';

      if(editing){
        // 回滚旧账户扣款
        const oldAcc = getAccount(editing.accountId);
        if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) + Number(editing.amount||0));
        // 回滚旧关联欠款（如果有）
        if(editing.linkedDebtId){
          const oldDebt = getDebt(editing.linkedDebtId);
          if(oldDebt){
            // 仅回滚关联标记，不修改账户余额，因为钱已经通过 Money Given 扣除
            oldDebt.linkedMoneyGivenId = null;
          }
        }
        if(round2(Number(acc.balance)||0) < amount){
          if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) - Number(editing.amount||0));
          toast(t('insufficientBalance')); return false;
        }
        acc.balance = round2((Number(acc.balance)||0) - amount);
        editing.person = person; editing.amount = amount; editing.accountId = acc.id;
        editing.purpose = (d.purpose || '').trim();
        editing.purposeCustom = (d.purposeCustom || '').trim();
        editing.method = (d.method || '').trim();
        editing.methodCustom = (d.methodCustom || '').trim();
        editing.giftType = d.purpose || editing.giftType || 'gift';
        editing.nature = nature;
        editing.sourceAccountId = acc.id;
        editing.eventAt = eventAt;
        editing.date = eventAt;
        editing.note = (d.note || '');
        editing.updatedAt = Date.now();
        if(!Array.isArray(editing.editHistory)) editing.editHistory = [];
        editing.editHistory.push(Date.now());
        // 若性质从 loan 变为非 loan，解除旧关联
        if(nature !== 'loan' && editing.linkedDebtId){
          const oldDebt = getDebt(editing.linkedDebtId);
          if(oldDebt) oldDebt.linkedMoneyGivenId = null;
          editing.linkedDebtId = null;
        }
        // 若性质从非 loan 变为 loan，建立新关联欠款
        if(nature === 'loan' && !editing.linkedDebtId){
          const eventId = editing.eventId || ('EVT-' + Date.now().toString(36).toUpperCase());
          const debt = {
            id: uid(), eventId,
            direction: 'owe_me', person, amount: amount,
            purpose: 'friend_borrow', purposeCustom: '',
            method: (d.method || '').trim(), methodCustom: (d.methodCustom || '').trim(),
            eventAt, date: eventAt,
            timezone: 'Asia/Kuala_Lumpur',
            dueDate: '', reason: t('debtCreatedFromMoneyGiven'),
            paid: 0, payments: [], status: 'unpaid',
            linkMode: 'record_only', linkedAccountId: null,
            linkedMoneyGivenId: editing.id,
            editHistory: [],
            createdAt: Date.now(), updatedAt: Date.now()
          };
          state.debts.push(debt);
          editing.linkedDebtId = debt.id;
        } else if(nature === 'loan' && editing.linkedDebtId){
          const debt = getDebt(editing.linkedDebtId);
          if(debt){
            debt.person = person;
            debt.amount = amount;
            debt.eventAt = eventAt; debt.date = eventAt;
            debt.updatedAt = Date.now();
          }
        }
        afterChange(); toast(t('mgUpdated'));
      }else{
        if(round2(Number(acc.balance)||0) < amount){ toast(t('insufficientBalance')); return false; }
        acc.balance = round2((Number(acc.balance)||0) - amount);
        const eventId = 'EVT-' + Date.now().toString(36).toUpperCase();
        const mg = {
          id: uid(), eventId,
          person, amount, accountId: acc.id,
          sourceAccountId: acc.id,
          nature,
          purpose: (d.purpose || '').trim(),
          purposeCustom: (d.purposeCustom || '').trim(),
          method: (d.method || '').trim(),
          methodCustom: (d.methodCustom || '').trim(),
          giftType: d.purpose || 'gift',
          eventAt, date: eventAt,
          timezone: 'Asia/Kuala_Lumpur',
          note: (d.note || ''),
          linkedDebtId: null,
          editHistory: [],
          createdAt: Date.now(), updatedAt: Date.now()
        };
        // 若性质为 loan，建立关联欠款（仅记录，不重复扣款）
        if(nature === 'loan'){
          const debt = {
            id: uid(), eventId,
            direction: 'owe_me', person, amount: amount,
            purpose: 'friend_borrow', purposeCustom: '',
            method: (d.method || '').trim(), methodCustom: (d.methodCustom || '').trim(),
            eventAt, date: eventAt,
            timezone: 'Asia/Kuala_Lumpur',
            dueDate: '', reason: t('debtCreatedFromMoneyGiven'),
            paid: 0, payments: [], status: 'unpaid',
            linkMode: 'record_only', linkedAccountId: null,
            linkedMoneyGivenId: mg.id,
            editHistory: [],
            createdAt: Date.now(), updatedAt: Date.now()
          };
          state.debts.push(debt);
          mg.linkedDebtId = debt.id;
        }
        state.moneyGiven.push(mg);
        saveState();
        afterChange(); toast(nature === 'loan' ? t('mgCreated') + ' · ' + t('mgLoanDebtCreated') : t('mgCreated'));
      }
      return true;
    },
    afterRender(root){
      bindPurposePicker(root, 'mg'); bindMethodPicker(root);
      const sel = root.querySelector('#mg-nature');
      const hint = root.querySelector('#mg-nature-hint');
      if(sel && hint){
        const update = () => {

        };
        sel.addEventListener('change', update);
        update();
      }
    }
  });

function openTxMenu(id){
  const tx = state.transactions.find(x => x.id === id);

  const labelMap = { income:t('income'), expense:t('expense'), transfer:t('transfer'), goal_deposit:t('goalDeposit'), goal_withdraw:t('goalWithdraw') };
  const acts = [];
  if(tx.type === 'income' || tx.type === 'expense'){
    acts.push({ label: t('edit'), icon:'✏️', onClick: () => editTransaction(id) });
  }
  acts.push({ label: t('delete'), icon:'🗑', danger:true, onClick: () => deleteTransaction(id) });
  openActionSheet(labelMap[tx.type] || 'Record', acts);
}
function deleteConfirmTitleFor(type){
  switch(type){
    case 'income': case 'expense': return t('delTxTitle');
    case 'transfer':     return t('delTransferTitle');
    case 'goal_deposit': return t('delGoalDepositTitle');
    case 'goal_withdraw':return t('delGoalWithdrawTitle');
    default:             return t('delTxTitle');
  }
}
function editTransaction(id){
  const tx = state.transactions.find(x => x.id === id);
  if(!tx) return;
  const isIncome = tx.type === 'income';
  const initialCat = tx.category;
  const initialLabel = isIncome ? incomeDisplayLabel(initialCat) : expenseDisplayLabel(initialCat);
  const initialMethodId = tx.method || '';
  const initialMethodCustom = tx.methodCustom || '';
  const initialMethodLabel = initialMethodCustom || methodDisplay(initialMethodId);
  openSheet({
    title: isIncome ? t('recordIncome') : t('recordExpense'), submitText: t('save'),
    body: `
      <label class="field"><span class="field-label">${esc(t('amount'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="amount" type="number" step="0.01" min="0.01" required value="${tx.amount}" inputmode="decimal"></div>
      </label>
      <div class="field"><span class="field-label">${esc(t('category'))}</span>${renderCategoryPickerButton(isIncome?'income':'expense', initialCat, initialLabel)}</div>
      <div class="field"><span class="field-label">${esc(isIncome ? t('incomeMethod') : t('expenseMethod'))}</span>${renderMethodPickerButton(initialMethodId, initialMethodLabel, initialMethodCustom)}</div>
      <label class="field"><span class="field-label">${esc(t('account'))}</span>
        <select name="accountId">${state.accounts.map(a => `<option value="${a.id}" ${a.id===tx.accountId?'selected':''}>${esc(a.name)}（${fmtNum(a.balance||0)}）</option>`).join('')}</select>
      </label>
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('date'))}</span><input name="date" type="date" value="${localDateStr(tx.eventAt||tx.date)}" required></label>
        <label class="field"><span class="field-label">${esc(t('time'))}</span><input name="time" type="time" step="1" value="${localTimeSecStr(tx.eventAt||tx.date)}" required></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('note'))}</span><textarea name="note" maxlength="4000">${esc(tx.note||'')}</textarea></label>`,
    onSubmit(d){
      const newAmount = round2(parseFloat(d.amount));
      if(!(newAmount > 0)){ toast(t('invalidAmount')); return false; }
      if(tx.type === 'income'){
        const oldAcc = getAccount(tx.accountId);
        if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) - Number(tx.amount));
      }else{
        const oldAcc = getAccount(tx.accountId);
        if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) + Number(tx.amount));
      }
      const newAcc = getAccount(d.accountId);
      if(!newAcc){ toast(t('accountNotExist')); return false; }
      if(tx.type === 'expense' && round2(Number(newAcc.balance)||0) < newAmount){
        if(tx.type === 'income'){ const oldAcc = getAccount(tx.accountId); if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) + Number(tx.amount)); }
        else { const oldAcc = getAccount(tx.accountId); if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) - Number(tx.amount)); }
        toast(t('insufficientBalance')); return false;
      }
      if(tx.type === 'income'){ newAcc.balance = round2((Number(newAcc.balance)||0) + newAmount); }
      else { newAcc.balance = round2((Number(newAcc.balance)||0) - newAmount); }
      tx.amount = newAmount;
      tx.category = d.category || tx.category;
      tx.method = d.method || '';
      tx.methodCustom = d.methodCustom || '';
      tx.accountId = newAcc.id;
      const newEventAt = combineDateTime(d.date || localDateStr(tx.eventAt||tx.date), d.time || localTimeSecStr(tx.eventAt||tx.date));
      tx.eventAt = newEventAt; tx.date = newEventAt;
      tx.note = (d.note || '');
      tx.updatedAt = Date.now();
      if(!Array.isArray(tx.editHistory)) tx.editHistory = [];
      tx.editHistory.push(Date.now());
      afterChange(); toast(t('accountUpdated')); return true;
    },
    afterRender(root){ bindCategoryPicker(root, isIncome?'income':'expense'); bindMethodPicker(root); }
  });
}
function deleteTransaction(id){
  const tx = state.transactions.find(x => x.id === id);
  if(!tx) return;
  confirmDialog(deleteConfirmTitleFor(tx.type), () => {
    try{
      switch(tx.type){
        case 'income': { const a = getAccount(tx.accountId); if(a) a.balance = round2((Number(a.balance)||0) - Number(tx.amount)); break; }
        case 'expense': { const a = getAccount(tx.accountId); if(a) a.balance = round2((Number(a.balance)||0) + Number(tx.amount)); break; }
        case 'transfer': {
          const f = getAccount(tx.accountId), to = getAccount(tx.toAccountId);
          if(f)  f.balance  = round2((Number(f.balance)||0)  + Number(tx.amount));
          if(to) to.balance = round2((Number(to.balance)||0) - Number(tx.amount));
          break;
        }
        case 'goal_deposit': {
          const a = getAccount(tx.accountId), g = getGoal(tx.goalId);
          if(a) a.balance = round2((Number(a.balance)||0) + Number(tx.amount));
          if(g) g.saved   = round2((Number(g.saved)||0)   - Number(tx.amount));
          break;
        }
        case 'goal_withdraw': {
          const a = getAccount(tx.accountId), g = getGoal(tx.goalId);
          if(a) a.balance = round2((Number(a.balance)||0) - Number(tx.amount));
          if(g) g.saved   = round2((Number(g.saved)||0)   + Number(tx.amount));
          break;
        }
      }
    }catch(e){}
    state.transactions = state.transactions.filter(x => x.id !== id);
    state.goals.forEach(g => { if(Number(g.saved) < 0) g.saved = 0; });
    afterChange(); toast(t('accountDeleted'));
  });
}

  if(!g) return;

  const saved = round2(Number(g.saved)||0);

      <label class="field"><span class="field-label">${esc(t('amount'))}</span>

        eventAt, date: eventAt,
        timezone: 'Asia/Kuala_Lumpur',
        accountId: acc.id, goalId: g.id, category: 'Savings', note: '',
        editHistory: [],
        createdAt: Date.now(), updatedAt: Date.now()
      });
      afterChange(); toast(t('goalWithdrew')); return true;
    }
  });
}
function cancelGoal(id){
  const g = getGoal(id);
  if(!g) return;
  const saved = round2(Number(g.saved)||0);
  if(saved <= 0){
    confirmDialog(t('goalDeleteConfirm'), () => {
      state.goals = state.goals.filter(x => x.id !== id);
      afterChange(); toast(t('goalDeleted'));
    });
    return;
  }
  if(!state.accounts.length){ toast(t('noAccountWarn')); return; }
  openSheet({
    title: t('goalCancelTitle'), submitText: t('goalCancelBtn'),
    body: `
      <p class="hint" style="margin-bottom:14px">${esc(t('goalCancelHint', { amt: money(saved) }))}</p>
      <label class="field"><span class="field-label">${esc(t('goalReturnAccount'))}</span><select name="accountId">${accountOptions()}</select></label>`,
    onSubmit(d){
      const acc = getAccount(d.accountId);
      if(!acc){ toast(t('accountNotExist')); return false; }
      acc.balance = round2((Number(acc.balance)||0) + saved);
      const eventAt = nowISO();
      state.transactions.push({
        id: uid(), type: 'goal_withdraw', amount: saved,
        eventAt, date: eventAt,
        timezone: 'Asia/Kuala_Lumpur',
        accountId: acc.id, goalId: g.id, category: 'Savings', note: 'Goal cancelled',
        editHistory: [],
        createdAt: Date.now(), updatedAt: Date.now()
      });
      state.goals = state.goals.filter(x => x.id !== id);
      afterChange(); toast(t('goalCancelled')); return true;
    }
  });
}
function openAssetForm(){
  openSheet({
    title: t('assetNew'), submitText: t('assetAdd'),
    body: `
      <label class="field"><span class="field-label">${esc(t('assetName'))}</span><input name="name" type="text" required maxlength="80" placeholder="${esc(t('assetNamePlaceholder'))}"></label>
      <label class="field"><span class="field-label">${esc(t('assetPrice'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="price" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal"></div>
      </label>
      <label class="field"><span class="field-label">${esc(t('assetPurchaseDate'))}</span><input name="purchaseDate" type="date" value="${nowLocalDate()}" required></label>
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('assetYears'))}</span><input name="years" type="number" min="0" step="1" value="1" inputmode="numeric"></label>
        <label class="field"><span class="field-label">${esc(t('assetMonths'))}</span><input name="months" type="number" min="0" max="11" step="1" value="0" inputmode="numeric"></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('assetNote'))}</span><textarea name="note" maxlength="4000" placeholder="${esc(t('assetNotePlaceholder'))}"></textarea></label>
      <p class="hint">${esc(t('assetHint'))}</p>`,
    onSubmit(d){
      const name = (d.name || '').trim();
      const price = round2(parseFloat(d.price));
      const years = Math.max(0, parseInt(d.years, 10) || 0);
      const months = Math.max(0, parseInt(d.months, 10) || 0);
      if(!name){ toast(t('assetValidName')); return false; }
      if(!(price > 0)){ toast(t('assetValidPrice')); return false; }
      if(years * 365 + months * 30 <= 0){ toast(t('assetValidPeriod')); return false; }
      state.assets.push({ id: uid(), name, price, purchaseDate: d.purchaseDate || nowLocalDate(), expectedYears: years, expectedMonths: months, endDate: null, status: 'active', manualValue: null, manualNote: '', note: (d.note || ''), editHistory: [], createdAt: Date.now() });
      afterChange(); toast(t('assetAdded')); return true;
    }
  });
}
function assetMenu(id){
  const a = getAsset(id);
  if(!a) return;
  openActionSheet(a.name, [
    { label: t('edit'), icon:'✏️', onClick: () => editAsset(id) },
    { label: t('assetDelete'), icon:'🗑', danger:true, onClick: () => {
      confirmDialog(t('assetDeleteConfirm'), () => {
        state.assets = state.assets.filter(x => x.id !== id);
        afterChange(); toast(t('assetDeleted'));
      });
    } }
  ]);
}
function editAsset(id){
  const a = getAsset(id);
  if(!a) return;
  openSheet({
    title: t('assetEdit'),
    body: `
      <label class="field"><span class="field-label">${esc(t('assetName'))}</span><input name="name" type="text" required maxlength="80" value="${esc(a.name)}"></label>
      <label class="field"><span class="field-label">${esc(t('assetPrice'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="price" type="number" step="0.01" min="0.01" required value="${a.price}"></div>
      </label>
      <label class="field"><span class="field-label">${esc(t('assetPurchaseDate'))}</span><input name="purchaseDate" type="date" value="${a.purchaseDate}" required></label>
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('assetYears'))}</span><input name="years" type="number" min="0" step="1" value="${a.expectedYears||0}" inputmode="numeric"></label>
        <label class="field"><span class="field-label">${esc(t('assetMonths'))}</span><input name="months" type="number" min="0" max="11" step="1" value="${a.expectedMonths||0}" inputmode="numeric"></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('assetNote'))}</span><textarea name="note" maxlength="4000">${esc(a.note||'')}</textarea></label>`,
    onSubmit(d){
      const name = (d.name || '').trim();
      const price = round2(parseFloat(d.price));
      const years = Math.max(0, parseInt(d.years, 10) || 0);
      const months = Math.max(0, parseInt(d.months, 10) || 0);
      if(!name || !(price > 0)){ toast(t('assetValidPrice')); return false; }
      if(years * 365 + months * 30 <= 0){ toast(t('assetValidPeriod')); return false; }
      a.name = name; a.price = price; a.purchaseDate = d.purchaseDate || a.purchaseDate;
      a.expectedYears = years; a.expectedMonths = months; a.note = (d.note || '');
      if(!Array.isArray(a.editHistory)) a.editHistory = [];
      a.editHistory.push(Date.now());
      afterChange(); toast(t('assetUpdated')); return true;
    }
  });
}
function openAssetAdjust(id){
  const a = getAsset(id);
  if(!a) return;
  const c = assetCalc(a);
  openSheet({
    title: t('assetAdjustTitle'), submitText: t('assetAdjustBtn'),
    body: `
      <div class="asset-rows" style="margin-bottom:16px">
        <div class="ar"><span>${esc(t('assetSystemValue'))}</span><b>${money(c.systemValue)}</b></div>
        <div class="ar"><span>${esc(t('assetPrice'))}</span><b>${money(c.price)}</b></div>
      </div>
      <label class="field"><span class="field-label">${esc(t('assetAdjustValue'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="manualValue" type="number" step="0.01" min="0" placeholder="${esc(t('assetAdjustPlaceholder'))}" value="${c.hasManual ? a.manualValue : ''}" inputmode="decimal"></div>
      </label>
      <label class="field"><span class="field-label">${esc(t('assetAdjustReason'))}</span><textarea name="manualNote" maxlength="4000">${esc(a.manualNote||'')}</textarea></label>
      <p class="hint">${esc(t('assetAdjustHint'))}</p>`,
    onSubmit(d){
      const raw = String(d.manualValue || '').trim();
      if(raw === ''){ a.manualValue = null; }
      else {
        const v = round2(parseFloat(raw));
        if(!(v >= 0)){ toast(t('invalidAmount')); return false; }
        if(v > a.price){ toast(t('assetAdjustExceed')); return false; }
        a.manualValue = v;
      }
      a.manualNote = (d.manualNote || '');
      if(!Array.isArray(a.editHistory)) a.editHistory = [];
      a.editHistory.push(Date.now());
      afterChange(); toast(t('assetAdjusted')); return true;
    }
  });
}
function openAssetEnd(id){
  const a = getAsset(id);
  if(!a) return;
  const c = assetCalc(a);
  openSheet({
    title: t('assetEndTitle'), submitText: t('assetEndBtn'),
    body: `
      <div class="asset-rows" style="margin-bottom:16px">
        <div class="ar"><span>${esc(t('assetSystemValue'))}</span><b>${money(c.systemValue)}</b></div>
        <div class="ar"><span>${esc(t('assetUsedDays'))}</span><b>${c.usedDays.toFixed(1)}</b></div>
      </div>
      <label class="field"><span class="field-label">${esc(t('assetEndReason'))}</span>
        <select name="status">
          <option value="completed">✅ ${esc(t('assetStatusCompleted'))}</option>
          <option value="ended">⏹ ${esc(t('assetStatusEnded'))}</option>
          <option value="damaged">💥 ${esc(t('assetStatusDamaged'))}</option>
          <option value="lost">🔍 ${esc(t('assetStatusLost'))}</option>
          <option value="sold">💰 ${esc(t('assetStatusSold'))}</option>
          <option value="stopped">🚫 ${esc(t('assetStatusStopped'))}</option>
        </select>
      </label>
      <label class="field"><span class="field-label">${esc(t('assetEndDate'))}</span><input name="endDate" type="date" value="${nowLocalDate()}" required></label>
      <p class="hint">${esc(t('assetEndHint'))}</p>`,
    onSubmit(d){
      const endDate = d.endDate || nowLocalDate();
      if(new Date(endDate) < new Date(a.purchaseDate)){ toast(t('assetEndBeforeBuy')); return false; }
      a.endDate = endDate; a.status = d.status || 'ended';
      if(!Array.isArray(a.editHistory)) a.editHistory = [];
      a.editHistory.push(Date.now());
      afterChange(); toast(t('assetEnded')); return true;
    }
  });
}

/* =========================================================================
   启动
   ========================================================================= */
(function boot(){
  state.accounts.forEach(a => { a.balance = round2(Number(a.balance) || 0); });
  state.goals.forEach(g => { g.saved = round2(Number(g.saved) || 0); g.targetAmount = round2(Number(g.targetAmount) || 0); });
  state.debts.forEach(d => {
    d.amount = round2(Number(d.amount)||0);
    d.paid = round2(Number(d.paid)||0);
    if(!Array.isArray(d.payments)) d.payments = [];
  });
  state.moneyGiven.forEach(m => { m.amount = round2(Number(m.amount)||0); });
  if(lockRecord && lockRecord.hash && !lockRecord.type){ lockRecord.type = 'pin'; saveLock(lockRecord); }
  if(APP_VERSION && APP_VERSION > (META.appVersion || '0')){ META.appVersion = APP_VERSION; }
  META.dataVersion = DATA_VERSION;
  META.lastUpdated = new Date().toISOString();
  saveMeta(META);
  if(loadResult.migrationFailed){ setTimeout(() => toast(t('migrationFailed')), 800); }
  if(loadResult.parseError){ setTimeout(() => toast(t('migrationFailed')), 800); }
  saveChangelog();
  saveState();
  checkAchievements();
  if(lockRecord && lockRecord.hash){ isUnlocked = false; lockUI.mode = 'unlock'; }
  else { isUnlocked = false; lockUI.mode = 'create'; }
  renderLock();
  render({ top:true });
  console.log('[Jiheng] v' + APP_VERSION + ' ready.');
})();

window.addEventListener('storage', e => {
  if(e.key === STORAGE_KEY){
    const r = loadState();
    if(!r.migrationFailed && !r.parseError){
      state = r.state;
      LANG = state.settings.lang || LANG;
      if(isUnlocked) render();
    }
  }
  if(e.key === LOCK_KEY){ lockRecord = loadLock(); if(!lockRecord){ isUnlocked = true; renderLock(); render({ top:true }); } }
  if(e.key === META_KEY){ META = loadMeta(); if(isUnlocked) render(); }
});
</script>
</body>
</html>
