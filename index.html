<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b4b8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="积衡 Jiheng">
<meta name="format-detection" content="telephone=no">
<title>积衡 Jiheng · 个人财务记录</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{margin:0;padding:0;height:100%;}
:root{
  --brand:#5b4b8a;--brand-2:#8a7bb8;--brand-3:#c9bfe8;--brand-soft:#f1eef9;
  --accent:#c9a961;--accent-soft:#f7f1e2;
  --bg:#f7f6fb;--card:#fff;--text:#1c1830;--muted:#8a86a0;--line:#ecebf4;
  --green:#0e9b6b;--red:#d9534f;--amber:#c9914b;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --shadow:0 2px 12px rgba(91,75,138,.06);
  --shadow-brand:0 10px 26px rgba(91,75,138,.24);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Helvetica Neue',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;overflow-x:hidden;
  word-wrap:break-word;overflow-wrap:anywhere;
}
body.no-scroll{overflow:hidden;}
button{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;}
img,svg,video{max-width:100%;height:auto;display:block;}
#app{
  max-width:560px;margin:0 auto;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding-left:var(--safe-l);padding-right:var(--safe-r);
  padding-bottom:0;
  overflow:hidden;
}
@media (min-width:561px){ #app{max-width:600px;box-shadow:0 0 60px rgba(91,75,138,.08);background:var(--bg);} }
@media (min-width:900px){ #app{max-width:720px;} }
@media (min-width:1200px){ #app{max-width:860px;} }
.jiheng-wordmark{display:inline-flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:-.5px;line-height:1;flex-wrap:wrap;}
.jiheng-wordmark .zh{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#5b4b8a 0%,#8a7bb8 60%,#c9a961 100%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;}
.jiheng-wordmark .zh::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:linear-gradient(90deg,#5b4b8a 0%,#c9a961 100%);opacity:.35;}
.jiheng-wordmark .en{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--brand);opacity:.75;}
.jiheng-wordmark.light .zh{background:linear-gradient(135deg,#ffffff 0%,#e8e2f5 50%,#e6d3a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.jiheng-wordmark.light .zh::after{background:linear-gradient(90deg,#fff 0%,#e6d3a8 100%);opacity:.5;}
.jiheng-wordmark.light .en{color:#fff;opacity:.85;}
.topbar{flex:0 0 auto;position:relative;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + var(--safe-t)) 16px 12px;background:rgba(247,246,251,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);}
.topbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;color:var(--brand);min-width:0;overflow-wrap:anywhere;word-break:break-word;line-height:1.4;text-align:center;flex:1;}
.topbar.brand{padding-top:calc(10px + var(--safe-t));}
.icon-btn{width:38px;height:38px;min-width:38px;border-radius:12px;border:none;background:#fff;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--brand);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s;line-height:1;}
.icon-btn:active{transform:scale(.92);}
.icon-btn.sm{width:30px;height:30px;min-width:30px;font-size:14px;border-radius:10px;box-shadow:none;background:var(--brand-soft);}
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + 92px + var(--safe-b));display:flex;flex-direction:column;gap:14px;}
section{display:flex;flex-direction:column;gap:10px;min-width:0;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.section-head h3{font-size:15px;font-weight:700;margin:0;color:var(--brand);overflow-wrap:anywhere;word-break:break-word;line-height:1.4;min-width:0;}
.link{background:none;border:none;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px;line-height:1.4;flex:0 0 auto;}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);overflow-wrap:anywhere;word-break:break-word;min-width:0;}
.list{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;}
.list .row+.row{border-top:1px solid var(--line);}
.c-green{color:var(--green)!important;}
.c-red{color:var(--red)!important;}
.c-muted{color:var(--muted)!important;}
.c-amber{color:var(--amber)!important;}
.product-notice{background:linear-gradient(135deg,#fff 0%,var(--brand-soft) 100%);border:1.5px solid var(--brand-3);border-radius:18px;padding:14px 14px 12px;box-shadow:0 4px 16px rgba(91,75,138,.10);}
.product-notice .pn-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.product-notice .pn-icon{width:26px;height:26px;min-width:26px;border-radius:8px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:0 0 auto;line-height:1;}
.product-notice .pn-title{font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.4px;text-transform:uppercase;overflow-wrap:anywhere;word-break:break-word;line-height:1.4;min-width:0;}
.product-notice .pn-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;}
.product-notice .pn-row+.pn-row{border-top:1px dashed var(--brand-3);}
.product-notice .pn-flag{font-size:10.5px;font-weight:800;color:#fff;background:var(--brand);padding:3px 7px;border-radius:6px;letter-spacing:.4px;flex:0 0 auto;margin-top:2px;min-width:34px;text-align:center;line-height:1.3;}
.product-notice .pn-text{font-size:12.5px;line-height:1.6;color:var(--text);font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
.product-notice .pn-text b{color:var(--brand);font-weight:800;}
.lock-screen{
  position:fixed;inset:0;z-index:500;
  background:linear-gradient(160deg,#3d3158 0%,#5b4b8a 55%,#8a7bb8 100%);
  display:flex;flex-direction:column;
  padding:calc(8px + var(--safe-t)) calc(16px + var(--safe-l)) calc(8px + var(--safe-b)) calc(16px + var(--safe-r));
  color:#fff;
    overflow:hidden;
  -webkit-overflow-scrolling:touch;
  min-height:100vh;min-height:100dvh;
  isolation:isolate;
}
.lock-screen::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(201,169,97,.08);top:-120px;right:-100px;pointer-events:none;z-index:0;}
.lock-screen::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-80px;left:-60px;pointer-events:none;z-index:0;}
.lock-header{position:relative;z-index:2;text-align:center;flex:0 0 auto;padding:6px 0 8px;}
.lock-sub{font-size:10.5px;opacity:.85;line-height:1.5;letter-spacing:.3px;margin-top:6px;overflow-wrap:anywhere;word-break:break-word;}
.lock-mid{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:12px 0;}
.lock-title{font-size:15px;font-weight:700;margin:0 0 10px;text-align:center;line-height:1.5;flex:0 0 auto;overflow-wrap:anywhere;word-break:break-word;max-width:100%;}
.lock-info{font-size:11px;opacity:.9;text-align:center;max-width:340px;margin:0 auto 10px;line-height:1.6;flex:0 0 auto;overflow-wrap:anywhere;word-break:break-word;padding:0 4px;}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:8px;flex:0 0 auto;flex-wrap:wrap;}
.pin-dot{width:14px;height:14px;min-width:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);transition:background .15s,border-color .15s,transform .15s;flex:0 0 auto;}
.pin-dot.filled{background:#fff;border-color:#fff;transform:scale(1.1);}
.pin-dot.error{border-color:#ff8a8a;background:#ff8a8a;}
.lock-msg{min-height:18px;font-size:12px;margin:0 0 10px;color:#ffd6d6;font-weight:600;text-align:center;line-height:1.5;flex:0 0 auto;overflow-wrap:anywhere;word-break:break-word;padding:0 4px;width:100%;}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:280px;flex:0 0 auto;}
.key{min-height:46px;height:auto;padding:10px 6px;border-radius:14px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:19px;font-weight:600;line-height:1.2;cursor:pointer;transition:background .1s,transform .1s;-webkit-user-select:none;user-select:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;word-break:break-word;min-width:0;}
.key:active{transform:scale(.94);background:rgba(255,255,255,.30);}
.key.fn{font-size:12px;font-weight:700;background:transparent;line-height:1.3;}
.key.fn:active{background:rgba(255,255,255,.14);}
.key.enter{background:var(--accent);color:#3d3158;font-size:13px;font-weight:800;line-height:1.3;padding:12px 8px;}
.key.enter:active{background:#dbb977;}
.lock-input-wrap{width:100%;max-width:280px;margin:0 auto;flex:0 0 auto;}
.lock-input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font-size:16px;outline:none;text-align:center;font-weight:600;letter-spacing:.5px;line-height:1.4;box-sizing:border-box;min-width:0;}
.lock-input::placeholder{color:rgba(255,255,255,.55);letter-spacing:0;font-size:14px;}
.lock-input:focus{border-color:#fff;background:rgba(255,255,255,.20);}
.lock-ok-btn{width:100%;max-width:280px;margin-top:10px;background:var(--accent);color:#3d3158;border:none;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:800;line-height:1.4;cursor:pointer;overflow-wrap:anywhere;word-break:break-word;text-align:center;}
.lock-ok-btn:active{background:#dbb977;}
.lock-notice-scroll{position:relative;z-index:2;flex:0 0 auto;background:rgba(0,0,0,.24);border-radius:14px;border:1.5px solid rgba(255,255,255,.28);max-height:32vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-top:10px;padding:10px 12px;}
.lock-notice-scroll .ln-title{font-size:11px;font-weight:800;letter-spacing:.5px;opacity:.9;margin-bottom:6px;text-transform:uppercase;line-height:1.5;overflow-wrap:anywhere;word-break:break-word;}
.lock-notice-scroll .ln-row{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.6;overflow-wrap:anywhere;word-break:break-word;}
.lock-notice-scroll .ln-row+.ln-row{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.25);}
.lock-notice-scroll .ln-flag{font-size:10px;font-weight:800;color:#3d3158;background:var(--accent);padding:2px 7px;border-radius:5px;letter-spacing:.4px;flex:0 0 auto;margin-top:1px;min-width:30px;text-align:center;line-height:1.3;}
.lock-notice-scroll .ln-text{flex:1;min-width:0;opacity:.98;font-weight:500;overflow-wrap:anywhere;word-break:break-word;}
.lock-footer{position:relative;z-index:2;flex:0 0 auto;margin-top:10px;display:flex;flex-direction:column;gap:6px;width:100%;max-width:280px;align-self:center;}
.lock-footer button{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:12.5px;font-weight:600;padding:11px 14px;border-radius:12px;cursor:pointer;transition:background .14s;-webkit-user-select:none;user-select:none;touch-action:manipulation;line-height:1.4;overflow-wrap:anywhere;word-break:break-word;text-align:center;}
.lock-footer button:active{background:rgba(255,255,255,.28);}
@media (max-height:640px){
  .lock-header{padding:2px 0 4px;}
  .lock-title{font-size:14px;margin-bottom:8px;}
  .lock-info{font-size:10.5px;margin-bottom:8px;}
  .key{min-height:42px;font-size:17px;padding:8px 4px;}
  .key.enter{font-size:12px;padding:10px 6px;}
  .lock-notice-scroll{max-height:22vh;padding:8px 10px;margin-top:6px;}
  .lock-footer button{padding:9px 12px;font-size:12px;}
  .lock-footer{margin-top:6px;}
}
@media (max-height:560px){
  .lock-notice-scroll{max-height:16vh;}
  .lock-info{display:none;}
  .lock-sub{display:none;}
  .lock-title{margin-bottom:6px;font-size:13.5px;}
  .pin-dots{gap:10px;margin-bottom:6px;}
  .pin-dot{width:12px;height:12px;min-width:12px;}
}
@media (max-height:480px){
  .lock-notice-scroll{max-height:12vh;}
  .keypad{max-width:240px;gap:6px;}
  .key{min-height:38px;font-size:16px;padding:6px 4px;}
  .key.enter{font-size:11px;padding:8px 4px;}
}
@media (min-width:768px) and (min-height:900px){
  .lock-title{font-size:17px;}
  .lock-info{font-size:12px;}
  .keypad{max-width:320px;gap:10px;}
  .key{min-height:54px;font-size:21px;}
  .key.enter{font-size:14px;padding:14px 10px;}
  .lock-input-wrap{max-width:320px;}
  .lock-input{font-size:17px;padding:14px 16px;}
  .lock-ok-btn{max-width:320px;font-size:15px;padding:14px;}
  .lock-footer{max-width:320px;}
}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px;background:linear-gradient(135deg,#3d3158 0%,#5b4b8a 55%,#8a7bb8 100%);color:#fff;box-shadow:var(--shadow-brand);}
.hero::after{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(201,169,97,.10);top:-120px;right:-80px;pointer-events:none;}
.hero::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-90px;left:-40px;pointer-events:none;}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1;gap:8px;flex-wrap:wrap;}
.hero-label{font-size:13px;opacity:.9;font-weight:500;letter-spacing:.4px;line-height:1.4;overflow-wrap:anywhere;word-break:break-word;}
.hero-sub{font-size:10.5px;opacity:.72;margin-top:2px;letter-spacing:.2px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word;}
.eye-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;min-width:34px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:transform .12s;flex:0 0 auto;line-height:1;}
.eye-btn:active{transform:scale(.9);}
.hero-amount{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 18px;position:relative;z-index:1;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.15;overflow-wrap:anywhere;}
.hero-split{display:flex;position:relative;z-index:1;background:rgba(255,255,255,.13);border-radius:16px;padding:12px 14px;gap:12px;flex-wrap:wrap;}
.split-item{flex:1 1 0;display:flex;flex-direction:column;gap:3px;min-width:0;}
.split-item span{font-size:11.5px;opacity:.85;line-height:1.4;overflow-wrap:anywhere;word-break:break-word;}
.split-item b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere;word-break:break-all;}
.split-div{width:1px;background:rgba(255,255,255,.22);flex:0 0 auto;}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:340px){ .mini-row{grid-template-columns:1fr;} }
.mini{background:#fff;border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);min-width:0;}
.mini span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;line-height:1.4;overflow-wrap:anywhere;word-break:break-word;}
.mini b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.3;overflow-wrap:anywhere;}
.mini.tappable{cursor:pointer;transition:transform .12s;}
.mini.tappable:active{transform:scale(.98);}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
@media (max-width:380px){ .quick{grid-template-columns:repeat(2,minmax(0,1fr));} }
.quick button{background:#fff;border:none;border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--text);box-shadow:var(--shadow);cursor:pointer;font-weight:600;transition:transform .12s;line-height:1.35;overflow-wrap:anywhere;word-break:break-word;text-align:center;min-height:62px;min-width:0;}
.quick button:active{transform:scale(.94);}
.quick .qi{font-size:17px;line-height:1;color:var(--brand);}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;transition:background .12s;min-width:0;}
.row:active{background:#fafbfd;}
.row-icon{width:38px;height:38px;min-width:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;line-height:1;}
.row-main{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
.row-title{font-size:14.5px;font-weight:600;overflow-wrap:anywhere;word-break:break-word;line-height:1.4;}
.row-sub{font-size:12px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere;word-break:break-word;line-height:1.5;white-space:pre-wrap;}
.row-amount{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;line-height:1.3;}
.tx-amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;line-height:1.3;}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;overflow-wrap:anywhere;}
.empty p{margin:0 0 10px;}
.empty.big{padding:40px 20px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.7;line-height:1;}
.empty.big p{font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.5;}
.empty.big span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.btn{border:none;border-radius:13px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s;line-height:1.4;white-space:normal;overflow-wrap:anywhere;word-break:break-word;text-align:center;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(91,75,138,.28);}
.btn.ghost{background:#f2f1f7;color:var(--text);}
.btn.danger{background:var(--red);color:#fff;}
.btn.soft{background:var(--brand-soft);color:var(--brand);font-size:13.5px;padding:10px 14px;flex:1 1 0;min-width:0;}
.btn.sm{padding:9px 16px;font-size:13.5px;min-height:38px;}
.btn.block{width:100%;}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--shadow);gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:0 0 auto;border:none;background:none;padding:9px 14px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s;line-height:1.4;}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(91,75,138,.22);}
.day-group{display:flex;flex-direction:column;gap:8px;}

#splash-root .sp-word{display:flex;align-items:baseline;gap:12px;animation:spIn .9s cubic-bezier(.2,.8,.3,1) both;flex-wrap:wrap;justify-content:center;}
#splash-root .sp-zh{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:56px;font-weight:900;letter-spacing:8px;background:linear-gradient(135deg,#fff 0%,#e8e2f5 50%,#e6d3a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;line-height:1.1;}
#splash-root .sp-zh::after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff 0%,#e6d3a8 100%);opacity:.65;transform:scaleX(0);transform-origin:left;animation:spLine .9s .35s cubic-bezier(.2,.8,.3,1) forwards;}
#splash-root .sp-en{font-size:17px;font-weight:700;letter-spacing:7px;text-transform:uppercase;color:#fff;opacity:.88;animation:spIn .9s .12s cubic-bezier(.2,.8,.3,1) both;line-height:1.2;}
#splash-root .sp-slogan{font-size:11.5px;letter-spacing:2.5px;color:rgba(255,255,255,.72);animation:spIn .9s .28s cubic-bezier(.2,.8,.3,1) both;line-height:1.5;overflow-wrap:anywhere;word-break:break-word;max-width:320px;}
#splash-root .sp-dot{position:absolute;bottom:calc(64px + var(--safe-b));display:flex;gap:7px;}
#splash-root .sp-dot i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);animation:spPulse 1.25s ease-in-out infinite;}
#splash-root .sp-dot i:nth-child(2){animation-delay:.16s;}
#splash-root .sp-dot i:nth-child(3){animation-delay:.32s;}
@keyframes spIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes spLine{to{transform:scaleX(1);}}
@keyframes spPulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1);}}

  function detectLang(){
  try{
    const saved = localStorage.getItem(LANG_KEY);
    if(saved && I18N[saved]) return saved;
    for(const k of LEGACY_LANG_KEYS){
      const old = localStorage.getItem(k);
      if(old && I18N[old]) return old;
    }
  }catch(e){}
  const nav = (navigator.language || 'zh').toLowerCase();
  if(nav.startsWith('ms')) return 'ms';
  if(nav.startsWith('en')) return 'en';
  return 'zh';
}
let LANG = detectLang();
function t(k, vars){
  const pack = I18N[LANG] || I18N.zh;
  const zhPack = I18N.zh;
  let s = pack[k];
  if(s === undefined && pack.secure && pack.secure[k] !== undefined) s = pack.secure[k];
  if(s === undefined && zhPack[k] !== undefined) s = zhPack[k];
  if(s === undefined && zhPack.secure && zhPack.secure[k] !== undefined) s = zhPack.secure[k];
  if(s === undefined) s = k;
  if(typeof s !== 'string') return s;
  if(vars){ Object.keys(vars).forEach(v => { s = s.replace(new RegExp('\\{'+v+'\\}','g'), vars[v]); }); }
  return s;
}

function loadMeta(){
  try{
    const raw = localStorage.getItem(META_KEY) || (LEGACY_META_KEYS.map(k=>localStorage.getItem(k)).find(Boolean));
    if(!raw) return { appVersion: APP_VERSION, dataVersion: DATA_VERSION, lastUpdated: new Date().toISOString() };
    const m = JSON.parse(raw);
    return {
      appVersion: m.appVersion || APP_VERSION,
      dataVersion: Number(m.dataVersion) || DATA_VERSION,
      lastUpdated: m.lastUpdated || new Date().toISOString()
    };
  }catch(e){
    return { appVersion: APP_VERSION, dataVersion: DATA_VERSION, lastUpdated: new Date().toISOString() };
  }
}
function saveMeta(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }

function loadChangelog(){
  try{
    const raw = localStorage.getItem(CHANGELOG_KEY);
    if(!raw) return CHANGELOG_SEED.slice();
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return CHANGELOG_SEED.slice();
    const seen = new Set(arr.map(x => x.version));
    CHANGELOG_SEED.forEach(c => { if(!seen.has(c.version)) arr.push(c); });
    return arr;
  }catch(e){ return CHANGELOG_SEED.slice(); }
}
let CHANGELOG = loadChangelog();
function saveChangelog(){ try{ localStorage.setItem(CHANGELOG_KEY, JSON.stringify(CHANGELOG)); }catch(e){} }
function changelogTitle(entry){
  if(!entry || !entry.title) return '';
  if(typeof entry.title === 'string') return entry.title;
  return entry.title[LANG] || entry.title.zh || entry.title.en || '';
}
function changelogItems(entry){
  if(!entry || !entry.items) return [];
  if(Array.isArray(entry.items)) return entry.items;
  return entry.items[LANG] || entry.items.zh || entry.items.en || [];
}

/* ============================ 数据层 ============================ */
function defaultState(){
  return {
    dataVersion: DATA_VERSION,
    settings: {
      currency:'RM', hideBalance:false, autoLockMinutes:5, appLockEnabled:true,
      lang:LANG, lastUpdated:new Date().toISOString(),
      debtRepayAffectAccountDefault: true
    },
    accounts: [], transactions: [], goals: [], assets: [], debts: [], moneyGiven: [],
    customIncomeCats: [], customExpenseCats: [], customMethods: [],
    achievements: {}, createdAt: new Date().toISOString()
  };
}

function migrate(p){
  if(!p || typeof p !== 'object') return { ok:false, reason:'invalid', data:null };
  const original = JSON.parse(JSON.stringify(p));
  if(!Array.isArray(p.accounts)) p.accounts = [];
  if(!Array.isArray(p.transactions)) p.transactions = [];
  if(!Array.isArray(p.goals)) p.goals = [];
  if(!Array.isArray(p.assets)) p.assets = [];
  if(!Array.isArray(p.debts)) p.debts = [];
  if(!Array.isArray(p.moneyGiven)) p.moneyGiven = [];
  if(!Array.isArray(p.customIncomeCats)) p.customIncomeCats = [];
  if(!Array.isArray(p.customExpenseCats)) p.customExpenseCats = [];
  if(!Array.isArray(p.customMethods)) p.customMethods = [];
  if(!p.settings || typeof p.settings !== 'object') p.settings = {};
  if(p.settings.debtRepayAffectAccountDefault === undefined){
    p.settings.debtRepayAffectAccountDefault = true;
  }

  const TZ = APP_TZ;
  const _toISO = (v) => {
    if(!v) return nowISO();
    if(typeof v === 'number'){ try{ return new Date(v).toISOString(); }catch(e){ return nowISO(); } }
    const s = String(v);
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + 'T00:00:00').toISOString();
    if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s;
    const d = new Date(s);
    return isNaN(d.getTime()) ? nowISO() : d.toISOString();
  };
  const _normHistory = (arr) => {
    if(!Array.isArray(arr)) return [];
    return arr.map(x => {
      if(x && typeof x === 'object' && x.at) return { at: x.at, action: x.action || 'edit' };
      if(typeof x === 'number') return { at: new Date(x).toISOString(), action: 'edit' };
      if(typeof x === 'string') return { at: _toISO(x), action: 'edit' };
      return null;
    }).filter(Boolean);
  };

  p.transactions.forEach(tx => {
    if(tx.method === undefined) tx.method = '';
    if(tx.methodCustom === undefined) tx.methodCustom = '';
    if(!tx.timezone) tx.timezone = TZ;
    tx.editHistory = _normHistory(tx.editHistory);
    if(!tx.eventAt) tx.eventAt = _toISO(tx.date);
    if(!tx.createdAt) tx.createdAt = new Date(tx.eventAt).getTime();
    if(!tx.updatedAt) tx.updatedAt = tx.createdAt;
    if(tx.linkedDebtId === undefined) tx.linkedDebtId = null;
    if(tx.linkedRepaymentId === undefined) tx.linkedRepaymentId = null;
  });

  p.accounts.forEach(a => {
    if(a.note === undefined) a.note = '';
    if(!a.timezone) a.timezone = TZ;
    if(!a.eventAt) a.eventAt = _toISO(a.createdAt);
    if(!a.createdAt) a.createdAt = new Date(a.eventAt).getTime();
    if(!a.updatedAt) a.updatedAt = a.createdAt;
    a.editHistory = _normHistory(a.editHistory);
  });

  p.goals.forEach(g => {
    if(g.note === undefined) g.note = '';
    if(!g.timezone) g.timezone = TZ;
    if(!g.eventAt) g.eventAt = _toISO(g.createdAt);
    if(!g.createdAt) g.createdAt = new Date(g.eventAt).getTime();
    if(!g.updatedAt) g.updatedAt = g.createdAt;
    g.editHistory = _normHistory(g.editHistory);
  });

  p.assets.forEach(a => {
    if(a.note === undefined) a.note = '';
    if(a.manualNote === undefined) a.manualNote = '';
    if(!a.timezone) a.timezone = TZ;
    if(!a.eventAt) a.eventAt = _toISO(a.purchaseDate || a.createdAt);
    if(!a.createdAt) a.createdAt = new Date(a.eventAt).getTime();
    if(!a.updatedAt) a.updatedAt = a.createdAt;
    a.editHistory = _normHistory(a.editHistory);
  });

  p.debts.forEach(d => {
    if(d.purpose === undefined) d.purpose = '';
    if(d.purposeCustom === undefined) d.purposeCustom = '';
    if(d.method === undefined) d.method = '';
    if(d.methodCustom === undefined) d.methodCustom = '';
    if(d.reason === undefined) d.reason = '';
    if(d.paid === undefined) d.paid = 0;
    if(!d.status) d.status = 'unpaid';
    if(d.linkMode === undefined) d.linkMode = 'record_only';
    if(d.linkedAccountId === undefined) d.linkedAccountId = null;
    if(!d.timezone) d.timezone = TZ;
    if(!d.eventAt) d.eventAt = _toISO(d.date);
    if(!d.date) d.date = d.eventAt;
    if(!d.createdAt) d.createdAt = new Date(d.eventAt).getTime();
    if(!d.updatedAt) d.updatedAt = d.createdAt;
    if(!d.eventId) d.eventId = d.id;
    d.editHistory = _normHistory(d.editHistory);

    if(d.originalAmount === undefined) d.originalAmount = round2(Number(d.amount) || 0);
    if(d.note === undefined) d.note = d.reason || '';
    if(d.originalEventAt === undefined) d.originalEventAt = d.eventAt || _toISO(d.date);
    if(d.originalTransactionId === undefined) d.originalTransactionId = null;

    const oldPayments = Array.isArray(d.payments) ? d.payments : [];
    const existingRepayments = Array.isArray(d.repayments) ? d.repayments : [];
    if(existingRepayments.length === 0 && oldPayments.length > 0){
      d.repayments = oldPayments.map(pay => {
        const payEventAt = _toISO(pay.eventAt || pay.createdAt || d.eventAt);
        const payCreatedAt = Number(pay.createdAt) || new Date(payEventAt).getTime();
        return {
          id: pay.id || uid(),
          debtId: d.id,
          amount: round2(Number(pay.amount) || 0),
          accountId: pay.accountId || null,
          method: '',
          methodCustom: '',
          eventAt: payEventAt,
          createdAt: payCreatedAt,
          updatedAt: payCreatedAt,
          timezone: pay.timezone || TZ,
          note: pay.note || '',
          affectAccount: true,
          linkMode: 'account',
          transactionId: null,
          editHistory: []
        };
      });
    } else if(existingRepayments.length === 0){
      d.repayments = [];
    } else {
      d.repayments.forEach(r => {
        if(r.debtId === undefined) r.debtId = d.id;
        if(!Array.isArray(r.editHistory)) r.editHistory = _normHistory(r.editHistory);
        if(r.method === undefined) r.method = '';
        if(r.methodCustom === undefined) r.methodCustom = '';
        if(r.affectAccount === undefined) r.affectAccount = true;
        if(r.linkMode === undefined) r.linkMode = r.affectAccount ? 'account' : 'record_only';
        if(r.transactionId === undefined) r.transactionId = null;
        if(!r.timezone) r.timezone = TZ;
        if(!r.eventAt) r.eventAt = _toISO(r.createdAt || d.eventAt);
        if(!r.createdAt) r.createdAt = new Date(r.eventAt).getTime();
        if(!r.updatedAt) r.updatedAt = r.createdAt;
        if(r.note === undefined) r.note = '';
        if(r.amount === undefined) r.amount = 0;
        if(r.accountId === undefined) r.accountId = null;
      });
    }

    if(!Array.isArray(d.payments)) d.payments = [];

    const sumRepay = d.repayments.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const oldPaid = Number(d.paid) || 0;
    if(Math.abs(sumRepay - oldPaid) > 0.01){
      d.paid = round2(sumRepay);
    } else {
      d.paid = round2(oldPaid);
    }

    const origAmt = round2(Number(d.originalAmount) || Number(d.amount) || 0);
    d.originalAmount = origAmt;
    d.amount = origAmt;
    d.remainingAmount = round2(Math.max(origAmt - d.paid, 0));

    if(d.status !== 'cancelled'){
      if(d.paid >= origAmt - 0.001 && origAmt > 0) d.status = 'paid';
      else if(d.paid > 0) d.status = 'partial';
      else d.status = 'unpaid';
    }
  });

  p.moneyGiven.forEach(m => {
    if(m.purpose === undefined) m.purpose = m.giftType || '';
    if(m.purposeCustom === undefined) m.purposeCustom = '';
    if(m.method === undefined) m.method = '';
    if(m.methodCustom === undefined) m.methodCustom = '';
    if(m.note === undefined) m.note = '';
    if(m.nature === undefined) m.nature = 'gift';
    if(m.sourceAccountId === undefined) m.sourceAccountId = m.accountId || null;
    if(!m.timezone) m.timezone = TZ;
    m.editHistory = _normHistory(m.editHistory);
    if(!m.eventAt) m.eventAt = _toISO(m.date);
    if(!m.createdAt) m.createdAt = new Date(m.eventAt).getTime();
    if(!m.updatedAt) m.updatedAt = m.createdAt;
    if(!m.eventId) m.eventId = m.id;
    if(m.linkedDebtId === undefined) m.linkedDebtId = null;
  });

  p.dataVersion = DATA_VERSION;

  const checks = [
    Array.isArray(p.accounts), Array.isArray(p.transactions), Array.isArray(p.goals),
    Array.isArray(p.assets), Array.isArray(p.debts), Array.isArray(p.moneyGiven),
    (p.settings && typeof p.settings === 'object')
  ];
  if(checks.some(x => !x)) return { ok:false, reason:'shape', data:original };
  return { ok:true, data:p };
}

function loadState(){
  const base = defaultState();
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    let cameFromLegacy = false;
    if(!raw){
      for(const k of LEGACY_KEYS){
        const old = localStorage.getItem(k);
        if(old){ raw = old; cameFromLegacy = true; break; }
      }
    }
    if(!raw) return { state:base, fresh:true };
    let p = JSON.parse(raw) || {};
    if(p && p.state && p.state.accounts) p = p.state;
    const r = migrate(p);
    if(!r.ok){ return { state:base, fresh:false, migrationFailed:true, original:r.data }; }
    const merged = {
      dataVersion: DATA_VERSION,
      settings: Object.assign({}, base.settings, r.data.settings || {}),
      accounts: Array.isArray(r.data.accounts) ? r.data.accounts : [],
      transactions: Array.isArray(r.data.transactions) ? r.data.transactions : [],
      goals: Array.isArray(r.data.goals) ? r.data.goals : [],
      assets: Array.isArray(r.data.assets) ? r.data.assets : [],
      debts: Array.isArray(r.data.debts) ? r.data.debts : [],
      moneyGiven: Array.isArray(r.data.moneyGiven) ? r.data.moneyGiven : [],

/* ============================ 安全 / 锁 ============================ */
function _syncHash(text){
  const str = String(text == null ? '' : text);
  let h1 = 0x811c9dc5 >>> 0;
  let h2 = 0x1000193 >>> 0;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = (h1 ^ c) >>> 0;
    h1 = (h1 * 0x01000193) >>> 0;
    h2 = ((h2 << 5) + h2 + c) >>> 0;
  }
  return 'jh10_' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0') + '_' + str.length.toString(16);
}
async function sha256(text){
  const str = String(text == null ? '' : text);
  if(window.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function'){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      const arr = Array.from(new Uint8Array(buf));
      let out = '';
      for(let i = 0; i < arr.length; i++){ out += arr[i].toString(16).padStart(2,'0'); }
      return out;
    }catch(err){
      console.warn('[Jiheng sha256] crypto.subtle.digest failed, using sync fallback:', err);
    }
  }
  return _syncHash(str);
}
function loadLock(){

      for(const k of LEGACY_LOCK_KEYS){

      }

    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(obj && obj.hash && !obj.type) obj.type = 'pin';
    if(fromLegacy){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(obj)); }catch(e){} }
    return obj;
  }catch(e){ console.error('[Jiheng loadLock] failed:', e); return null; }
}

function dateFromISO(iso){ try{ const d = new Date(iso); return isNaN(d.getTime()) ? new Date() : d; } catch(e){ return new Date(); } }
function localDateStr(iso){ const d = dateFromISO(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function localDateTimeStr(iso){ const d = dateFromISO(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }
function combineDateTime(dateStr, timeStr){
  const parts = String(dateStr).split('-').map(Number);
  const timeParts = String(timeStr||'00:00:00').split(':').map(Number);
  const dt = new Date(parts[0]||1970, (parts[1]||1)-1, parts[2]||1, timeParts[0]||0, timeParts[1]||0, timeParts[2]||0);
  if(isNaN(dt.getTime())) return nowISO();
  return dt.toISOString();
}
function fmtDateLabel(iso){

  const today = new Date(); today.setHours(0,0,0,0);
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - that)/86400000);
  if(diff === 0) return t('today');
  if(diff === 1) return t('yesterday');
  const w = ['日','一','二','三','四','五','六'][d.getDay()];

  return `${d.getMonth()+1}月${d.getDate()}日${langW}`;
}

function monthKeyFromISO(iso){ const d = dateFromISO(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function inThisMonth(iso){ return monthKeyFromISO(iso) === monthKeyFromISO(nowISO()); }
function inThisYear(iso){ return dateFromISO(iso).getFullYear() === new Date().getFullYear(); }
function inThisWeek(iso){
  const d = dateFromISO(iso);
  const now = new Date();
  const day = (now.getDay() + 6) % 7;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
  monday.setHours(0,0,0,0);
  return d >= monday;
}
function inToday(iso){
  const d = dateFromISO(iso); const n = new Date();

function normalizeSearchText(s){
  if(s == null) return '';
  let str = String(s);
  try{ if(str.normalize) str = str.normalize('NFKC'); }catch(e){}
  str = str.toLowerCase();
  str = str.replace(/[\u200B-\u200D\uFEFF]/g, '');
  str = str.replace(/\s+/g, ' ').trim();
  return str;
}

/* ============================ V1.04 Debt helpers ============================ */
function debtRepayments(d){ return Array.isArray(d && d.repayments) ? d.repayments : []; }
function debtTotalPaid(d){
  const list = debtRepayments(d);
  if(list.length > 0) return round2(list.reduce((s, r) => s + (Number(r.amount) || 0), 0));
  return round2(Number(d && d.paid) || 0);
}
function debtOriginalAmount(d){
  if(!d) return 0;
  return round2(Number(d.originalAmount) || Number(d.amount) || 0);
}
function debtRemaining(d){
  const orig = debtOriginalAmount(d);
  const paid = debtTotalPaid(d);
  return round2(Math.max(orig - paid, 0));
}
function debtTotalRepaymentCount(){
  let c = 0;
  state.debts.forEach(d => { c += debtRepayments(d).length; });
  return c;
}

/* ============================ 成就 ============================ */
function currentStreak(){
  const days = new Set(state.transactions.map(tx => localDateStr(tx.eventAt||tx.date)));
  if(!days.size) return 0;
  let streak = 0;
  let d = new Date();
  if(!days.has(nowLocalDate())) d.setDate(d.getDate() - 1);
  while(days.has(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)){
    streak++;
    d.setDate(d.getDate() - 1);
    if(streak > 3650) break;
  }
  return streak;
}
function totalSavedEver(){ return state.transactions.filter(tx => tx.type === 'goal_deposit').reduce((s,tx) => s + (Number(tx.amount)||0), 0); }
function goalDepositCount(){ return state.transactions.filter(tx => tx.type === 'goal_deposit').length; }
function goalDoneCount(){ return state.goals.filter(g => Number(g.targetAmount) > 0 && Number(g.saved) >= Number(g.targetAmount)).length; }
function achievementProgress(a){
  switch(a.kind){
    case 'income_count':       return Math.min(state.transactions.filter(tx => tx.type === 'income').length, a.target);
    case 'expense_count':      return Math.min(state.transactions.filter(tx => tx.type === 'expense').length, a.target);
    case 'goal_count':         return Math.min(state.goals.length, a.target);
    case 'goal_deposit_count': return Math.min(goalDepositCount(), a.target);
    case 'asset_count':        return Math.min(state.assets.length, a.target);
    case 'account_count':      return Math.min(state.accounts.length, a.target);
    case 'debt_count':         return Math.min(state.debts.length, a.target);
    case 'money_given_count':  return Math.min(state.moneyGiven.length, a.target);
    case 'repayment_count':    return Math.min(debtTotalRepaymentCount(), a.target);
    case 'goal_done_count':    return Math.min(goalDoneCount(), a.target);
    case 'streak':             return Math.min(currentStreak(), a.target);
    case 'total_saved':        return Math.min(totalSavedEver(), a.target);
  }
  return 0;
}
function checkAchievements(){
  const list = I18N[LANG].achList || I18N.zh.achList;
  const newly = [];
  const unlock = (id) => {
    if(!state.achievements[id]){
      state.achievements[id] = Date.now();
      const a = list.find(x => x.id === id);
      if(a) newly.push(a);
    }
  };
  if(state.accounts.length > 0) unlock('first_account');
  if(state.transactions.some(tx => tx.type === 'income'))  unlock('first_income');
  if(state.transactions.some(tx => tx.type === 'expense')) unlock('first_expense');
  if(state.goals.length > 0) unlock('first_goal');
  if(state.assets.length > 0) unlock('first_asset');
  if(state.transactions.some(tx => tx.type === 'goal_deposit')) unlock('first_save');
  if(state.debts.length > 0) unlock('first_debt');
  if(state.moneyGiven.length > 0) unlock('first_given');
  if(debtTotalRepaymentCount() > 0) unlock('first_repay');
  if(goalDoneCount() > 0) unlock('goal_done');
  if(currentStreak() >= 7)  unlock('streak_7');
  if(currentStreak() >= 30) unlock('streak_30');
  const ts = totalSavedEver();
  if(ts >= 100)  unlock('save_100');
  if(ts >= 500)  unlock('save_500');
  if(ts >= 1000) unlock('save_1000');
  if(newly.length) saveState();
  return newly;
}

function handleKey(k){
  if(k === 'del'){ lockUI.pin = lockUI.pin.slice(0,-1); lockUI.error = false; updateLockDynamic(); return; }
  if(k === 'clear'){ lockUI.pin = ''; lockUI.error = false; lockUI.msg = ''; updateLockDynamic(); return; }
  if(k === 'ok'){ submitPin(); return; }
  if(/^\d$/.test(k)){
    if(lockUI.pin.length < 12){ lockUI.pin += k; lockUI.error = false; lockUI.msg = ''; }
    updateLockDynamic();
    if(!shouldUseTextMode() && lockUI.pin.length === 6) setTimeout(submitPin, 120);
  }

async function submitPin(){
  try{
    const pin = String(lockUI.pin == null ? '' : lockUI.pin);
    const usingText = shouldUseTextMode();
    const hasLock = !!(lockRecord && lockRecord.hash);
    if(!pin){ lockUI.msg = t('lockErrEmpty'); lockUI.error = true; updateLockDynamic(); return; }
    if(lockUI.mode === 'create'){
      if(!usingText && !/^\d{6}$/.test(pin)){ lockUI.msg = t('lockErrPin6'); lockUI.error = true; updateLockDynamic(); return; }
      if(usingText && pin.length < 4){ lockUI.msg = t('lockErrText4'); lockUI.error = true; updateLockDynamic(); return; }
      lockUI.firstPin = pin; lockUI.pin = ''; lockUI.mode = 'confirm'; lockUI.msg = ''; renderLock(); return;
    }
    if(lockUI.mode === 'confirm'){
      if(pin !== lockUI.firstPin){
        lockUI.msg = t('lockErrMismatch'); lockUI.error = true; lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'create'; renderLock(); return;
      }
      const hash = await sha256(pin);
      lockRecord = { hash, type: usingText ? 'text' : 'pin', createdAt: Date.now() };
      saveLock(lockRecord);
      lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'unlock'; lockUI.msg = ''; lockUI.error = false;
      isUnlocked = true; markActivity(); renderLock(); render({ top:true });
      toast(t('lockWelcome')); return;
    }
    if(lockUI.mode === 'changeOld'){
      const hash = await sha256(pin);
      if(!lockRecord || hash !== lockRecord.hash){ lockUI.msg = t('lockVerifyFailed'); lockUI.error = true; lockUI.pin = ''; updateLockDynamic(); return; }
      lockUI.mode = 'changeNew'; lockUI.pin = ''; lockUI.msg = '';
      lockUI.useTextMode = (lockRecord && lockRecord.type === 'text') ? true : false;
      renderLock(); return;
    }
    if(lockUI.mode === 'changeNew'){
      if(!usingText && !/^\d{6}$/.test(pin)){ lockUI.msg = t('lockErrPin6'); lockUI.error = true; updateLockDynamic(); return; }
      if(usingText && pin.length < 4){ lockUI.msg = t('lockErrText4'); lockUI.error = true; updateLockDynamic(); return; }
      lockUI.firstPin = pin; lockUI.pin = ''; lockUI.mode = 'changeConfirm'; lockUI.msg = ''; renderLock(); return;
    }
    if(lockUI.mode === 'changeConfirm'){
      if(pin !== lockUI.firstPin){
        lockUI.msg = t('lockErrMismatch'); lockUI.error = true; lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'changeNew'; renderLock(); return;
      }
      const hash = await sha256(pin);
      lockRecord = { hash, type: usingText ? 'text' : 'pin', createdAt: Date.now() };
      saveLock(lockRecord);
      lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'unlock'; lockUI.msg = ''; lockUI.error = false;
      renderLock(); toast(t('lockUpdated')); return;
    }
    if(!hasLock){ lockUI.mode = 'create'; renderLock(); return; }
    const hash = await sha256(pin);
    if(hash === lockRecord.hash){
      isUnlocked = true; lockUI.pin = ''; lockUI.msg = ''; lockUI.error = false;
      markActivity(); renderLock(); render({ top:true });
    }else{
      lockUI.msg = t('lockErrWrong'); lockUI.error = true; lockUI.pin = '';
      updateLockDynamic();
      if(navigator.vibrate) navigator.vibrate(60);
    }
  }catch(err){
    console.error('[Jiheng submitPin] exception:', err);
    lockUI.msg = t('lockErrGeneric'); lockUI.error = true; lockUI.pin = '';
    try{ updateLockDynamic(); }catch(e2){}
  }
}
function lockApp(msg){
  isUnlocked = false;
  lockUI.mode = 'unlock'; lockUI.pin = ''; lockUI.firstPin = '';
  lockUI.msg = msg || ''; lockUI.error = false;
  lockUI.useTextMode = (lockRecord && lockRecord.type === 'text') ? true : false;
  renderLock();
}

function renderTxList(){

  let list = sortedTx();
  if(f === 'income')       list = list.filter(tx => tx.type === 'income');
  else if(f === 'expense') list = list.filter(tx => tx.type === 'expense');
  else if(f === 'saving')  list = list.filter(tx => tx.type === 'transfer' || tx.type === 'goal_deposit' || tx.type === 'goal_withdraw');
  if(accFilter) list = list.filter(tx => tx.accountId === accFilter || tx.toAccountId === accFilter);
  if(catFilter) list = list.filter(tx => tx.category === catFilter);
  if(qNorm){
    list = list.filter(tx => {
      const acc = getAccount(tx.accountId);
      const to  = getAccount(tx.toAccountId);
      const g   = tx.goalId ? getGoal(tx.goalId) : null;
      const bag = [
        tx.category, tx.subCategory, tx.note, tx.method, tx.methodCustom,
        String(tx.amount), tx.date, tx.eventAt,
        acc ? acc.name : '', to ? to.name : '', g ? g.name : '', tx.type
      ];
      for(let i = 0; i < bag.length; i++){
        if(bag[i] == null) continue;
        if(normalizeSearchText(bag[i]).indexOf(qNorm) !== -1) return true;
      }
      return false;
    });
  }
  const totalIn  = list.filter(tx => tx.type === 'income').reduce((s,tx) => s + Number(tx.amount||0), 0);
  const totalOut = list.filter(tx => tx.type === 'expense').reduce((s,tx) => s + Number(tx.amount||0), 0);
  const groups = new Map();
  list.forEach(tx => { const d = localDateStr(tx.eventAt||tx.date); if(!groups.has(d)) groups.set(d, []); groups.get(d).push(tx); });
  const dates = Array.from(groups.keys()).sort().reverse();
  return `

    <div class="stat-box"><span>${esc(t('filterIncomeTotal'))}</span><b class="c-green">${money(totalIn)}</b></div>

    ? dates.map(d => {
        const items = groups.get(d);
        const dayIn  = items.filter(tx => tx.type === 'income').reduce((s,tx) => s + Number(tx.amount||0), 0);
        const dayOut = items.filter(tx => tx.type === 'expense').reduce((s,tx) => s + Number(tx.amount||0), 0);
        return `<div class="day-group">
          <div class="day-head"><span>${fmtDateLabel(d)}</span><span>${dayIn ? `<i class="c-green">+${money(dayIn)}</i>` : ''}${dayOut ? ` <i class="c-red">-${money(dayOut)}</i>` : ''}</span></div>

        </div>`;
      }).join('')
    : `<div class="empty big">
        <div class="empty-icon">🔍</div>

let _imeComposing = false;
document.addEventListener('compositionstart', e => {

  }
}, true);
document.addEventListener('compositionend', e => {

}, true);

function rerenderTxListInPlace(){
  const root = document.getElementById('app');
  if(!root) return;
  const view = root.querySelector('.view');
  if(!view) { render(); return; }
  const statGrid = view.querySelector('.stat-grid');
  if(statGrid){
    let n = statGrid.nextSibling;
    while(n){ const nx = n.nextSibling; n.remove ? n.remove() : view.removeChild(n); n = nx; }
    statGrid.remove();
    const tmp = document.createElement('div');
    tmp.innerHTML = renderTxList();
    while(tmp.firstChild){ view.appendChild(tmp.firstChild); }
    return;
  }
  render();
}
function rerenderRecordsInPlace(){
  const root = document.getElementById('app');
  if(!root) return;
  const view = root.querySelector('.view');
  if(!view) { render(); return; }
  const el = document.getElementById('records-search');
  const val = el ? el.value : '';
  const pos = el ? el.selectionStart : 0;
  render();
  const el2 = document.getElementById('records-search');
  if(el2){ el2.value = val; el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} }
}

function assetCalc(a){
  const price    = Number(a.price) || 0;
  const totalDays = (Number(a.expectedYears)||0) * 365 + (Number(a.expectedMonths)||0) * 30;
  const dailyValue = totalDays > 0 ? price / totalDays : 0;
  const start = new Date(a.purchaseDate);
  const end   = a.endDate ? new Date(a.endDate) : new Date();
  let usedMs  = end.getTime() - start.getTime();
  if(!isFinite(usedMs) || usedMs < 0) usedMs = 0;
  const usedDays = usedMs / 86400000;
  let systemValue = dailyValue * usedDays;
  if(systemValue < 0) systemValue = 0;
  if(systemValue > price) systemValue = price;
  const hasManual = (a.manualValue !== null && a.manualValue !== undefined && a.manualValue !== '');
  const actualValue = hasManual ? Number(a.manualValue) : systemValue;
  const rate       = price > 0 ? actualValue / price : 0;
  const unreturned = Math.max(price - actualValue, 0);
  return { price, totalDays, dailyValue, usedDays, systemValue, actualValue, rate, unreturned, hasManual };
}

function last6Months(){
  const arr = [];
  const now = new Date();
  for(let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    arr.push({ key: monthKeyFromISO(d.toISOString()), label: `${d.getMonth()+1}月` });
  }
  return arr;
}
function viewStats(){
  const range = ui.statsRange;
  const txs = state.transactions.filter(tx => matchRange(tx.eventAt||tx.date, range));
  const income  = txs.filter(tx => tx.type === 'income').reduce((s,tx) => s + Number(tx.amount||0), 0);
  const expense = txs.filter(tx => tx.type === 'expense').reduce((s,tx) => s + Number(tx.amount||0), 0);
  const net     = income - expense;
  const catMap = {};
  txs.filter(tx => tx.type === 'expense').forEach(tx => { const k = tx.category || 'other_exp'; catMap[k] = (catMap[k] || 0) + Number(tx.amount||0); });
  const cats = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const incMap = {};
  txs.filter(tx => tx.type === 'income').forEach(tx => { const k = tx.category || 'other_income'; incMap[k] = (incMap[k] || 0) + Number(tx.amount||0); });
  const incCats = Object.entries(incMap).sort((a,b) => b[1] - a[1]);
  const maxInc = incCats.length ? incCats[0][1] : 0;
  const months = last6Months().map(m => {
    const inc = state.transactions.filter(tx => tx.type === 'income'  && String(tx.eventAt||tx.date||'').startsWith(m.key)).reduce((s,tx) => s + Number(tx.amount||0), 0);
    const exp = state.transactions.filter(tx => tx.type === 'expense' && String(tx.eventAt||tx.date||'').startsWith(m.key)).reduce((s,tx) => s + Number(tx.amount||0), 0);
    return { key:m.key, label:m.label, inc, exp, net: inc - exp };
  });
  const maxAbs = Math.max.apply(null, months.map(m => Math.abs(m.net)).concat([1]));
  const hasData = txs.length > 0;
  const rangeSegs = [['today', t('statsToday')],['week', t('statsWeek')],['month', t('statsMonth')],['year', t('statsYear')],['all', t('statsAll')]];
  return `
  <div class="seg">${rangeSegs.map(([v,l]) => `<button class="${range===v?'on':''}" onclick="setStatsRange('${v}')">${esc(l)}</button>`).join('')}</div>
  <div class="stat-grid">
    <div class="stat-box"><span>${esc(t('statsIncome'))}</span><b class="c-green">${money(income)}</b></div>
    <div class="stat-box"><span>${esc(t('statsExpense'))}</span><b class="c-red">${money(expense)}</b></div>
    <div class="stat-box"><span>${esc(t('statsNet'))}</span><b class="${net>=0?'c-green':'c-red'}">${money(net)}</b></div>
    <div class="stat-box"><span>${esc(t('statsLocked'))}</span><b>${money(lockedBalance())}</b></div>
  </div>
  <div class="card">
    <div class="section-head" style="margin-bottom:12px"><h3>${esc(t('statsExpenseCat'))}</h3></div>
    ${ cats.length ? cats.map(([name, amt]) => `<div class="cat-row">
      <div class="cat-head"><span>${catIcon(name)} ${esc(expenseDisplayLabel(name))}</span><span>${money(amt)}</span></div>
      <div class="cat-bar"><i style="width:${maxCat>0?(amt/maxCat*100).toFixed(1):0}%"></i></div>
    </div>`).join('') : `<div class="empty"><p>${esc(t('statsNoExpense'))}</p></div>` }
  </div>
  <div class="card">
    <div class="section-head" style="margin-bottom:12px"><h3>${esc(t('statsIncomeCat'))}</h3></div>
    ${ incCats.length ? incCats.map(([name, amt]) => `<div class="cat-row">
      <div class="cat-head"><span>${catIcon(name)} ${esc(incomeDisplayLabel(name))}</span><span>${money(amt)}</span></div>
      <div class="cat-bar"><i class="inc" style="width:${maxInc>0?(amt/maxInc*100).toFixed(1):0}%"></i></div>
    </div>`).join('') : `<div class="empty"><p>${esc(t('statsNoIncome'))}</p></div>` }
  </div>
  <div class="card">
    <div class="section-head" style="margin-bottom:6px"><h3>${esc(t('statsTrend'))}</h3><span style="font-size:12px;color:var(--muted)">${esc(t('statsTrendSub'))}</span></div>
    <div class="trend">
      ${ months.map(m => {
        const h = Math.max(Math.abs(m.net) / maxAbs * 92, m.net === 0 ? 2 : 6);
        return `<div class="trend-col">
          <div class="trend-val">${m.net === 0 ? '' : (m.net>0?'+':'-') + fmtNum(m.net)}</div>
          <div class="trend-bar ${m.net < 0 ? 'neg':''}" style="height:${h.toFixed(1)}%"></div>
          <div class="trend-lbl">${m.label}</div>
        </div>`;
      }).join('') }
    </div>
  </div>
  <p class="about">${esc(t('statsTransferNote'))}</p>
  ${ !hasData ? `<div class="empty big"><div class="empty-icon">📊</div><p>${esc(t('statsNoData'))}</p><span>${esc(t('statsNoDataSub'))}</span></div>` : '' }`;
}

function exportData(){
  try{
    const payload = { app:'Jiheng', appVersion:APP_VERSION, dataVersion:DATA_VERSION, dataVersionLabel:DATA_VERSION_LABEL, schemaSeries:SCHEMA_SERIES, exportedAt:new Date().toISOString(), changelog:CHANGELOG, state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    downloadBlob(blob, 'jiheng-' + nowLocalDate() + '.json');
    toast(t('exportDone'));
  }catch(e){ toast(t('exportFail')); }
}
function exportCSV(){
  try{
    const rows = [['eventAt','createdAt','updatedAt','timezone','type','category','subCategory','method','amount','account','toAccount','note']];
    sortedTx().forEach(tx => {
      const acc = getAccount(tx.accountId);
      const to  = getAccount(tx.toAccountId);
      rows.push([
        localDateTimeStr(tx.eventAt||tx.date),
        localDateTimeStr(tx.createdAt),
        localDateTimeStr(tx.updatedAt),
        tx.timezone || '',
        tx.type,
        tx.category || '', tx.subCategory || '',
        tx.methodCustom || methodDisplay(tx.method || ''),
        String(Number(tx.amount||0).toFixed(2)),
        acc ? acc.name : '', to ? to.name : '',
        (tx.note || '').replace(/[\r\n,]/g,' ')
      ]);
    });
    const csv = '\ufeff' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
    downloadBlob(blob, 'jiheng-transactions-' + nowLocalDate() + '.csv');
    toast(t('exportCsvDone'));
  }catch(e){ toast(t('exportFail')); }
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function triggerImport(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const parsed = JSON.parse(ev.target.result);
        const src = parsed.state || parsed;
        if(!src || !Array.isArray(src.accounts)){ toast(t('importInvalid')); return; }
        confirmDialog(t('importConfirm'), () => {
          createBackup('before-import');
          try{
            const r = migrate(src);
            if(!r.ok){ toast(t('migrationFailed')); return; }
            state = {
              dataVersion: DATA_VERSION,
              settings: Object.assign({}, defaultState().settings, r.data.settings || {}),
              accounts: Array.isArray(r.data.accounts) ? r.data.accounts : [],
              transactions: Array.isArray(r.data.transactions) ? r.data.transactions : [],
              goals: Array.isArray(r.data.goals) ? r.data.goals : [],
              assets: Array.isArray(r.data.assets) ? r.data.assets : [],
              debts: Array.isArray(r.data.debts) ? r.data.debts : [],
              moneyGiven: Array.isArray(r.data.moneyGiven) ? r.data.moneyGiven : [],
              customIncomeCats: Array.isArray(r.data.customIncomeCats) ? r.data.customIncomeCats : [],
              customExpenseCats: Array.isArray(r.data.customExpenseCats) ? r.data.customExpenseCats : [],
              customMethods: Array.isArray(r.data.customMethods) ? r.data.customMethods : [],
              achievements: (r.data.achievements && typeof r.data.achievements === 'object') ? r.data.achievements : {},
              createdAt: r.data.createdAt || new Date().toISOString()
            };
            LANG = state.settings.lang || LANG;
            saveState();
            ui = { tab:'home', sub:null, recordFilter:'all', statsRange:'month', searchQuery:'', recordCat:'', recordAccount:'', currentAccountId:null, debtFilter:'all', currentDebtId:null, recordsView:'home', recordsSearch:'', recordsType:'all', recordsStatus:'all', recordsDate:'all', expandedNotes:{}, expandedRepayNotes:{} };
            render({ top:true }); toast(t('importDone'));
          }catch(err){ toast(t('importFail')); }
        });
      }catch(err){ toast(t('importInvalid')); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function openSheet(opts){
  const root = document.getElementById('sheet-root');
  root.innerHTML = `
    <div class="mask"></div>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h3>${esc(opts.title)}</h3><button type="button" class="icon-btn" data-close>✕</button></div>

          <button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button>
          <button type="submit" class="btn primary">${esc(opts.submitText || t('save'))}</button>
        </div>
      </form>
    </div>`;
  root.classList.add('show');
  document.body.classList.add('no-scroll');
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
  root.querySelector('.mask').addEventListener('click', closeSheet);
  const form = root.querySelector('#sheet-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = {};
    new FormData(form).forEach((v,k) => { data[k] = v; });
    let ok = true;
    if(opts.onSubmit){
      try { ok = await opts.onSubmit(data, form); }
      catch(err){ console.error('[Jiheng openSheet] submit error:', err); ok = false; }
    }
    if(ok !== false) closeSheet();
  });
  if(opts.afterRender) opts.afterRender(root);
}

function toast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  const el = root.querySelector('.toast');
  requestAnimationFrame(() => el.classList.add('in'));

  pickerRoot.style.pointerEvents = 'auto';
  function closePicker(){

  const hiddenId = root.querySelector('input[name="method"]');
  const hiddenCustom = root.querySelector('input[name="methodCustom"]');
  btn.addEventListener('click', () => {
    const customM = state.customMethods || [];
    openGroupedPicker({
      title: t('pickMethod'),
      groups: MONEY_METHOD_GROUPS.concat(customM.length ? [{ group:'custom_method', items: customM.slice() }] : []),
      value: hiddenId ? hiddenId.value : '',
      allowCustom: true,
      customValue: hiddenCustom ? hiddenCustom.value : '',
      customPlaceholder: t('methodCustom'),
      labelFor: (id) => customM.includes(id) ? id : methodLabel(id),
      groupLabelFor: (g) => g === 'custom_method' ? t('pickCustom') : methodGroupLabel(g),
      onPick: (id) => {
        if(hiddenId) hiddenId.value = id;
        if(hiddenCustom) hiddenCustom.value = '';
        btn.innerHTML = esc(customM.includes(id) ? id : methodLabel(id));
      },
      onCustom: (text) => {
        if(!Array.isArray(state.customMethods)) state.customMethods = [];
        if(!state.customMethods.includes(text)) state.customMethods.push(text);
        saveState();
        if(hiddenId) hiddenId.value = '';
        if(hiddenCustom) hiddenCustom.value = text;
        btn.innerHTML = esc(text);
      }
    });
  });
}
function renderPurposePickerButton(kind, currentId, currentCustom){

        <label class="field"><span class="field-label">${esc(t('debtTime'))}</span><input name="time" type="time" step="1" required value="${editing?localTimeSecStr(editing.eventAt||editing.date):nowLocalTime()}"></label>
      </div>

      <label class="field"><span class="field-label">${esc(t('debtReason'))}</span><textarea name="reason" maxlength="4000" placeholder="${esc(t('debtReasonPlaceholder'))}">${editing?esc(editing.reason||''):''}</textarea></label>
      <p class="hint">${esc(t('debtImportantNote'))}</p>`,
    onSubmit(d){
      const person = (d.person || '').trim();
      const amount = round2(parseFloat(d.amount));
      if(!person){ toast(t('catEnterName')); return false; }
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      const eventAt = combineDateTime(d.date || nowLocalDate(), d.time || nowLocalTime());
      const linkMode = d.linkMode === 'account' ? 'account' : 'record_only';
      const linkedAccountId = linkMode === 'account' ? d.linkedAccountId : null;

      if(editing){
        if(editing.linkMode === 'account' && editing.linkedAccountId){
          const oldAcc = getAccount(editing.linkedAccountId);
          if(oldAcc){
            if(editing.direction === 'owe_me') oldAcc.balance = round2((Number(oldAcc.balance)||0) + debtOriginalAmount(editing));
            else oldAcc.balance = round2((Number(oldAcc.balance)||0) - debtOriginalAmount(editing));
          }
        }
        if(linkMode === 'account'){
          const acc = getAccount(linkedAccountId);
          if(!acc){ toast(t('accountNotExist')); return false; }
          if(d.direction === 'owe_me'){
            if(round2(Number(acc.balance)||0) < amount){ toast(t('insufficientBalance')); return false; }
            acc.balance = round2((Number(acc.balance)||0) - amount);
          }else{
            acc.balance = round2((Number(acc.balance)||0) + amount);
          }
        }
        editing.direction = d.direction;
        editing.person = person;
        editing.amount = amount;
        editing.originalAmount = amount;
        editing.purpose = (d.purpose || '').trim();
        editing.purposeCustom = (d.purposeCustom || '').trim();
        editing.method = (d.method || '').trim();
        editing.methodCustom = (d.methodCustom || '').trim();
        editing.eventAt = eventAt;
        editing.date = eventAt;
        editing.originalEventAt = eventAt;
        editing.dueDate = d.dueDate || '';
        editing.reason = (d.reason || '');
        editing.note = d.reason || '';
        editing.linkMode = linkMode;
        editing.linkedAccountId = linkedAccountId;
        editing.updatedAt = Date.now();
        if(!Array.isArray(editing.editHistory)) editing.editHistory = [];
        editing.editHistory.push({ at: nowISO(), action: 'edit' });
        const paid = debtTotalPaid(editing);
        editing.paid = paid;
        editing.remainingAmount = round2(Math.max(amount - paid, 0));
        if(editing.status !== 'cancelled'){
          if(paid >= amount - 0.001 && amount > 0) editing.status = 'paid';
          else if(paid > 0) editing.status = 'partial';
          else editing.status = 'unpaid';
        }
        afterChange(); toast(t('debtUpdated'));
      }else{
        const acc = linkMode === 'account' ? getAccount(linkedAccountId) : null;
        if(linkMode === 'account'){
          if(!acc){ toast(t('accountNotExist')); return false; }
          if(d.direction === 'owe_me'){
            if(round2(Number(acc.balance)||0) < amount){ toast(t('insufficientBalance')); return false; }
            acc.balance = round2((Number(acc.balance)||0) - amount);
          }else{
            acc.balance = round2((Number(acc.balance)||0) + amount);
          }
        }
        const eventId = 'EVT-' + Date.now().toString(36).toUpperCase();
        state.debts.push({
          id: uid(), eventId,
          direction: d.direction || 'i_owe', person,
          amount, originalAmount: amount,
          paid: 0,
          remainingAmount: amount,
          purpose: (d.purpose || '').trim(), purposeCustom: (d.purposeCustom || '').trim(),
          method: (d.method || '').trim(), methodCustom: (d.methodCustom || '').trim(),
          eventAt, date: eventAt,
          originalEventAt: eventAt,
          timezone: APP_TZ,
          dueDate: d.dueDate || '', reason: (d.reason || ''),
          note: d.reason || '',
          repayments: [],
          payments: [],
          status: 'unpaid',
          linkMode, linkedAccountId,
          originalTransactionId: null,
          editHistory: [],
          createdAt: Date.now(), updatedAt: Date.now()
        });
        saveState();
        afterChange(); toast(t('debtCreated'));
      }
      return true;
    },
    afterRender(root){
      bindPurposePicker(root, 'debt'); bindMethodPicker(root);
      const sel = root.querySelector('#debt-link-mode');
      const hint = root.querySelector('#debt-link-hint');
      const wrap = root.querySelector('#debt-linked-account-wrap');
      if(sel && hint && wrap){
        const update = () => {
          if(sel.value === 'account'){
            hint.textContent = t('debtLinkHintLinked');
            wrap.style.display = 'block';
          }else{
            hint.textContent = t('debtLinkHintRecordOnly');
            wrap.style.display = 'none';
          }
        };
        sel.addEventListener('change', update);
        update();
      }
    }
  });
}

function openRepayForm(debtId, presetRepayId){
  const d = getDebt(debtId);
  if(!d){ toast(t('debtNotExist')); return; }
  if(d.status === 'cancelled'){ toast(t('debtStatusCancelled')); return; }

  const editing = presetRepayId ? debtRepayments(d).find(r => r.id === presetRepayId) : null;
  const remainNow = debtRemaining(d);
  const maxAllow = editing ? round2(remainNow + Number(editing.amount || 0)) : remainNow;

  const defaultAffect = editing
    ? !!editing.affectAccount
    : !!state.settings.debtRepayAffectAccountDefault;

  const initialMethod = editing ? (editing.method || 'cash') : 'cash';
  const initialMethodCustom = editing ? (editing.methodCustom || '') : '';
  const initialMethodLabel = initialMethodCustom || methodLabel(initialMethod);
  const initialAccountId = editing ? (editing.accountId || '') : (state.accounts[0] ? state.accounts[0].id : '');
  const initialDate = editing ? localDateStr(editing.eventAt) : nowLocalDate();
  const initialTime = editing ? localTimeSecStr(editing.eventAt) : nowLocalTime();
  const initialNote = editing ? (editing.note || '') : '';
  const initialAmount = editing ? Number(editing.amount || 0) : '';

  openSheet({
    title: editing ? t('debtEditRepay') : t('debtAddRepay'),
    submitText: editing ? t('save') : t('debtRepayBtn'),
    body: `
      <div class="asset-rows" style="margin-bottom:14px">
        <div class="ar"><span>${esc(t('debtPerson'))}</span><b>${esc(d.person)}</b></div>
        <div class="ar"><span>${esc(t('debtOriginalAmount'))}</span><b>${money(debtOriginalAmount(d))}</b></div>
        <div class="ar"><span>${esc(t('debtTotalPaid'))}</span><b>${money(debtTotalPaid(d))}</b></div>
        <div class="ar"><span>${esc(t('debtRemaining'))}</span><b>${money(remainNow)}</b></div>
      </div>
      <label class="field"><span class="field-label">${esc(t('debtRepayAmount'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal" value="${initialAmount}"></div>
        <p class="hint" style="margin-top:6px">${esc(t('debtRepayExceed'))}: ${money(maxAllow)}</p>
      </label>
      <label class="field"><span class="field-label">${esc(t('debtRepayAccount'))}</span>
        <select name="accountId">${accountOptions(initialAccountId)}</select>
        <p class="hint" style="margin-top:6px">${esc(t('debtRepayAccountHint'))}</p>
      </label>
      <div class="field"><span class="field-label">${esc(t('debtRepayMethod'))}</span>${renderMethodPickerButton(initialMethod, initialMethodLabel, initialMethodCustom)}
        <p class="hint" style="margin-top:6px">${esc(t('debtRepayMethodHint'))}</p>
      </div>
      <div class="toggle-line">
        <div class="tl-label">
          <div><b>${esc(t('debtRepayAffectAccount'))}</b></div>
          <div class="tl-sub" id="repay-affect-sub">${esc(defaultAffect ? t('debtRepayWillAffectAccount') : t('debtRepayWillRecordOnly'))}</div>
        </div>
        <button type="button" class="switch ${defaultAffect?'on':''}" id="repay-affect-switch"><i></i></button>
        <input type="hidden" name="affectAccount" value="${defaultAffect ? '1' : '0'}">
      </div>
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('debtRepayTime'))}</span><input name="date" type="date" required value="${initialDate}"></label>
        <label class="field"><span class="field-label">${esc(t('time'))}</span><input name="time" type="time" step="1" required value="${initialTime}"></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('note'))}</span><textarea name="note" maxlength="4000" placeholder="${esc(t('debtRepayNotePlaceholder'))}">${esc(initialNote)}</textarea></label>`,
    onSubmit(form){
      const amount = round2(parseFloat(form.amount));
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      const affect = form.affectAccount === '1';
      const acc = affect ? getAccount(form.accountId) : null;
      if(affect && !acc){ toast(t('accountNotExist')); return false; }
      const eventAt = combineDateTime(form.date || nowLocalDate(), form.time || nowLocalTime());

      if(editing){
        rollbackRepaymentEffect(d, editing);
        const remainAfterRollback = debtRemaining(d);
        if(amount > remainAfterRollback + 0.001){
          toast(t('debtRepayExceed'));
          return false;
        }
        editing.amount = amount;
        editing.accountId = affect ? (form.accountId || null) : null;
        editing.method = (form.method || '').trim();
        editing.methodCustom = (form.methodCustom || '').trim();
        editing.eventAt = eventAt;
        editing.note = (form.note || '');
        editing.affectAccount = affect;
        editing.linkMode = affect ? 'account' : 'record_only';
        editing.transactionId = null;
        editing.updatedAt = Date.now();
        if(!Array.isArray(editing.editHistory)) editing.editHistory = [];
        editing.editHistory.push({ at: nowISO(), action: 'edit' });
        applyRepaymentEffect(d, editing);
        recalcDebt(d);
        afterChange(); toast(t('debtRepayUpdated'));
      }else{
        if(amount > remainNow + 0.001){ toast(t('debtRepayExceed')); return false; }
        const r = {
          id: uid(),
          debtId: d.id,
          amount,
          accountId: affect ? (form.accountId || null) : null,
          method: (form.method || '').trim(),
          methodCustom: (form.methodCustom || '').trim(),
          eventAt,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          timezone: APP_TZ,
          note: (form.note || ''),
          affectAccount: affect,
          linkMode: affect ? 'account' : 'record_only',
          transactionId: null,
          editHistory: []
        };
        applyRepaymentEffect(d, r);
        if(!Array.isArray(d.repayments)) d.repayments = [];
        d.repayments.push(r);
        recalcDebt(d);
        afterChange(); toast(t('debtRepayCreated'));
      }
      return true;
    },
    afterRender(root){
      bindMethodPicker(root);
      const sw = root.querySelector('#repay-affect-switch');
      const sub = root.querySelector('#repay-affect-sub');
      const hidden = root.querySelector('input[name="affectAccount"]');
      if(sw && hidden){
        sw.addEventListener('click', e => {
          e.preventDefault();
          const now = hidden.value === '1' ? '0' : '1';
          hidden.value = now;
          sw.classList.toggle('on', now === '1');
          if(sub) sub.textContent = now === '1' ? t('debtRepayWillAffectAccount') : t('debtRepayWillRecordOnly');
        });
      }
    }
  });
}

function applyRepaymentEffect(debt, r){
  if(!r.affectAccount) { r.transactionId = null; return; }
  const acc = getAccount(r.accountId);
  if(!acc){ r.transactionId = null; return; }
  if(debt.direction === 'owe_me'){
    acc.balance = round2((Number(acc.balance) || 0) + Number(r.amount || 0));
  }else{
    acc.balance = round2((Number(acc.balance) || 0) - Number(r.amount || 0));
  }
  const txId = uid();
  r.transactionId = txId;
  state.transactions.push({
    id: txId,
    type: debt.direction === 'owe_me' ? 'income' : 'expense',
    amount: Number(r.amount || 0),
    eventAt: r.eventAt,
    date: r.eventAt,
    timezone: r.timezone || APP_TZ,
    category: debt.direction === 'owe_me' ? 'other_income' : 'other_exp',
    subCategory: '',
    method: r.method || '',
    methodCustom: r.methodCustom || '',
    accountId: r.accountId,
    note: r.note || '',
    linkedDebtId: debt.id,
    linkedRepaymentId: r.id,
    editHistory: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
}

function rollbackRepaymentEffect(debt, r){
  if(r.affectAccount && r.accountId){
    const acc = getAccount(r.accountId);
    if(acc){
      if(debt.direction === 'owe_me'){
        acc.balance = round2((Number(acc.balance) || 0) - Number(r.amount || 0));
      }else{
        acc.balance = round2((Number(acc.balance) || 0) + Number(r.amount || 0));
      }
    }
  }
  if(r.transactionId){
    state.transactions = state.transactions.filter(tx => tx.id !== r.transactionId);
    r.transactionId = null;
  }
}

function recalcDebt(d){
  const reps = debtRepayments(d);
  const sum = round2(reps.reduce((s, r) => s + (Number(r.amount) || 0), 0));
  d.paid = sum;
  const orig = debtOriginalAmount(d);
  d.remainingAmount = round2(Math.max(orig - sum, 0));
  if(d.status !== 'cancelled'){
    if(sum >= orig - 0.001 && orig > 0) d.status = 'paid';
    else if(sum > 0) d.status = 'partial';
    else d.status = 'unpaid';
  }
  d.updatedAt = Date.now();
}

function openRepayMenu(debtId, repayId){

        recalcDebt(d);

      });

}

function debtMenu(id){
  const d = getDebt(id);
  if(!d) return;
  const acts = [
    { label: t('debtAddRepay'), icon:'💰', onClick: () => openRepayForm(id) },
    { label: t('edit'), icon:'✏️', onClick: () => openDebtForm(id) },
    { label: t('viewEditHistory'), icon:'🕓', onClick: () => viewEditHistory('debt', id) }
  ];
  if(d.status !== 'cancelled'){
    acts.push({ label: t('debtCancel'), icon:'🚫', danger:true, onClick: () => {
      confirmDialog(t('debtCancelConfirm'), () => {
        d.status = 'cancelled';
        d.updatedAt = Date.now();
        if(!Array.isArray(d.editHistory)) d.editHistory = [];
        d.editHistory.push({ at: nowISO(), action: 'cancel' });
        afterChange(); toast(t('debtCancelled'));
      });
    }});
  }
  acts.push({ label: t('delete'), icon:'🗑', danger:true, onClick: () => {
    confirmDialog(t('debtDeleteConfirm'), () => {
      const reps = debtRepayments(d);
      reps.forEach(r => rollbackRepaymentEffect(d, r));
      if(d.linkMode === 'account' && d.linkedAccountId){
        const acc = getAccount(d.linkedAccountId);
        if(acc){
          if(d.direction === 'owe_me') acc.balance = round2((Number(acc.balance)||0) + debtOriginalAmount(d));
          else acc.balance = round2((Number(acc.balance)||0) - debtOriginalAmount(d));
        }

      if(ui.sub === 'debt-detail'){ ui.sub = 'debts'; ui.currentDebtId = null; }
      afterChange(); toast(t('debtDeleted'));
    });
  }});
  openActionSheet(d.person, acts);
}

        ${linkedAcc ? `<div class="goal-sub">🔗 ${esc(linkedAcc.name)}</div>` : ''}
        ${noteFull ? `<div class="goal-sub note-full">${esc(noteFull)}</div>` : ''}
        ${reps.length ? `<div class="goal-sub">💰 ${esc(t('debtRepayCount'))}: ${reps.length}</div>` : ''}

    </div>

    <div class="goal-foot"><span>${esc(t('debtTotalPaid'))}: ${money(paid)}</span><span>${esc(t('debtRemaining'))}: ${money(remain)}</span></div>
