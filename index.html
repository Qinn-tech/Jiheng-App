<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b4b8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="积衡 Jiheng">
<meta name="format-detection" content="telephone=no">
<title>积衡 Jiheng · 个人财务记录</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --brand:#5b4b8a;--brand-2:#8a7bb8;--brand-3:#c9bfe8;--brand-soft:#f1eef9;
  --accent:#c9a961;--accent-soft:#f7f1e2;
  --bg:#f7f6fb;--card:#fff;--text:#1c1830;--muted:#8a86a0;--line:#ecebf4;
  --green:#0e9b6b;--red:#d9534f;--amber:#c9914b;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --shadow:0 2px 12px rgba(91,75,138,.06);
  --shadow-brand:0 10px 26px rgba(91,75,138,.24);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html,body{margin:0;padding:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden;}
body.no-scroll{overflow:hidden;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + var(--safe-b));overflow-x:hidden;}
.jiheng-wordmark{display:inline-flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.jiheng-wordmark .zh{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#5b4b8a 0%,#8a7bb8 60%,#c9a961 100%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;}
.jiheng-wordmark .zh::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:linear-gradient(90deg,#5b4b8a 0%,#c9a961 100%);opacity:.35;}
.jiheng-wordmark .en{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--brand);opacity:.75;}
.jiheng-wordmark.light .zh{background:linear-gradient(135deg,#ffffff 0%,#e8e2f5 50%,#e6d3a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.jiheng-wordmark.light .zh::after{background:linear-gradient(90deg,#fff 0%,#e6d3a8 100%);opacity:.5;}
.jiheng-wordmark.light .en{color:#fff;opacity:.85;}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + var(--safe-t)) 16px 12px;background:rgba(247,246,251,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.topbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;color:var(--brand);}
.topbar.brand{padding-top:calc(10px + var(--safe-t));}
.icon-btn{width:38px;height:38px;border-radius:12px;border:none;background:#fff;flex:0 0 auto;display:grid;place-items:center;font-size:16px;color:var(--brand);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s;}
.icon-btn:active{transform:scale(.92);}
.icon-btn.sm{width:30px;height:30px;font-size:14px;border-radius:10px;box-shadow:none;background:var(--brand-soft);}
.view{padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px;}
section{display:flex;flex-direction:column;gap:10px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.section-head h3{font-size:15px;font-weight:700;margin:0;color:var(--brand);}
.link{background:none;border:none;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px;}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);overflow-wrap:anywhere;word-break:break-word;}
.list{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;}
.list .row+.row{border-top:1px solid var(--line);}
.c-green{color:var(--green)!important;}
.c-red{color:var(--red)!important;}
.c-muted{color:var(--muted)!important;}
.c-amber{color:var(--amber)!important;}
.product-notice{background:linear-gradient(135deg,#fff 0%,var(--brand-soft) 100%);border:1.5px solid var(--brand-3);border-radius:18px;padding:14px 14px 12px;box-shadow:0 4px 16px rgba(91,75,138,.10);}
.product-notice .pn-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.product-notice .pn-icon{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto;}
.product-notice .pn-title{font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.4px;text-transform:uppercase;}
.product-notice .pn-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;}
.product-notice .pn-row+.pn-row{border-top:1px dashed var(--brand-3);}
.product-notice .pn-flag{font-size:10.5px;font-weight:800;color:#fff;background:var(--brand);padding:3px 7px;border-radius:6px;letter-spacing:.4px;flex:0 0 auto;margin-top:2px;min-width:34px;text-align:center;}
.product-notice .pn-text{font-size:12.5px;line-height:1.55;color:var(--text);font-weight:500;flex:1;}
.product-notice .pn-text b{color:var(--brand);font-weight:800;}
.lock-screen{position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,#3d3158 0%,#5b4b8a 55%,#8a7bb8 100%);display:flex;flex-direction:column;padding:calc(8px + var(--safe-t)) 16px calc(8px + var(--safe-b));color:#fff;overflow:hidden;height:100vh;height:100dvh;}
.lock-screen::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(201,169,97,.08);top:-120px;right:-100px;pointer-events:none;}
.lock-screen::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-80px;left:-60px;pointer-events:none;}
.lock-header{position:relative;z-index:2;text-align:center;flex:0 0 auto;padding:6px 0 8px;}
.lock-sub{font-size:10.5px;opacity:.85;line-height:1.4;letter-spacing:.3px;margin-top:6px;}
.lock-mid{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:8px 0;}
.lock-title{font-size:15px;font-weight:700;margin-bottom:10px;text-align:center;}
.lock-info{font-size:11px;opacity:.9;text-align:center;max-width:320px;margin:0 auto 10px;line-height:1.5;}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:6px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);transition:background .15s,border-color .15s,transform .15s;}
.pin-dot.filled{background:#fff;border-color:#fff;transform:scale(1.1);}
.pin-dot.error{border-color:#ff8a8a;background:#ff8a8a;}
.lock-msg{height:18px;font-size:12px;margin-bottom:10px;color:#ffd6d6;font-weight:600;text-align:center;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:270px;}
.key{height:46px;border-radius:14px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:19px;font-weight:600;cursor:pointer;transition:background .1s,transform .1s;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.key:active{transform:scale(.94);background:rgba(255,255,255,.30);}
.key.fn{font-size:12px;font-weight:700;background:transparent;}
.key.fn:active{background:rgba(255,255,255,.14);}
.key.enter{background:var(--accent);color:#3d3158;font-size:13px;font-weight:800;}
.key.enter:active{background:#dbb977;}
.lock-input-wrap{width:100%;max-width:270px;margin:0 auto;}
.lock-input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font-size:16px;outline:none;text-align:center;font-weight:600;letter-spacing:.5px;}
.lock-input::placeholder{color:rgba(255,255,255,.55);letter-spacing:0;}
.lock-input:focus{border-color:#fff;background:rgba(255,255,255,.20);}
.lock-ok-btn{width:100%;max-width:270px;margin-top:10px;background:var(--accent);color:#3d3158;border:none;padding:11px;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;}
.lock-ok-btn:active{background:#dbb977;}
.lock-notice-scroll{position:relative;z-index:2;flex:0 1 auto;background:rgba(0,0,0,.24);border-radius:14px;border:1.5px solid rgba(255,255,255,.28);max-height:34vh;min-height:120px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-top:8px;padding:10px 12px;}
.lock-notice-scroll .ln-title{font-size:11px;font-weight:800;letter-spacing:.5px;opacity:.9;margin-bottom:6px;text-transform:uppercase;}
.lock-notice-scroll .ln-row{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.5;}
.lock-notice-scroll .ln-row+.ln-row{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.25);}
.lock-notice-scroll .ln-flag{font-size:10px;font-weight:800;color:#3d3158;background:var(--accent);padding:2px 7px;border-radius:5px;letter-spacing:.4px;flex:0 0 auto;margin-top:1px;min-width:30px;text-align:center;}
.lock-notice-scroll .ln-text{flex:1;opacity:.98;font-weight:500;}
.lock-footer{position:relative;z-index:2;flex:0 0 auto;margin-top:8px;display:flex;flex-direction:column;gap:6px;width:100%;max-width:270px;align-self:center;}
.lock-footer button{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:12.5px;font-weight:600;padding:10px;border-radius:12px;cursor:pointer;transition:background .14s;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.lock-footer button:active{background:rgba(255,255,255,.28);}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px;background:linear-gradient(135deg,#3d3158 0%,#5b4b8a 55%,#8a7bb8 100%);color:#fff;box-shadow:var(--shadow-brand);}
.hero::after{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(201,169,97,.10);top:-120px;right:-80px;}
.hero::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-90px;left:-40px;}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;gap:8px;}
.hero-label{font-size:13px;opacity:.9;font-weight:500;letter-spacing:.4px;}
.hero-sub{font-size:10.5px;opacity:.72;margin-top:2px;letter-spacing:.2px;}
.eye-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:15px;cursor:pointer;transition:transform .12s;flex:0 0 auto;}
.eye-btn:active{transform:scale(.9);}
.hero-amount{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 18px;position:relative;z-index:1;font-variant-numeric:tabular-nums;word-break:break-all;}
.hero-split{display:flex;position:relative;z-index:1;background:rgba(255,255,255,.13);border-radius:16px;padding:12px 14px;}
.split-item{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.split-item span{font-size:11.5px;opacity:.85;}
.split-item b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.split-div{width:1px;background:rgba(255,255,255,.22);margin:0 12px;}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mini{background:#fff;border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);}
.mini span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.mini b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all;}
.mini.tappable{cursor:pointer;transition:transform .12s;}
.mini.tappable:active{transform:scale(.98);}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.quick button{background:#fff;border:none;border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--text);box-shadow:var(--shadow);cursor:pointer;font-weight:600;transition:transform .12s;}
.quick button:active{transform:scale(.94);}
.quick .qi{font-size:17px;line-height:1;color:var(--brand);}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;transition:background .12s;}
.row:active{background:#fafbfd;}
.row-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;}
.row-main{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
.row-title{font-size:14.5px;font-weight:600;overflow-wrap:anywhere;word-break:break-word;}
.row-sub{font-size:12px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere;word-break:break-word;line-height:1.5;white-space:pre-wrap;}
.row-amount{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;}
.tx-amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13.5px;}
.empty p{margin:0 0 10px;}
.empty.big{padding:40px 20px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.7;}
.empty.big p{font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:4px;}
.empty.big span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.btn{border:none;border-radius:13px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(91,75,138,.28);}
.btn.ghost{background:#f2f1f7;color:var(--text);}
.btn.danger{background:var(--red);color:#fff;}
.btn.soft{background:var(--brand-soft);color:var(--brand);font-size:13.5px;padding:10px 14px;flex:1;}
.btn.sm{padding:9px 16px;font-size:13.5px;}
.btn.block{width:100%;}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--shadow);gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:0 0 auto;border:none;background:none;padding:9px 14px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s;}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(91,75,138,.22);}
.day-group{display:flex;flex-direction:column;gap:8px;}
.day-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding:0 4px;font-weight:600;}
.day-head i{font-style:normal;font-weight:700;}
.summary-strip{background:#fff;border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:flex;gap:16px;}
.summary-strip>div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.summary-strip span{font-size:12px;color:var(--muted);}
.summary-strip b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-all;}
.goal-card,.asset-card,.debt-card{background:#fff;border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere;word-break:break-word;}
.goal-top,.asset-top,.debt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.goal-name,.asset-name,.debt-name{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere;word-break:break-word;}
.goal-sub{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;word-break:break-word;line-height:1.55;white-space:pre-wrap;}
.badge-done{font-size:10.5px;background:#e7f8f1;color:var(--green);padding:2px 7px;border-radius:6px;font-weight:700;}
.goal-amt{font-variant-numeric:tabular-nums;}
.goal-amt b{font-size:20px;font-weight:800;}
.goal-amt span{font-size:13px;color:var(--muted);}
.bar-track{height:8px;background:#f0eff7;border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .4s cubic-bezier(.3,.8,.4,1);}
.bar-fill.alt{background:linear-gradient(90deg,#0e9b6b,#34d399);}
.bar-fill.debt{background:linear-gradient(90deg,var(--amber),#e0b76d);}
.goal-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap;gap:4px;}
.goal-acts,.asset-acts,.debt-acts{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;}
.badge{font-size:10.5px;padding:3px 8px;border-radius:7px;font-weight:700;white-space:nowrap;}
.st-active{background:var(--brand-soft);color:var(--brand);}
.st-done{background:#e7f8f1;color:var(--green);}
.st-end{background:#fff5e6;color:var(--amber);}
.st-bad{background:#fdecec;color:var(--red);}
.st-debt-iowe{background:#fdecec;color:var(--red);}
.st-debt-oweme{background:#e7f8f1;color:var(--green);}
.st-partial{background:#fff5e6;color:var(--amber);}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.asset-grid>div{display:flex;flex-direction:column;gap:2px;min-width:0;}
.asset-grid span{font-size:11.5px;color:var(--muted);}
.asset-grid b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
.asset-rows{display:flex;flex-direction:column;gap:6px;background:#fafbfd;border-radius:12px;padding:12px;}
.ar{display:flex;justify-content:space-between;font-size:12.5px;gap:8px;overflow-wrap:anywhere;word-break:break-word;}
.ar span{color:var(--muted);flex:0 0 auto;}
.ar b{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere;word-break:break-word;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-box{background:#fff;border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);}
.stat-box span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.stat-box b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-all;}
.cat-row{display:flex;flex-direction:column;gap:6px;padding:11px 0;}
.cat-row+.cat-row{border-top:1px solid var(--line);}
.cat-head{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;gap:8px;overflow-wrap:anywhere;word-break:break-word;}
.cat-head span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;}
.cat-bar{height:6px;background:#f0eff7;border-radius:99px;overflow:hidden;}
.cat-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));}
.cat-bar i.inc{background:linear-gradient(90deg,#0e9b6b,#34d399);}
.trend{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px;}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.trend-bar{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--brand-2),var(--brand));min-height:3px;transition:height .4s;}
.trend-bar.neg{background:linear-gradient(180deg,#fca5a5,#ef4444);}
.trend-lbl{font-size:11px;color:var(--muted);font-weight:600;}
.trend-val{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;}
.set-row+.set-row{border-top:1px solid var(--line);}
.set-title{font-size:14.5px;font-weight:600;}
.set-title.danger{color:var(--red);}
.set-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.set-val{font-size:13px;color:var(--muted);font-weight:600;text-align:right;}
.set-row.tap{cursor:pointer;}
.chev{font-size:20px;color:#c6cad6;line-height:1;flex:0 0 auto;}
.switch{width:48px;height:28px;border-radius:99px;background:#dfe2ea;border:none;position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto;}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.switch.on{background:var(--brand);}
.switch.on i{transform:translateX(20px);}

function detectLang(){
  try{
    const saved = localStorage.getItem(LANG_KEY);
    if(saved && I18N[saved]) return saved;
    for(const k of LEGACY_LANG_KEYS){
      const old = localStorage.getItem(k);
      if(old && I18N[old]) return old;
    }
  }catch(e){}
  const nav = (navigator.language || 'zh').toLowerCase();
  if(nav.startsWith('ms')) return 'ms';
  if(nav.startsWith('en')) return 'en';
  return 'zh';
}

  if(typeof s !== 'string') return s;
  if(vars){ Object.keys(vars).forEach(v => { s = s.replace(new RegExp('\\{'+v+'\\}','g'), vars[v]); }); }
  return s;
}

function loadChangelog(){
  try{
    const raw = localStorage.getItem(CHANGELOG_KEY);
    if(!raw) return CHANGELOG_SEED.slice();
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return CHANGELOG_SEED.slice();
    const seen = new Set(arr.map(x => x.version));
    CHANGELOG_SEED.forEach(c => { if(!seen.has(c.version)) arr.push(c); });
    return arr;
  }catch(e){ return CHANGELOG_SEED.slice(); }
}

function migrate(p){
  if(!p || typeof p !== 'object') return { ok:false, reason:'invalid', data:null };
  const original = JSON.parse(JSON.stringify(p));
  if(!Array.isArray(p.debts)) p.debts = [];
  if(!Array.isArray(p.moneyGiven)) p.moneyGiven = [];
  if(!Array.isArray(p.customIncomeCats)) p.customIncomeCats = [];
  if(!Array.isArray(p.customExpenseCats)) p.customExpenseCats = [];
  if(!Array.isArray(p.customMethods)) p.customMethods = [];

  // V1.02 交易记录补齐 timezone / editHistory
  (p.transactions || []).forEach(tx => {
    if(tx.method === undefined) tx.method = '';
    if(tx.methodCustom === undefined) tx.methodCustom = '';
    if(!tx.timezone) tx.timezone = 'Asia/Kuala_Lumpur';
    if(!Array.isArray(tx.editHistory)) tx.editHistory = [];
    if(!tx.eventAt) tx.eventAt = tx.date || nowISO();
    if(!tx.createdAt) tx.createdAt = Date.now();
    if(!tx.updatedAt) tx.updatedAt = tx.createdAt;
  });

  // V1.02 账户补齐 note
  (p.accounts || []).forEach(a => {
    if(a.note === undefined) a.note = '';
    if(!a.timezone) a.timezone = 'Asia/Kuala_Lumpur';
  });

  // V1.02 储蓄目标补齐字段
  (p.goals || []).forEach(g => {
    if(g.note === undefined) g.note = '';
    if(!Array.isArray(g.editHistory)) g.editHistory = [];
    if(!g.createdAt) g.createdAt = Date.now();
  });

  // V1.02 资产补齐字段
  (p.assets || []).forEach(a => {
    if(a.note === undefined) a.note = '';
    if(a.manualNote === undefined) a.manualNote = '';
    if(!Array.isArray(a.editHistory)) a.editHistory = [];
    if(!a.createdAt) a.createdAt = Date.now();
  });

  // V1.02 欠款迁移：新增 linkMode / linkedAccountId / eventAt / timezone / editHistory
  p.debts.forEach(d => {
    if(!Array.isArray(d.payments)) d.payments = [];
    if(d.purpose === undefined) d.purpose = '';
    if(d.purposeCustom === undefined) d.purposeCustom = '';
    if(d.method === undefined) d.method = '';
    if(d.methodCustom === undefined) d.methodCustom = '';
    if(d.reason === undefined) d.reason = '';
    if(d.paid === undefined) d.paid = 0;
    if(!d.status) d.status = 'unpaid';
    if(d.linkMode === undefined) d.linkMode = 'record_only';  // 默认仅记录，避免旧数据错误扣款
    if(d.linkedAccountId === undefined) d.linkedAccountId = null;
    if(!d.timezone) d.timezone = 'Asia/Kuala_Lumpur';
    if(!d.eventAt) d.eventAt = d.date || nowISO();
    if(!d.createdAt) d.createdAt = Date.now();
    if(!d.updatedAt) d.updatedAt = d.createdAt;
    if(!Array.isArray(d.editHistory)) d.editHistory = [];
    if(!d.eventId) d.eventId = d.id;
  });

  // V1.02 Money Given 迁移：新增 nature / sourceAccountId / eventAt / timezone / editHistory
  p.moneyGiven.forEach(m => {
    if(m.purpose === undefined) m.purpose = m.giftType || '';
    if(m.purposeCustom === undefined) m.purposeCustom = '';
    if(m.method === undefined) m.method = '';
    if(m.methodCustom === undefined) m.methodCustom = '';
    if(m.note === undefined) m.note = '';
    if(m.nature === undefined) m.nature = 'gift';    // 默认赠予，避免旧数据未联动账户
    if(m.sourceAccountId === undefined) m.sourceAccountId = m.accountId || null;
    if(!m.timezone) m.timezone = 'Asia/Kuala_Lumpur';
    if(!m.eventAt) m.eventAt = m.date || nowISO();
    if(!m.createdAt) m.createdAt = Date.now();
    if(!m.updatedAt) m.updatedAt = m.createdAt;
    if(!Array.isArray(m.editHistory)) m.editHistory = [];
    if(!m.eventId) m.eventId = m.id;
    if(m.linkedDebtId === undefined) m.linkedDebtId = null;
  });

  p.dataVersion = DATA_VERSION;
  const checks = [
    Array.isArray(p.accounts), Array.isArray(p.transactions), Array.isArray(p.goals),
    Array.isArray(p.assets), Array.isArray(p.debts), Array.isArray(p.moneyGiven),
    (p.settings && typeof p.settings === 'object')
  ];
  if(checks.some(x => !x)) return { ok:false, reason:'shape', data:original };
  return { ok:true, data:p };
}

function loadState(){
  const base = defaultState();
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    let cameFromLegacy = false;
    if(!raw){
      for(const k of LEGACY_KEYS){
        const old = localStorage.getItem(k);
        if(old){ raw = old; cameFromLegacy = true; break; }
      }
    }
    if(!raw) return { state:base, fresh:true };
    let p = JSON.parse(raw) || {};
    if(p && p.state && p.state.accounts) p = p.state;
    const r = migrate(p);
    if(!r.ok){ return { state:base, fresh:false, migrationFailed:true, original:r.data }; }
    const merged = {
      dataVersion: DATA_VERSION,
      settings: Object.assign({}, base.settings, r.data.settings || {}),
      accounts: Array.isArray(r.data.accounts) ? r.data.accounts : [],
      transactions: Array.isArray(r.data.transactions) ? r.data.transactions : [],
      goals: Array.isArray(r.data.goals) ? r.data.goals : [],
      assets: Array.isArray(r.data.assets) ? r.data.assets : [],
      debts: Array.isArray(r.data.debts) ? r.data.debts : [],
      moneyGiven: Array.isArray(r.data.moneyGiven) ? r.data.moneyGiven : [],
      customIncomeCats: Array.isArray(r.data.customIncomeCats) ? r.data.customIncomeCats : [],
      customExpenseCats: Array.isArray(r.data.customExpenseCats) ? r.data.customExpenseCats : [],
      customMethods: Array.isArray(r.data.customMethods) ? r.data.customMethods : [],
      achievements: (r.data.achievements && typeof r.data.achievements === 'object') ? r.data.achievements : {},
      createdAt: r.data.createdAt || new Date().toISOString()
    };
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(merged)); }catch(e){}
    return { state:merged, fresh:false, cameFromLegacy };
  }catch(e){
    console.error('[Jiheng loadState] error:', e);
    return { state:base, fresh:true, parseError:true };
  }
}

/* ============================ 安全 / 锁 ============================ */
function _syncHash(text){
  const str = String(text == null ? '' : text);
  let h1 = 0x811c9dc5 >>> 0;
  let h2 = 0x1000193 >>> 0;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = (h1 ^ c) >>> 0;
    h1 = (h1 * 0x01000193) >>> 0;
    h2 = ((h2 << 5) + h2 + c) >>> 0;
  }
  return 'jh10_' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0') + '_' + str.length.toString(16);
}
async function sha256(text){
  const str = String(text == null ? '' : text);
  if(window.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function'){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      const arr = Array.from(new Uint8Array(buf));
      let out = '';
      for(let i = 0; i < arr.length; i++){ out += arr[i].toString(16).padStart(2,'0'); }
      return out;
    }catch(err){
      console.warn('[Jiheng sha256] crypto.subtle.digest failed, using sync fallback:', err);
    }
  }
  return _syncHash(str);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function round2(n){ return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtNum(n){ return Math.abs(round2(n)).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function money(n){
  if(state.settings.hideBalance) return state.settings.currency + ' ••••••';

function nowISO(){ return new Date().toISOString(); }
function nowLocalDate(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function nowLocalTime(){ const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }
function dateFromISO(iso){ try{ const d = new Date(iso); return isNaN(d.getTime()) ? new Date() : d; } catch(e){ return new Date(); } }
function localDateStr(iso){ const d = dateFromISO(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function localTimeStr(iso){ const d = dateFromISO(iso); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function localTimeSecStr(iso){ const d = dateFromISO(iso); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }
function localDateTimeStr(iso){ const d = dateFromISO(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }
function combineDateTime(dateStr, timeStr){
  const parts = String(dateStr).split('-').map(Number);
  const timeParts = String(timeStr||'00:00:00').split(':').map(Number);
  const dt = new Date(parts[0]||1970, (parts[1]||1)-1, parts[2]||1, timeParts[0]||0, timeParts[1]||0, timeParts[2]||0);
  if(isNaN(dt.getTime())) return nowISO();
  return dt.toISOString();
}
function fmtDateLabel(iso){
  if(!iso) return '';
  const d = dateFromISO(iso);
  const today = new Date(); today.setHours(0,0,0,0);
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - that)/86400000);
  if(diff === 0) return t('today');
  if(diff === 1) return t('yesterday');
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  const langW = LANG === 'zh' ? ` 周${w}` : '';
  return `${d.getMonth()+1}月${d.getDate()}日${langW}`;
}

function sortedTx(){

  );
}
function monthKeyFromISO(iso){ const d = dateFromISO(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function inThisMonth(iso){ return monthKeyFromISO(iso) === monthKeyFromISO(nowISO()); }
function inThisYear(iso){ return dateFromISO(iso).getFullYear() === new Date().getFullYear(); }
function inThisWeek(iso){
  const d = dateFromISO(iso);
  const now = new Date();
  const day = (now.getDay() + 6) % 7;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
  monday.setHours(0,0,0,0);
  return d >= monday;
}
function inToday(iso){
  const d = dateFromISO(iso); const n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

/* ============================ 搜索归一化 ============================ */
function normalizeSearchText(s){
  if(s == null) return '';
  let str = String(s);
  try{ if(str.normalize) str = str.normalize('NFKC'); }catch(e){}
  str = str.toLowerCase();
  str = str.replace(/[\u200B-\u200D\uFEFF]/g, '');
  str = str.replace(/\s+/g, ' ').trim();
  return str;
}

function availableBalance(){ return round2(state.accounts.reduce((s,a) => s + (Number(a.balance)||0), 0)); }

function matchRange(iso, range){
  if(!range || range === 'all') return true;
  if(range === 'today') return inToday(iso);
  if(range === 'week')  return inThisWeek(iso);
  if(range === 'month') return inThisMonth(iso);
  if(range === 'year')  return inThisYear(iso);
  return true;
}

/* ============================ 成就 ============================ */
function currentStreak(){
  const days = new Set(state.transactions.map(tx => localDateStr(tx.eventAt||tx.date)));
  if(!days.size) return 0;
  let streak = 0;
  let d = new Date();
  if(!days.has(nowLocalDate())) d.setDate(d.getDate() - 1);
  while(days.has(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)){
    streak++;
    d.setDate(d.getDate() - 1);
    if(streak > 3650) break;
  }
  return streak;
}
function totalSavedEver(){ return state.transactions.filter(tx => tx.type === 'goal_deposit').reduce((s,tx) => s + (Number(tx.amount)||0), 0); }
function goalDepositCount(){ return state.transactions.filter(tx => tx.type === 'goal_deposit').length; }
function goalDoneCount(){ return state.goals.filter(g => Number(g.targetAmount) > 0 && Number(g.saved) >= Number(g.targetAmount)).length; }
function achievementProgress(a){
  switch(a.kind){
    case 'income_count':       return Math.min(state.transactions.filter(tx => tx.type === 'income').length, a.target);
    case 'expense_count':      return Math.min(state.transactions.filter(tx => tx.type === 'expense').length, a.target);
    case 'goal_count':         return Math.min(state.goals.length, a.target);
    case 'goal_deposit_count': return Math.min(goalDepositCount(), a.target);
    case 'asset_count':        return Math.min(state.assets.length, a.target);
    case 'account_count':      return Math.min(state.accounts.length, a.target);
    case 'debt_count':         return Math.min(state.debts.length, a.target);
    case 'money_given_count':  return Math.min(state.moneyGiven.length, a.target);
    case 'goal_done_count':    return Math.min(goalDoneCount(), a.target);
    case 'streak':             return Math.min(currentStreak(), a.target);
    case 'total_saved':        return Math.min(totalSavedEver(), a.target);
  }
  return 0;
}
function checkAchievements(){
  const list = I18N[LANG].achList || I18N.zh.achList;
  const newly = [];
  const unlock = (id) => {
    if(!state.achievements[id]){
      state.achievements[id] = Date.now();
      const a = list.find(x => x.id === id);
      if(a) newly.push(a);
    }
  };
  if(state.accounts.length > 0) unlock('first_account');
  if(state.transactions.some(tx => tx.type === 'income'))  unlock('first_income');
  if(state.transactions.some(tx => tx.type === 'expense')) unlock('first_expense');
  if(state.goals.length > 0) unlock('first_goal');
  if(state.assets.length > 0) unlock('first_asset');
  if(state.transactions.some(tx => tx.type === 'goal_deposit')) unlock('first_save');
  if(state.debts.length > 0) unlock('first_debt');
  if(state.moneyGiven.length > 0) unlock('first_given');
  if(goalDoneCount() > 0) unlock('goal_done');
  if(currentStreak() >= 7)  unlock('streak_7');
  if(currentStreak() >= 30) unlock('streak_30');
  const ts = totalSavedEver();
  if(ts >= 100)  unlock('save_100');
  if(ts >= 500)  unlock('save_500');
  if(ts >= 1000) unlock('save_1000');
  if(newly.length) saveState();
  return newly;
}

}

      try{ txt.setSelectionRange(txt.value.length, txt.value.length); }catch(e){}
      txt.addEventListener('input', e => { lockUI.pin = e.target.value; lockUI.error = false; });
      txt.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); handleTextConfirm(); } });
    }
    const ok = document.getElementById('lock-ok');
    if(ok) ok.addEventListener('click', e => { e.preventDefault(); handleTextConfirm(); });
  }else{
    dyn.innerHTML = `
      <div class="pin-dots" id="pin-dots">
        ${Array.from({length: pinLen}).map((_,i) => `<div class="pin-dot ${i < lockUI.pin.length ? 'filled':''} ${lockUI.error && i < lockUI.pin.length ? 'error':''}"></div>`).join('')}
      </div>
      <div class="lock-msg" id="lock-msg-el">${esc(lockUI.msg)}</div>
      <div class="keypad" id="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="key" data-k="${n}">${n}</button>`).join('')}
        <button type="button" class="key fn" data-k="clear">${esc(t('lockClear'))}</button>
        <button type="button" class="key" data-k="0">0</button>
        <button type="button" class="key fn" data-k="del">${esc(t('lockDel'))}</button>
        <button type="button" class="key enter" data-k="ok" style="grid-column:span 3">${esc(t('lockOk'))}</button>
      </div>`;
    dyn.querySelectorAll('#keypad .key').forEach(btn => {
      btn.addEventListener('click', e => { e.preventDefault(); handleKey(btn.dataset.k); });
    });
  }
}
function handleTextConfirm(){
  const txt = document.getElementById('lock-text');
  if(txt) lockUI.pin = txt.value;
  submitPin();
}
function handleKey(k){
  if(k === 'del'){ lockUI.pin = lockUI.pin.slice(0,-1); lockUI.error = false; updateLockDynamic(); return; }
  if(k === 'clear'){ lockUI.pin = ''; lockUI.error = false; lockUI.msg = ''; updateLockDynamic(); return; }
  if(k === 'ok'){ submitPin(); return; }
  if(/^\d$/.test(k)){
    if(lockUI.pin.length < 12){ lockUI.pin += k; lockUI.error = false; lockUI.msg = ''; }
    updateLockDynamic();
    if(!shouldUseTextMode() && lockUI.pin.length === 6) setTimeout(submitPin, 120);
  }
}
async function submitPin(){
  try{
    const pin = String(lockUI.pin == null ? '' : lockUI.pin);
    const usingText = shouldUseTextMode();
    const hasLock = !!(lockRecord && lockRecord.hash);
    if(!pin){ lockUI.msg = t('lockErrEmpty'); lockUI.error = true; updateLockDynamic(); return; }
    if(lockUI.mode === 'create'){
      if(!usingText && !/^\d{6}$/.test(pin)){ lockUI.msg = t('lockErrPin6'); lockUI.error = true; updateLockDynamic(); return; }
      if(usingText && pin.length < 4){ lockUI.msg = t('lockErrText4'); lockUI.error = true; updateLockDynamic(); return; }
      lockUI.firstPin = pin; lockUI.pin = ''; lockUI.mode = 'confirm'; lockUI.msg = ''; renderLock(); return;
    }
    if(lockUI.mode === 'confirm'){
      if(pin !== lockUI.firstPin){
        lockUI.msg = t('lockErrMismatch'); lockUI.error = true; lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'create'; renderLock(); return;
      }
      const hash = await sha256(pin);
      lockRecord = { hash, type: usingText ? 'text' : 'pin', createdAt: Date.now() };
      saveLock(lockRecord);
      lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'unlock'; lockUI.msg = ''; lockUI.error = false;
      isUnlocked = true; markActivity(); renderLock(); render({ top:true });
      toast(t('lockWelcome')); return;
    }
    if(lockUI.mode === 'changeOld'){
      const hash = await sha256(pin);
      if(!lockRecord || hash !== lockRecord.hash){ lockUI.msg = t('lockVerifyFailed'); lockUI.error = true; lockUI.pin = ''; updateLockDynamic(); return; }
      lockUI.mode = 'changeNew'; lockUI.pin = ''; lockUI.msg = '';
      lockUI.useTextMode = (lockRecord && lockRecord.type === 'text') ? true : false;
      renderLock(); return;
    }
    if(lockUI.mode === 'changeNew'){
      if(!usingText && !/^\d{6}$/.test(pin)){ lockUI.msg = t('lockErrPin6'); lockUI.error = true; updateLockDynamic(); return; }
      if(usingText && pin.length < 4){ lockUI.msg = t('lockErrText4'); lockUI.error = true; updateLockDynamic(); return; }
      lockUI.firstPin = pin; lockUI.pin = ''; lockUI.mode = 'changeConfirm'; lockUI.msg = ''; renderLock(); return;
    }
    if(lockUI.mode === 'changeConfirm'){
      if(pin !== lockUI.firstPin){
        lockUI.msg = t('lockErrMismatch'); lockUI.error = true; lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'changeNew'; renderLock(); return;
      }
      const hash = await sha256(pin);
      lockRecord = { hash, type: usingText ? 'text' : 'pin', createdAt: Date.now() };
      saveLock(lockRecord);
      lockUI.pin = ''; lockUI.firstPin = ''; lockUI.mode = 'unlock'; lockUI.msg = ''; lockUI.error = false;
      renderLock(); toast(t('lockUpdated')); return;
    }
    if(!hasLock){ lockUI.mode = 'create'; renderLock(); return; }
    const hash = await sha256(pin);
    if(hash === lockRecord.hash){
      isUnlocked = true; lockUI.pin = ''; lockUI.msg = ''; lockUI.error = false;
      markActivity(); renderLock(); render({ top:true });
    }else{
      lockUI.msg = t('lockErrWrong'); lockUI.error = true; lockUI.pin = '';
      updateLockDynamic();
      if(navigator.vibrate) navigator.vibrate(60);
    }
  }catch(err){
    console.error('[Jiheng submitPin] exception:', err);
    lockUI.msg = t('lockErrGeneric'); lockUI.error = true; lockUI.pin = '';
    try{ updateLockDynamic(); }catch(e2){}
  }
}
function lockApp(msg){
  isUnlocked = false;
  lockUI.mode = 'unlock'; lockUI.pin = ''; lockUI.firstPin = '';
  lockUI.msg = msg || ''; lockUI.error = false;
  lockUI.useTextMode = (lockRecord && lockRecord.type === 'text') ? true : false;
  renderLock();
}
setInterval(() => {
  if(!isUnlocked) return;
  if(!state.settings.appLockEnabled) return;
  const mins = Number(state.settings.autoLockMinutes) || 0;
  if(mins <= 0) return;
  if(Date.now() - lastActivity > mins * 60000) lockApp(t('lockAutoLocked'));
}, 5000);
['click','touchstart','keydown','scroll'].forEach(ev => { window.addEventListener(ev, markActivity, { passive:true }); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') markActivity(); });

/* V1.02：搜索输入保持焦点 + IME 兼容 */
let _imeComposing = false;
document.addEventListener('compositionstart', e => {
  if(e.target && (e.target.id === 'rec-search' || e.target.id === 'records-search')){
    _imeComposing = true;
  }
}, true);
document.addEventListener('compositionend', e => {
  if(e.target && (e.target.id === 'rec-search' || e.target.id === 'records-search')){
    _imeComposing = false;
    // 触发一次搜索
    if(e.target.id === 'rec-search'){ ui.searchQuery = e.target.value; rerenderTxListInPlace(); }
    if(e.target.id === 'records-search'){ ui.recordsSearch = e.target.value; rerenderRecordsInPlace(); }
  }
}, true);
document.addEventListener('input', e => {
  if(!e.target) return;
  if(e.target.id === 'rec-search'){
    if(_imeComposing) return;
    ui.searchQuery = e.target.value;
    rerenderTxListInPlace();
  }
  if(e.target.id === 'records-search'){
    if(_imeComposing) return;
    ui.recordsSearch = e.target.value;
    rerenderRecordsInPlace();
  }
});

/* V1.02：只替换列表与统计区域，不重建搜索框 */
function rerenderTxListInPlace(){
  const root = document.getElementById('app');
  if(!root) return;
  // 定位 view 容器，保留搜索输入与 seg
  const view = root.querySelector('.view');
  if(!view) { render(); return; }
  // 移除统计与列表（在最后），保留最前面的 filter 区域
  // 简化做法：找到所有 .stat-grid 和之后的兄弟节点，替换为 renderTxList()
  const statGrid = view.querySelector('.stat-grid');
  if(statGrid){
    // 移除 statGrid 之后的所有兄弟节点
    let n = statGrid.nextSibling;
    while(n){ const nx = n.nextSibling; n.remove ? n.remove() : view.removeChild(n); n = nx; }
    statGrid.remove();
    // 追加新的列表
    const tmp = document.createElement('div');
    tmp.innerHTML = renderTxList();
    while(tmp.firstChild){ view.appendChild(tmp.firstChild); }
    return;
  }
  // 没有 stat-grid（初始空状态），直接整体重绘但保留输入焦点
  render();
}
function rerenderRecordsInPlace(){
  const root = document.getElementById('app');
  if(!root) return;
  const view = root.querySelector('.view');
  if(!view) { render(); return; }
  // 简化做法：整体重绘后恢复 focus
  const el = document.getElementById('records-search');
  const val = el ? el.value : '';
  const pos = el ? el.selectionStart : 0;
  render();
  const el2 = document.getElementById('records-search');
  if(el2){ el2.value = val; el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} }
}

function assetCalc(a){
  const price    = Number(a.price) || 0;
  const totalDays = (Number(a.expectedYears)||0) * 365 + (Number(a.expectedMonths)||0) * 30;
  const dailyValue = totalDays > 0 ? price / totalDays : 0;
  const start = new Date(a.purchaseDate);
  const end   = a.endDate ? new Date(a.endDate) : new Date();
  let usedMs  = end.getTime() - start.getTime();
  if(!isFinite(usedMs) || usedMs < 0) usedMs = 0;
  const usedDays = usedMs / 86400000;
  let systemValue = dailyValue * usedDays;
  if(systemValue < 0) systemValue = 0;
  if(systemValue > price) systemValue = price;
  const hasManual = (a.manualValue !== null && a.manualValue !== undefined && a.manualValue !== '');
  const actualValue = hasManual ? Number(a.manualValue) : systemValue;
  const rate       = price > 0 ? actualValue / price : 0;
  const unreturned = Math.max(price - actualValue, 0);
  return { price, totalDays, dailyValue, usedDays, systemValue, actualValue, rate, unreturned, hasManual };
}

function last6Months(){
  const arr = [];
  const now = new Date();
  for(let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    arr.push({ key: monthKeyFromISO(d.toISOString()), label: `${d.getMonth()+1}月` });
  }
  return arr;
}
function viewStats(){
  const range = ui.statsRange;
  const txs = state.transactions.filter(tx => matchRange(tx.eventAt||tx.date, range));
  const income  = txs.filter(tx => tx.type === 'income').reduce((s,tx) => s + Number(tx.amount||0), 0);
  const expense = txs.filter(tx => tx.type === 'expense').reduce((s,tx) => s + Number(tx.amount||0), 0);
  const net     = income - expense;
  const catMap = {};
  txs.filter(tx => tx.type === 'expense').forEach(tx => { const k = tx.category || 'other_exp'; catMap[k] = (catMap[k] || 0) + Number(tx.amount||0); });
  const cats = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const incMap = {};
  txs.filter(tx => tx.type === 'income').forEach(tx => { const k = tx.category || 'other_income'; incMap[k] = (incMap[k] || 0) + Number(tx.amount||0); });
  const incCats = Object.entries(incMap).sort((a,b) => b[1] - a[1]);
  const maxInc = incCats.length ? incCats[0][1] : 0;
  const months = last6Months().map(m => {
    const inc = state.transactions.filter(tx => tx.type === 'income'  && String(tx.eventAt||tx.date||'').startsWith(m.key)).reduce((s,tx) => s + Number(tx.amount||0), 0);
    const exp = state.transactions.filter(tx => tx.type === 'expense' && String(tx.eventAt||tx.date||'').startsWith(m.key)).reduce((s,tx) => s + Number(tx.amount||0), 0);
    return { key:m.key, label:m.label, inc, exp, net: inc - exp };
  });
  const maxAbs = Math.max.apply(null, months.map(m => Math.abs(m.net)).concat([1]));
  const hasData = txs.length > 0;
  const rangeSegs = [['today', t('statsToday')],['week', t('statsWeek')],['month', t('statsMonth')],['year', t('statsYear')],['all', t('statsAll')]];
  return `
  <div class="seg">${rangeSegs.map(([v,l]) => `<button class="${range===v?'on':''}" onclick="setStatsRange('${v}')">${esc(l)}</button>`).join('')}</div>
  <div class="stat-grid">
    <div class="stat-box"><span>${esc(t('statsIncome'))}</span><b class="c-green">${money(income)}</b></div>
    <div class="stat-box"><span>${esc(t('statsExpense'))}</span><b class="c-red">${money(expense)}</b></div>
    <div class="stat-box"><span>${esc(t('statsNet'))}</span><b class="${net>=0?'c-green':'c-red'}">${money(net)}</b></div>
    <div class="stat-box"><span>${esc(t('statsLocked'))}</span><b>${money(lockedBalance())}</b></div>
  </div>
  <div class="card">
    <div class="section-head" style="margin-bottom:12px"><h3>${esc(t('statsExpenseCat'))}</h3></div>
    ${ cats.length ? cats.map(([name, amt]) => `<div class="cat-row">
      <div class="cat-head"><span>${catIcon(name)} ${esc(expenseDisplayLabel(name))}</span><span>${money(amt)}</span></div>
      <div class="cat-bar"><i style="width:${maxCat>0?(amt/maxCat*100).toFixed(1):0}%"></i></div>
    </div>`).join('') : `<div class="empty"><p>${esc(t('statsNoExpense'))}</p></div>` }
  </div>
  <div class="card">
    <div class="section-head" style="margin-bottom:12px"><h3>${esc(t('statsIncomeCat'))}</h3></div>
    ${ incCats.length ? incCats.map(([name, amt]) => `<div class="cat-row">
      <div class="cat-head"><span>${catIcon(name)} ${esc(incomeDisplayLabel(name))}</span><span>${money(amt)}</span></div>
      <div class="cat-bar"><i class="inc" style="width:${maxInc>0?(amt/maxInc*100).toFixed(1):0}%"></i></div>
    </div>`).join('') : `<div class="empty"><p>${esc(t('statsNoIncome'))}</p></div>` }
  </div>
  <div class="card">
    <div class="section-head" style="margin-bottom:6px"><h3>${esc(t('statsTrend'))}</h3><span style="font-size:12px;color:var(--muted)">${esc(t('statsTrendSub'))}</span></div>
    <div class="trend">
      ${ months.map(m => {
        const h = Math.max(Math.abs(m.net) / maxAbs * 92, m.net === 0 ? 2 : 6);
        return `<div class="trend-col">
          <div class="trend-val">${m.net === 0 ? '' : (m.net>0?'+':'-') + fmtNum(m.net)}</div>
          <div class="trend-bar ${m.net < 0 ? 'neg':''}" style="height:${h.toFixed(1)}%"></div>
          <div class="trend-lbl">${m.label}</div>
        </div>`;
      }).join('') }
    </div>
  </div>
  <p class="about">${esc(t('statsTransferNote'))}</p>
  ${ !hasData ? `<div class="empty big"><div class="empty-icon">📊</div><p>${esc(t('statsNoData'))}</p><span>${esc(t('statsNoDataSub'))}</span></div>` : '' }`;
}

  try{
    const payload = { app:'Jiheng', appVersion:APP_VERSION, dataVersion:DATA_VERSION, exportedAt:new Date().toISOString(), changelog:CHANGELOG, state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    downloadBlob(blob, 'jiheng-' + nowLocalDate() + '.json');
    toast(t('exportDone'));
  }catch(e){ toast(t('exportFail')); }
}
function exportCSV(){
  try{
    const rows = [['eventAt','createdAt','updatedAt','timezone','type','category','subCategory','method','amount','account','toAccount','note']];
    sortedTx().forEach(tx => {
      const acc = getAccount(tx.accountId);
      const to  = getAccount(tx.toAccountId);
      rows.push([
        localDateTimeStr(tx.eventAt||tx.date),
        localDateTimeStr(tx.createdAt),
        localDateTimeStr(tx.updatedAt),
        tx.timezone || '',
        tx.type,
        tx.category || '', tx.subCategory || '',
        tx.methodCustom || methodDisplay(tx.method || ''),
        String(Number(tx.amount||0).toFixed(2)),
        acc ? acc.name : '', to ? to.name : '',
        (tx.note || '').replace(/[\r\n,]/g,' ')
      ]);
    });
    const csv = '\ufeff' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
    downloadBlob(blob, 'jiheng-transactions-' + nowLocalDate() + '.csv');
    toast(t('exportCsvDone'));
  }catch(e){ toast(t('exportFail')); }
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function triggerImport(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const parsed = JSON.parse(ev.target.result);
        const src = parsed.state || parsed;
        if(!src || !Array.isArray(src.accounts)){ toast(t('importInvalid')); return; }
        confirmDialog(t('importConfirm'), () => {
          createBackup('before-import');
          try{
            const r = migrate(src);
            if(!r.ok){ toast(t('migrationFailed')); return; }
            state = {
              dataVersion: DATA_VERSION,
              settings: Object.assign({}, defaultState().settings, r.data.settings || {}),
              accounts: Array.isArray(r.data.accounts) ? r.data.accounts : [],
              transactions: Array.isArray(r.data.transactions) ? r.data.transactions : [],
              goals: Array.isArray(r.data.goals) ? r.data.goals : [],
              assets: Array.isArray(r.data.assets) ? r.data.assets : [],
              debts: Array.isArray(r.data.debts) ? r.data.debts : [],
              moneyGiven: Array.isArray(r.data.moneyGiven) ? r.data.moneyGiven : [],
              customIncomeCats: Array.isArray(r.data.customIncomeCats) ? r.data.customIncomeCats : [],
              customExpenseCats: Array.isArray(r.data.customExpenseCats) ? r.data.customExpenseCats : [],
              customMethods: Array.isArray(r.data.customMethods) ? r.data.customMethods : [],
              achievements: (r.data.achievements && typeof r.data.achievements === 'object') ? r.data.achievements : {},
              createdAt: r.data.createdAt || new Date().toISOString()
            };
            LANG = state.settings.lang || LANG;
            saveState();
            ui = { tab:'home', sub:null, recordFilter:'all', statsRange:'month', searchQuery:'', recordCat:'', recordAccount:'', currentAccountId:null, debtFilter:'all', recordsView:'home', recordsSearch:'', recordsType:'all', recordsStatus:'all', recordsDate:'all', expandedNotes:{} };
            render({ top:true }); toast(t('importDone'));
          }catch(err){ toast(t('importFail')); }
        });
      }catch(err){ toast(t('importInvalid')); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function clearData(){
  confirmDialog(t('clearTitle1'), () => {
    confirmDialog(t('clearTitle2'), () => {
      createBackup('before-clear');
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state = defaultState();
      saveState();
      ui = { tab:'home', sub:null, recordFilter:'all', statsRange:'month', searchQuery:'', recordCat:'', recordAccount:'', currentAccountId:null, debtFilter:'all', recordsView:'home', recordsSearch:'', recordsType:'all', recordsStatus:'all', recordsDate:'all', expandedNotes:{} };
      render({ top:true }); toast(t('clearDone'));
    });
  });
}

function openSheet(opts){
  const root = document.getElementById('sheet-root');
  root.innerHTML = `
    <div class="mask"></div>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h3>${esc(opts.title)}</h3><button type="button" class="icon-btn" data-close>✕</button></div>
      <form id="sheet-form" novalidate autocomplete="off">
        <div class="sheet-body">${opts.body}</div>
        <div class="sheet-foot">
          <button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button>
          <button type="submit" class="btn primary">${esc(opts.submitText || t('save'))}</button>
        </div>
      </form>
    </div>`;
  root.classList.add('show');
  document.body.classList.add('no-scroll');
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
  root.querySelector('.mask').addEventListener('click', closeSheet);
  const form = root.querySelector('#sheet-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = {};
    new FormData(form).forEach((v,k) => { data[k] = v; });
    let ok = true;
    if(opts.onSubmit){
      try { ok = await opts.onSubmit(data, form); }
      catch(err){ console.error('[Jiheng openSheet] submit error:', err); ok = false; }
    }
    if(ok !== false) closeSheet();
  });
  if(opts.afterRender) opts.afterRender(root);
}
function openActionSheet(title, actions){
  const root = document.getElementById('sheet-root');
  root.innerHTML = `
    <div class="mask"></div>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close>✕</button></div>
      <div class="sheet-body action-list">
        ${actions.map((a,i) => `<button type="button" class="action-item ${a.danger?'danger':''}" data-i="${i}"><span>${a.icon || ''}</span>${esc(a.label)}</button>`).join('')}
      </div>
    </div>`;
  root.classList.add('show'); document.body.classList.add('no-scroll');
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
  root.querySelector('.mask').addEventListener('click', closeSheet);
  root.querySelectorAll('.action-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = actions[Number(btn.dataset.i)];
      closeSheet();
      setTimeout(() => { if(a && a.onClick) a.onClick(); }, 280);
    });
  });
}
function confirmDialog(msg, onYes){
  const root = document.getElementById('sheet-root');
  root.innerHTML = `
    <div class="mask"></div>
    <div class="sheet small">
      <div class="sheet-body">
        <p class="confirm-msg">${esc(msg)}</p>
        <div class="confirm-btns">
          <button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button>
          <button type="button" class="btn danger" id="cf-yes">${esc(t('confirm'))}</button>
        </div>
      </div>
    </div>`;
  root.classList.add('show'); document.body.classList.add('no-scroll');
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
  root.querySelector('.mask').addEventListener('click', closeSheet);
  root.querySelector('#cf-yes').addEventListener('click', () => { closeSheet(); setTimeout(() => onYes(), 280); });
}
function closeSheet(){
  const root = document.getElementById('sheet-root');
  root.classList.remove('show'); document.body.classList.remove('no-scroll');
  const el = root;
  setTimeout(() => { if(!el.classList.contains('show')) el.innerHTML = ''; }, 340);
}
let toastTimer = null;
function toast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  const el = root.querySelector('.toast');
  requestAnimationFrame(() => el.classList.add('in'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('in');
    setTimeout(() => { if(root.firstChild === el) root.innerHTML = ''; }, 320);
  }, 2200);
}
function openGroupedPicker(opts){
  const sheetRoot = document.getElementById('sheet-root');
  const parentSheet = sheetRoot.querySelector('.sheet');
  let pickerRoot = document.getElementById('picker-root');
  if(!pickerRoot){
    pickerRoot = document.createElement('div');
    pickerRoot.id = 'picker-root';
    pickerRoot.style.cssText = 'position:fixed;inset:0;z-index:150;pointer-events:none;';
    document.body.appendChild(pickerRoot);
  }
  const labelFor = opts.labelFor || (id => id);
  const groupLabelFor = opts.groupLabelFor || (id => id);
  const iconFor = opts.iconFor || (id => '');
  pickerRoot.innerHTML = `
    <div class="mask" id="picker-mask" style="position:absolute;inset:0;background:rgba(28,24,48,.45);opacity:0;transition:opacity .26s;"></div>
    <div class="sheet" style="position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);padding-bottom:calc(16px + var(--safe-b));">
      <div class="sheet-handle"></div>
      <div class="sheet-head" style="display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px;position:sticky;top:0;background:#fff;z-index:2;border-radius:26px 26px 0 0;">
        <button type="button" class="icon-btn" id="picker-back" style="width:32px;height:32px;font-size:14px;box-shadow:none;background:var(--brand-soft);">←</button>
        <h3 style="margin:0;font-size:16.5px;font-weight:700;color:var(--brand);">${esc(opts.title || t('pickTitle'))}</h3>
        <button type="button" class="icon-btn" id="picker-close" style="width:32px;height:32px;font-size:14px;box-shadow:none;background:var(--brand-soft);">✕</button>
      </div>
      <div class="sheet-body" style="padding:0 18px;">
        ${opts.groups.map(g => `
          <div class="opt-label">${esc(groupLabelFor(g.group))}</div>
          <div class="opt-group">
            ${g.items.map(id => `
              <button type="button" class="opt-item ${opts.value===id?'on':''}" data-id="${esc(id)}">
                ${iconFor(id) ? iconFor(id)+' ' : ''}${esc(labelFor(id))}
              </button>
            `).join('')}
          </div>
        `).join('')}
        ${ opts.allowCustom ? `
          <div class="opt-label">${esc(t('pickCustom'))}</div>
          <label class="field" style="margin-top:2px">
            <input type="text" id="picker-custom-input" maxlength="80"
              placeholder="${esc(opts.customPlaceholder || t('catCustomPlaceholder'))}"
              value="${esc(opts.customValue || '')}">
          </label>
          <button type="button" class="btn primary block" id="picker-custom-save">${esc(t('pickOther'))}</button>
        ` : '' }
        <div style="height:8px"></div>
      </div>
    </div>`;
  pickerRoot.style.pointerEvents = 'auto';
  function closePicker(){
    const inner = pickerRoot.querySelector('.sheet');
    const mask = pickerRoot.querySelector('#picker-mask');
    if(inner) inner.style.transform = 'translateY(100%)';
    if(mask) mask.style.opacity = '0';
    setTimeout(() => {
      pickerRoot.innerHTML = '';
      pickerRoot.style.pointerEvents = 'none';
      const ps = sheetRoot.querySelector('.sheet');
      if(ps) ps.style.transform = 'translateY(0)';
    }, 320);
  }
  if(parentSheet){ parentSheet.style.transform = 'translateY(100%)'; }
  const pickerSheet = pickerRoot.querySelector('.sheet');
  const pickerMask = pickerRoot.querySelector('#picker-mask');
  requestAnimationFrame(() => {
    if(pickerMask) pickerMask.style.opacity = '1';
    if(pickerSheet) pickerSheet.style.transform = 'translateY(0)';
  });
  pickerRoot.querySelector('#picker-close').addEventListener('click', closePicker);
  pickerRoot.querySelector('#picker-back').addEventListener('click', closePicker);
  pickerMask.addEventListener('click', closePicker);
  pickerRoot.querySelectorAll('.opt-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if(opts.onPick) opts.onPick(id);
      closePicker();
    });
  });
  const cs = pickerRoot.querySelector('#picker-custom-save');
  if(cs){
    cs.addEventListener('click', () => {
      const val = (pickerRoot.querySelector('#picker-custom-input').value || '').trim();
      if(!val) return;
      if(opts.onCustom) opts.onCustom(val);
      closePicker();
    });
  }
}

function openAccountForm(){
  openSheet({
    title: t('createAccount'), submitText: t('add'),
    body: `
      <label class="field"><span class="field-label">${esc(t('accountName'))}</span><input name="name" type="text" required maxlength="80" placeholder="${esc(t('accountNamePlaceholder'))}"></label>
      <label class="field"><span class="field-label">${esc(t('accountType'))}</span>
        <select name="type">
          ${Object.entries(ACC_TYPES).map(([k,v]) => `<option value="${k}">${v.icon} ${esc(v.label)}</option>`).join('')}
        </select>
      </label>
      <label class="field"><span class="field-label">${esc(t('initialBalance'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="initial" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal"></div>
      </label>
      <p class="hint">${esc(t('initialHint'))}</p>`,
    onSubmit(d){
      const name = (d.name || '').trim();
      if(!name){ toast(t('catEnterName')); return false; }
      const acc = {
        id: uid(), name, type: d.type || 'other', balance: 0,
        note: '', timezone: 'Asia/Kuala_Lumpur',
        createdAt: Date.now()
      };
      const initial = parseFloat(d.initial);
      if(initial && initial > 0){
        const amt = round2(initial);
        acc.balance = amt;
        state.accounts.push(acc);
        const nowIso = nowISO();
        state.transactions.push({
          id: uid(), type:'income', amount: amt,
          eventAt: nowIso, date: nowIso,
          timezone: 'Asia/Kuala_Lumpur',
          category:'other_income', method:'cash', methodCustom:'',
          accountId: acc.id, note: t('initialBalanceNote'),
          editHistory: [],
          createdAt: Date.now(), updatedAt: Date.now()
        });
      }else{
        state.accounts.push(acc);
      }
      afterChange(); toast(t('accountCreated')); return true;
    }
  });
}
function openAccountMenu(id){
  const a = getAccount(id);
  if(!a) return;
  openActionSheet(a.name, [
    { label: t('renameAccount'), icon:'✏️', onClick: () => renameAccount(id) },
    { label: t('deleteAccount'),   icon:'🗑', danger:true, onClick: () => deleteAccount(id) }
  ]);
}
function renameAccount(id){
  const a = getAccount(id);
  if(!a) return;
  openSheet({
    title: t('renameAccount'),
    body: `<label class="field"><span class="field-label">${esc(t('accountName'))}</span><input name="name" type="text" required maxlength="80" value="${esc(a.name)}"></label>`,
    onSubmit(d){ const name = (d.name || '').trim(); if(!name) return false; a.name = name; afterChange(); toast(t('accountUpdated')); return true; }
  });
}
function deleteAccount(id){
  const a = getAccount(id);
  if(!a) return;
  if(Math.abs(Number(a.balance)||0) > 0.001){ toast(t('accountHasBalance')); return; }
  const used = state.transactions.some(tx => tx.accountId === id || tx.toAccountId === id) || state.moneyGiven.some(m => m.accountId === id);
  confirmDialog(used ? t('accountDeleteUsed') : t('accountDeleteConfirm'), () => {
    state.accounts = state.accounts.filter(x => x.id !== id);
    afterChange(); toast(t('accountDeleted'));
  });
}
function accountOptions(selected, excludeId){
  return state.accounts.filter(a => a.id !== excludeId)
    .map(a => `<option value="${a.id}" ${selected===a.id?'selected':''}>${esc(a.name)}（${fmtNum(a.balance||0)}）</option>`).join('');
}

function bindCategoryPicker(root, kind){
  const btn = root.querySelector('.cat-picker-btn');
  if(!btn) return;
  const hidden = root.querySelector('input[name="category"]');
  const customList = kind === 'income' ? state.customIncomeCats : state.customExpenseCats;
  btn.addEventListener('click', () => {
    const groups = kind === 'income' ? INCOME_GROUPS : EXPENSE_GROUPS;
    const labelFor = kind === 'income' ? incomeCatLabel : expenseCatLabel;
    const groupLabelFor = kind === 'income' ? incomeGroupLabel : expenseGroupLabel;
    openGroupedPicker({
      title: kind === 'income' ? t('catIncome') : t('catExpense'),
      groups: groups.concat(customList.length ? [{ group:'custom', items: customList.slice() }] : []),
      value: hidden ? hidden.value : '',
      allowCustom: true,
      customPlaceholder: t('catCustomPlaceholder'),
      labelFor: (id) => customList.includes(id) ? id : labelFor(id),
      groupLabelFor: (g) => g === 'custom' ? t('catCustomIncome') : groupLabelFor(g),
      iconFor: (id) => catIcon(id),
      onPick: (id) => {
        if(hidden) hidden.value = id;
        btn.innerHTML = `${catIcon(id)||'📌'} ${esc(customList.includes(id) ? id : labelFor(id))}`;
      },
      onCustom: (text) => {
        if(kind === 'income' && !state.customIncomeCats.includes(text)) state.customIncomeCats.push(text);
        if(kind === 'expense' && !state.customExpenseCats.includes(text)) state.customExpenseCats.push(text);
        saveState();
        if(hidden) hidden.value = text;
        btn.innerHTML = `${catIcon(text)||'📌'} ${esc(text)}`;
      }
    });
  });
}
function bindMethodPicker(root){
  const btn = root.querySelector('.method-picker-btn');
  if(!btn) return;
  const hiddenId = root.querySelector('input[name="method"]');
  const hiddenCustom = root.querySelector('input[name="methodCustom"]');
  btn.addEventListener('click', () => {
    const customM = state.customMethods || [];
    openGroupedPicker({
      title: t('pickMethod'),
      groups: MONEY_METHOD_GROUPS.concat(customM.length ? [{ group:'custom_method', items: customM.slice() }] : []),
      value: hiddenId ? hiddenId.value : '',
      allowCustom: true,
      customValue: hiddenCustom ? hiddenCustom.value : '',
      customPlaceholder: t('methodCustom'),
      labelFor: (id) => customM.includes(id) ? id : methodLabel(id),
      groupLabelFor: (g) => g === 'custom_method' ? t('pickCustom') : methodGroupLabel(g),
      onPick: (id) => {
        if(hiddenId) hiddenId.value = id;
        if(hiddenCustom) hiddenCustom.value = '';
        btn.innerHTML = esc(customM.includes(id) ? id : methodLabel(id));
      },
      onCustom: (text) => {
        if(!Array.isArray(state.customMethods)) state.customMethods = [];
        if(!state.customMethods.includes(text)) state.customMethods.push(text);
        saveState();
        if(hiddenId) hiddenId.value = '';
        if(hiddenCustom) hiddenCustom.value = text;
        btn.innerHTML = esc(text);
      }
    });
  });
}

function openIncomeForm(presetAccountId){
  if(!state.accounts.length){ toast(t('noAccountWarn')); return; }
  const initialCat = allIncomeIds()[0];
  const initialMethod = 'cash';
  openSheet({
    title: t('recordIncome'), submitText: t('saveIncome'),
    body: `
      <label class="field"><span class="field-label">${esc(t('amount'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span><input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal"></div>
      </label>
      <div class="field"><span class="field-label">${esc(t('category'))}</span>${renderCategoryPickerButton('income', initialCat, incomeCatLabel(initialCat))}</div>
      <div class="field"><span class="field-label">${esc(t('incomeMethod'))}</span>${renderMethodPickerButton(initialMethod, methodLabel(initialMethod), '')}</div>
      <label class="field"><span class="field-label">${esc(t('account'))}</span><select name="accountId">${accountOptions(presetAccountId)}</select></label>
      <div class="two-col">
        <label class="field"><span class="field-label">${esc(t('date'))}</span><input name="date" type="date" value="${nowLocalDate()}" required></label>
        <label class="field"><span class="field-label">${esc(t('time'))}</span><input name="time" type="time" step="1" value="${nowLocalTime()}" required></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('note'))}</span><textarea name="note" maxlength="4000" placeholder="${esc(t('notePlaceholder'))}"></textarea></label>
      <label class="field"><span class="field-label">${esc(t('recurringLabel'))}</span>
        <select name="recurring"><option value="">${esc(t('recurringNo'))}</option><option value="1">${esc(t('recurringYes'))}</option></select>
      </label>`,
    onSubmit(d){
      const amount = round2(parseFloat(d.amount));
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      const acc = getAccount(d.accountId);
      if(!acc){ toast(t('accountNotExist')); return false; }
      acc.balance = round2((Number(acc.balance)||0) + amount);
      const eventAt = combineDateTime(d.date || nowLocalDate(), d.time || nowLocalTime());
      state.transactions.push({
        id: uid(), type: 'income', amount,

function openDebtForm(presetId){
  const editing = presetId ? getDebt(presetId) : null;
  const initialPurpose = 'food_debt';
  const initialMethod = 'cash';
  const initialLinkMode = editing ? (editing.linkMode || 'record_only') : 'record_only';
