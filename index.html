        <label class="field"><span class="field-label">${esc(t('date'))}</span><input name="date" type="date" value="${localDateStr(tx.eventAt||tx.date)}" required></label>
        <label class="field"><span class="field-label">${esc(t('time'))}</span><input name="time" type="time" step="1" value="${localTimeSecStr(tx.eventAt||tx.date)}" required></label>
      </div>
      <label class="field"><span class="field-label">${esc(t('note'))}</span><textarea name="note" maxlength="4000">${esc(tx.note||'')}</textarea></label>`,
    onSubmit(d){
      const newAmount = round2(parseFloat(d.amount));
      if(!(newAmount > 0)){ toast(t('invalidAmount')); return false; }
      const oldAcc = getAccount(tx.accountId);
      if(tx.type === 'income'){
        if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) - Number(tx.amount));
      }else{
        if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) + Number(tx.amount));
      }
      const newAcc = getAccount(d.accountId);
      if(!newAcc){
        if(tx.type === 'income'){ if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) + Number(tx.amount)); }
        else { if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) - Number(tx.amount)); }
        toast(t('accountNotExist')); return false;
      }
      if(tx.type === 'expense' && round2(Number(newAcc.balance)||0) < newAmount){
        if(tx.type === 'income'){ if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) + Number(tx.amount)); }
        else { if(oldAcc) oldAcc.balance = round2((Number(oldAcc.balance)||0) - Number(tx.amount)); }
        toast(t('insufficientBalance')); return false;
      }
      if(tx.type === 'income'){ newAcc.balance = round2((Number(newAcc.balance)||0) + newAmount); }
      else { newAcc.balance = round2((Number(newAcc.balance)||0) - newAmount); }
      tx.amount = newAmount;
      tx.category = d.category || tx.category;
      tx.method = d.method || '';
      tx.methodCustom = d.methodCustom || '';
      tx.accountId = newAcc.id;
      const newEventAt = combineDateTime(d.date || localDateStr(tx.eventAt||tx.date), d.time || localTimeSecStr(tx.eventAt||tx.date));
      tx.eventAt = newEventAt; tx.date = newEventAt;
      tx.note = (d.note || '');
      tx.updatedAt = Date.now();
      if(!Array.isArray(tx.editHistory)) tx.editHistory = [];
      tx.editHistory.push({ at: nowISO(), action: 'edit' });
      afterChange(); toast(t('accountUpdated')); return true;
    },
    afterRender(root){ bindCategoryPicker(root, isIncome?'income':'expense'); bindMethodPicker(root); }
  });
}
function deleteTransaction(id){
  const tx = state.transactions.find(x => x.id === id);
  if(!tx) return;
  if(tx.linkedRepaymentId){
    toast(t('debtRepayHint'));
    return;
  }
  confirmDialog(deleteConfirmTitleFor(tx.type), () => {
    try{
      switch(tx.type){
        case 'income': { const a = getAccount(tx.accountId); if(a) a.balance = round2((Number(a.balance)||0) - Number(tx.amount)); break; }
        case 'expense': { const a = getAccount(tx.accountId); if(a) a.balance = round2((Number(a.balance)||0) + Number(tx.amount)); break; }
        case 'transfer': {
          const f = getAccount(tx.accountId), to = getAccount(tx.toAccountId);
          if(f)  f.balance  = round2((Number(f.balance)||0)  + Number(tx.amount));
          if(to) to.balance = round2((Number(to.balance)||0) - Number(tx.amount));
          break;
        }
        case 'goal_deposit': {
          const a = getAccount(tx.accountId), g = getGoal(tx.goalId);
          if(a) a.balance = round2((Number(a.balance)||0) + Number(tx.amount));
          if(g) g.saved   = round2((Number(g.saved)||0)   - Number(tx.amount));
          break;
        }
        case 'goal_withdraw': {
          const a = getAccount(tx.accountId), g = getGoal(tx.goalId);
          if(a) a.balance = round2((Number(a.balance)||0) - Number(tx.amount));
          if(g) g.saved   = round2((Number(g.saved)||0)   + Number(tx.amount));
          break;
        }
      }
    }catch(e){}
    state.transactions = state.transactions.filter(x => x.id !== id);
    state.goals.forEach(g => { if(Number(g.saved) < 0) g.saved = 0; });
    afterChange(); toast(t('accountDeleted'));
  });
}

function viewEditHistory(kind, id, parentId){
  let obj = null;
  if(kind === 'tx') obj = state.transactions.find(x => x.id === id);
  else if(kind === 'debt') obj = getDebt(id);
  else if(kind === 'mg') obj = getMG(id);
  else if(kind === 'goal') obj = getGoal(id);
  else if(kind === 'asset') obj = getAsset(id);
  else if(kind === 'repay'){
    const d = getDebt(parentId);
    if(d) obj = debtRepayments(d).find(r => r.id === id);
  }
  if(!obj) return;
  const fmtSafe = (v) => v ? localDateTimeStr(v) : '—';
  const hist = Array.isArray(obj.editHistory) ? obj.editHistory : [];
  const rows = [
    `<div class="ar"><span>${esc(t('eventTimeLabel'))}</span><b>${esc(fmtSafe(obj.eventAt || obj.date))}</b></div>`,
    `<div class="ar"><span>${esc(t('createdAtLabel'))}</span><b>${esc(fmtSafe(obj.createdAt))}</b></div>`,
    `<div class="ar"><span>${esc(t('updatedAtLabel'))}</span><b>${esc(fmtSafe(obj.updatedAt || obj.createdAt))}</b></div>`
  ];
  if(hist.length){
    hist.forEach((h, i) => {
      rows.push(`<div class="ar"><span>Edit #${i+1}</span><b>${esc(fmtSafe(h.at))}${h.action ? ' · ' + esc(h.action) : ''}</b></div>`);
    });
  }else{
    rows.push(`<div class="ar"><span>${esc(t('noEditHistory'))}</span><b>—</b></div>`);
  }
  openSheet({
    title: t('editHistoryTitle'),
    submitText: t('close'),
    body: `<div class="asset-rows">${rows.join('')}</div>`,
    onSubmit(){ return true; }
  });
}

/* =========================================================================
   JIHENG SECURE DATA TRANSFER SYSTEM
   -----------------------------------------------------------------------
   核心安全架构 — 不写入 Update History，不修改 App Version。
   核心原则：
   - 加密后才是可复制文件
   - 密码独立于 App Lock
   - 密码绝不写入文件
   - 转移未完成 = 不视为成功
   - 绝不自动删除源数据
   - 绝不部分写入
   - 绝不硬编码秘密
   ========================================================================= */

const JT_TRANSFER_FORMAT = 'jiheng-transfer-package';
const JT_TRANSFER_FORMAT_VERSION = 1;
const JT_PBKDF2_ITERATIONS = 600000;
const JT_PBKDF2_HASH = 'SHA-256';
const JT_AES_ALGO = 'AES-GCM';
const JT_AES_KEY_LENGTH = 256;
const JT_SALT_LENGTH = 16;
const JT_IV_LENGTH = 12;
const JT_TRANSFER_PW_MIN_LENGTH = 10;
const JT_TRANSFER_STATE_KEY = 'jiheng_transfer_state_v1';
const JT_IMPORTED_PACKAGES_KEY = 'jiheng_imported_packages_v1';

/* ---------- 字节 / 字符串 转换 ---------- */
function jtBufToBase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function jtBase64ToBuf(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function jtBufToHex(buf){
  const bytes = new Uint8Array(buf);
  let out = '';
  for(let i = 0; i < bytes.length; i++) out += bytes[i].toString(16).padStart(2,'0');
  return out;
}
function jtRandomBytes(len){
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return bytes;
}
function jtGeneratePackageId(){
  return 'jhp-' + jtBufToHex(jtRandomBytes(16));
}

/* ---------- 密码强度 / 弱密码检测 ---------- */
const JT_COMMON_PASSWORDS = [
  'password','password1','password123','passw0rd','p@ssw0rd',
  '12345678','123456789','1234567890','0123456789','9876543210',
  'qwerty','qwertyuiop','qwerty123','qwerty1234','asdfghjkl',
  'abcdefgh','abcdefghij','aaaaaaaa','aaaaaaaaaa','1111111111',
  '0000000000','2222222222','iloveyou','admin','admin123','root',
  'letmein','welcome','monkey','dragon','jiheng','jiheng123',
  'jiheng2024','jiheng2025','jiheng2026','jih3ng'
];
function jtDetectWeakPassword(pw){
  const reasons = [];
  const p = String(pw || '');
  if(!p){ reasons.push('empty'); return reasons; }
  if(p.length < JT_TRANSFER_PW_MIN_LENGTH) reasons.push('too_short');
  const lower = p.toLowerCase();
  if(JT_COMMON_PASSWORDS.indexOf(lower) !== -1) reasons.push('common_password');
  if(/0{4,}|1{4,}|2{4,}|3{4,}|4{4,}|5{4,}|6{4,}|7{4,}|8{4,}|9{4,}/.test(p)) reasons.push('repeated_digit');
  if(/([a-zA-Z])\1{3,}/.test(p)) reasons.push('repeated_char');
  if(/qwerty|asdf|zxcv|1234|abcd|4321|dcba/i.test(p)) reasons.push('keyboard_pattern');
  for(let i = 0; i + 4 <= p.length; i++){
    const a = p.charCodeAt(i), b = p.charCodeAt(i+1), c = p.charCodeAt(i+2), d = p.charCodeAt(i+3);
    if(b - a === 1 && c - b === 1 && d - c === 1){ reasons.push('sequential_pattern'); break; }
    if(a - b === 1 && b - c === 1 && c - d === 1){ reasons.push('sequential_pattern'); break; }
  }
  if(/^\d+$/.test(p)) reasons.push('digits_only');
  if(/^[a-zA-Z]+$/.test(p)) reasons.push('letters_only');
  if(/jiheng|积衡/i.test(p)) reasons.push('contains_app_name');
  if(/^01\d{8,9}$/.test(p.replace(/[-\s]/g,''))) reasons.push('phone_like');
  return reasons;
}
function jtScorePassword(pw){
  const p = String(pw || '');
  if(!p) return { score: 0, label: 'weak', reasons: ['empty'] };
  const weak = jtDetectWeakPassword(p);
  const hardReject = weak.some(r =>
    r === 'too_short' || r === 'common_password' || r === 'repeated_digit' ||
    r === 'repeated_char' || r === 'keyboard_pattern' || r === 'sequential_pattern' ||
    r === 'digits_only' || r === 'letters_only' || r === 'contains_app_name' ||
    r === 'phone_like' || r === 'empty'
  );
  if(hardReject) return { score: 0, label: 'weak', reasons: weak };
  let score = 1;
  const hasUpper = /[A-Z]/.test(p);
  const hasLower = /[a-z]/.test(p);
  const hasDigit = /\d/.test(p);
  const hasSymbol = /[^A-Za-z0-9]/.test(p);
  if(p.length >= 10) score++;
  if(p.length >= 14) score++;
  if(hasUpper && hasLower) score++;
  if(hasDigit) score++;
  if(hasSymbol) score++;
  if(score > 4) score = 4;
  const label = score <= 1 ? 'weak' : score === 2 ? 'fair' : score === 3 ? 'strong' : 'very_strong';
  return { score, label, reasons: [] };
}

/* ---------- 与 App Lock 相似度检测 ---------- */
async function jtCheckAppLockSimilarity(pw){
  try {
    const p = String(pw || '');
    if(!p || !lockRecord || !lockRecord.hash) return { similar: false };
    const h = await sha256(p);
    if(h === lockRecord.hash) return { similar: true, reason: 'identical' };
    const v1 = await sha256(p.toLowerCase());
    if(v1 === lockRecord.hash) return { similar: true, reason: 'case_variant' };
    const v2 = await sha256(p.trim());
    if(v2 === lockRecord.hash) return { similar: true, reason: 'trim_variant' };
    if(lockRecord.type === 'pin'){
      if(/^\d+$/.test(p) && p.length >= 4 && p.length <= 8){
        return { similar: true, reason: 'pin_like' };
      }
      const pinVar = [p + '0', p + '00', p + '1', '0' + p, '1' + p];
      for(const v of pinVar){
        const hh = await sha256(v);
        if(hh === lockRecord.hash) return { similar: true, reason: 'pin_variant' };
      }
    }
    return { similar: false };
  } catch(e){
    return { similar: false };
  }
}

/* ---------- 密码派生 ---------- */
async function jtDeriveKey(password, salt, usage){
  // usage: 'encrypt' | 'decrypt'
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: JT_PBKDF2_ITERATIONS, hash: JT_PBKDF2_HASH },
    keyMaterial,
    { name: JT_AES_ALGO, length: JT_AES_KEY_LENGTH },
    false,
    [usage]
  );
}

/* ---------- 打包 / 加密 ---------- */
async function jtBuildAndEncryptPackage(password, snapshot){
  const payload = {
    dataVersion: DATA_VERSION,
    appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(),
    timezone: APP_TZ,
    state: snapshot
  };
  const payloadBytes = new TextEncoder().encode(JSON.stringify(payload));

  const salt = jtRandomBytes(JT_SALT_LENGTH);
  const iv = jtRandomBytes(JT_IV_LENGTH);
  const key = await jtDeriveKey(password, salt, 'encrypt');

  const cipherBuf = await crypto.subtle.encrypt(
    { name: JT_AES_ALGO, iv: iv, tagLength: 128 },
    key,
    payloadBytes
  );

  const packageId = jtGeneratePackageId();
  const container = {
    format: JT_TRANSFER_FORMAT,
    formatVersion: JT_TRANSFER_FORMAT_VERSION,
    packageId: packageId,
    kdf: {
      name: 'PBKDF2',
      hash: JT_PBKDF2_HASH,
      iterations: JT_PBKDF2_ITERATIONS,
      salt: jtBufToBase64(salt)
    },
    cipher: {
      name: JT_AES_ALGO,
      keyLength: JT_AES_KEY_LENGTH,
      iv: jtBufToBase64(iv),
      tagLength: 128
    },
    createdAt: new Date().toISOString(),
    payload: jtBufToBase64(cipherBuf)
  };
  return { container, packageId };
}

/* ---------- 解包 / 解密 ---------- */
async function jtDecryptPackage(password, container){
  if(!container || container.format !== JT_TRANSFER_FORMAT){
    throw new Error('JT_ERR_INVALID_FORMAT');
  }
  if(container.formatVersion !== JT_TRANSFER_FORMAT_VERSION){
    throw new Error('JT_ERR_VERSION_UNSUPPORTED');
  }
  if(!container.kdf || !container.cipher || !container.payload){
    throw new Error('JT_ERR_INVALID_FORMAT');
  }
  const salt = jtBase64ToBuf(container.kdf.salt);
  const iv = jtBase64ToBuf(container.cipher.iv);
  const cipherBuf = jtBase64ToBuf(container.payload);
  const key = await jtDeriveKey(password, salt, 'decrypt');

  let plainBuf;
  try {
    plainBuf = await crypto.subtle.decrypt(
      { name: JT_AES_ALGO, iv: iv, tagLength: 128 },
      key,
      cipherBuf
    );
  } catch(e){
    throw new Error('JT_ERR_DECRYPT_FAILED');
  }
  let parsed;
  try {
    parsed = JSON.parse(new TextDecoder().decode(plainBuf));
  } catch(e){
    throw new Error('JT_ERR_CORRUPTED');
  }
  return parsed;
}

/* ---------- 校验导入快照 ---------- */
function jtValidateSnapshot(snap){
  if(!snap || typeof snap !== 'object') return false;
  if(!Array.isArray(snap.accounts)) return false;
  if(!Array.isArray(snap.transactions)) return false;
  if(!Array.isArray(snap.goals)) return false;
  if(!Array.isArray(snap.assets)) return false;
  if(!Array.isArray(snap.debts)) return false;
  if(!Array.isArray(snap.moneyGiven)) return false;
  return true;
}
/* ---------- 导入数据到当前 state ---------- */
function jtApplySnapshotToState(snap){
  // 只替换数据字段，不动 settings.lang（保持当前语言）
  const currentLang = state.settings.lang;
  state.accounts = Array.isArray(snap.accounts) ? snap.accounts : [];
  state.transactions = Array.isArray(snap.transactions) ? snap.transactions : [];
  state.goals = Array.isArray(snap.goals) ? snap.goals : [];
  state.assets = Array.isArray(snap.assets) ? snap.assets : [];
  state.debts = Array.isArray(snap.debts) ? snap.debts : [];
  state.moneyGiven = Array.isArray(snap.moneyGiven) ? snap.moneyGiven : [];
  state.customIncomeCats = Array.isArray(snap.customIncomeCats) ? snap.customIncomeCats : [];
  state.customExpenseCats = Array.isArray(snap.customExpenseCats) ? snap.customExpenseCats : [];
  state.customMethods = Array.isArray(snap.customMethods) ? snap.customMethods : [];
  state.achievements = (snap.achievements && typeof snap.achievements === 'object') ? snap.achievements : {};
  if(snap.settings && typeof snap.settings === 'object'){
    state.settings = Object.assign({}, state.settings, snap.settings);
    state.settings.lang = currentLang;
  }
  // 重新走 migrate 保证结构完整
  const r = migrate(state);
  if(r.ok) state = r.data;
  saveState();
}

/* ---------- 计算预览数字 ---------- */
function jtCountSnapshot(snap){
  if(!snap || typeof snap !== 'object') return {};
  const transferCount = Array.isArray(snap.transactions) ? snap.transactions.filter(tx => tx.type === 'transfer').length : 0;
  let repaymentCount = 0;
  if(Array.isArray(snap.debts)){
    snap.debts.forEach(d => {
      if(Array.isArray(d.repayments)) repaymentCount += d.repayments.length;
    });
  }
  return {
    accounts: Array.isArray(snap.accounts) ? snap.accounts.length : 0,
    transactions: Array.isArray(snap.transactions) ? snap.transactions.length : 0,
    transfers: transferCount,
    goals: Array.isArray(snap.goals) ? snap.goals.length : 0,
    assets: Array.isArray(snap.assets) ? snap.assets.length : 0,
    debts: Array.isArray(snap.debts) ? snap.debts.length : 0,
    repayments: repaymentCount,
    moneyGiven: Array.isArray(snap.moneyGiven) ? snap.moneyGiven.length : 0
  };
}

function jtRerenderSecure(){
  // 只重绘 secure 页面内层，保留 input focus
  const root = document.getElementById('app');
  if(!root) return;
  const view = root.querySelector('.view');
  if(!view) { render(); return; }
  // 记录当前 focus
  const active = document.activeElement;
  const activeId = active ? active.id : null;
  const selStart = active && active.selectionStart != null ? active.selectionStart : null;
  const selEnd = active && active.selectionEnd != null ? active.selectionEnd : null;
  view.innerHTML = viewSecureTransfer();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      try { el.focus(); } catch(e){}
      if(selStart != null && selEnd != null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
}

function jtWeakReasonLabel(key){
  const map = {
    empty: 'secureWeakReasonEmpty',
    too_short: 'secureWeakReasonTooShort',
    common_password: 'secureWeakReasonCommon',
    repeated_digit: 'secureWeakReasonRepeatedDigit',
    repeated_char: 'secureWeakReasonRepeatedChar',
    keyboard_pattern: 'secureWeakReasonKeyboard',
    sequential_pattern: 'secureWeakReasonSequential',
    digits_only: 'secureWeakReasonDigitsOnly',
    letters_only: 'secureWeakReasonLettersOnly',
    contains_app_name: 'secureWeakReasonAppName',
    phone_like: 'secureWeakReasonPhoneLike'
  };
  return t(map[key] || key);
}

async function jtDoExport(){
  if(jtUI.exportBusy) return;
  const pw = jtUI.exportPassword;
  const pw2 = jtUI.exportPasswordConfirm;

  // 1) 长度
  if(!pw || pw.length < JT_TRANSFER_PW_MIN_LENGTH){
    toast(t('securePasswordTooShort', { n: JT_TRANSFER_PW_MIN_LENGTH }));
    return;
  }
  // 2) 强度
  const sc = jtScorePassword(pw);
  if(sc.score === 0){
    toast(t('securePasswordTooWeak'));
    return;
  }
  // 3) 匹配
  if(pw !== pw2){
    toast(t('securePasswordMismatch'));
    return;
  }
  // 4) 与 App Lock 相似度
  const similar = await jtCheckAppLockSimilarity(pw);
  if(similar.similar){
    if(similar.reason === 'identical') toast(t('securePasswordSameAsAppLock'));
    else toast(t('securePasswordSimilarToAppLock'));
    return;
  }

  jtUI.exportBusy = true;
  jtRerenderSecure();

  try {
    // 标记转移开始（在 localStorage 里保持"未完成"）
    jtStartTransferState('export', { startedAt: Date.now() });

    const snap = jtBuildSnapshot();
    const result = await jtBuildAndEncryptPackage(pw, snap);

    const filename = (t('secureExportFilePrefix') || 'Jiheng_Transfer') + '_' +
      nowLocalDate() + '_' + nowLocalTime().replace(/:/g,'') + '.jhtransfer';

    const blob = new Blob([JSON.stringify(result.container)], { type: 'application/octet-stream' });
    downloadBlob(blob, filename);

    jtUI.exportFileName = filename;
    jtUI.exportDone = true;
    jtUI.exportBusy = false;

    // 标记导出完成
    jtMarkTransferComplete('export', { packageId: result.packageId, filename: filename });

    // 清空密码内存
    jtUI.exportPassword = '';
    jtUI.exportPasswordConfirm = '';

    jtRerenderSecure();
    toast(t('secureExportSuccessTitle'));
  } catch(e){
    jtUI.exportBusy = false;
    jtRerenderSecure();
    toast(t('secureStepFailed'));
    console.error('[JT export]', e);
  }
}

function jtTogglePasswordVisibility(inputId, btn){

function jtOnImportFileChosen(input){
  jtUI.importError = '';
  jtUI.importPreview = null;
  jtUI.importContainer = null;
  jtUI.importPassword = '';
  jtUI.duplicateWarning = false;
  jtUI.existingDataWarning = false;

  const file = input.files && input.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const text = String(e.target.result || '');
      const parsed = JSON.parse(text);
      if(!parsed || parsed.format !== JT_TRANSFER_FORMAT){
        jtUI.importError = t('secureImportFileInvalid');
        jtRerenderSecure();
        return;
      }
      if(parsed.formatVersion !== JT_TRANSFER_FORMAT_VERSION){
        jtUI.importError = t('secureImportFileVersionUnsupported');
        jtRerenderSecure();
        return;
      }
      jtUI.importContainer = parsed;
      jtUI.importPackageId = parsed.packageId || '';
      // 检测是否已经导入过
      if(jtUI.importPackageId && jtHasPackageBeenImported(jtUI.importPackageId)){
        jtUI.duplicateWarning = true;
      }
      // 检测当前设备是否已有数据
      const hasExisting = (state.accounts.length || state.transactions.length || state.goals.length || state.assets.length || state.debts.length || state.moneyGiven.length);
      if(hasExisting) jtUI.existingDataWarning = true;
      jtRerenderSecure();
    } catch(err){
      jtUI.importError = t('secureImportFileInvalid');
      jtRerenderSecure();
    }
  };
  reader.onerror = () => {
    jtUI.importError = t('secureImportFileInvalid');
    jtRerenderSecure();
  };
  reader.readAsText(file);
}

async function jtDoDecryptAndPreview(){
  if(jtUI.importBusy) return;
  const pw = jtUI.importPassword;
  if(!pw){ return; }

  jtUI.importBusy = true;
  jtUI.importError = '';
  jtUI.importStep = t('secureStepReading');
  jtRerenderSecure();

  // 标记转移开始
  jtStartTransferState('import', { packageId: jtUI.importPackageId || '' });

  try {
    jtUI.importStep = t('secureStepVerifying');
    jtRerenderSecure();

    if(!jtUI.importContainer || jtUI.importContainer.format !== JT_TRANSFER_FORMAT){
      throw new Error('JT_ERR_INVALID_FORMAT');
    }

    jtUI.importStep = t('secureStepDecrypting');
    jtRerenderSecure();

    let decrypted;
    try {
      decrypted = await jtDecryptPackage(pw, jtUI.importContainer);
    } catch(e){
      if(e && e.message === 'JT_ERR_DECRYPT_FAILED'){
        jtUI.importBusy = false;
        jtUI.importError = t('secureImportPasswordWrong');
        jtRerenderSecure();
        return;
      }
      if(e && e.message === 'JT_ERR_CORRUPTED'){
        jtUI.importBusy = false;
        jtUI.importError = t('secureImportFileCorrupted');
        jtRerenderSecure();
        return;
      }
      throw e;
    }

    jtUI.importStep = t('secureStepValidating');
    jtRerenderSecure();

    const snap = decrypted && decrypted.state ? decrypted.state : decrypted;
    if(!jtValidateSnapshot(snap)){
      jtUI.importBusy = false;
      jtUI.importError = t('secureImportFileInvalid');
      jtRerenderSecure();
      return;
    }

    jtUI.importPreview = snap;
    jtUI.importBusy = false;
    jtUI.importStep = '';
    // 清空密码内存
    jtUI.importPassword = '';
    jtRerenderSecure();
  } catch(e){
    jtUI.importBusy = false;
    jtUI.importError = t('secureImportFileCorrupted');
    jtRerenderSecure();
    console.error('[JT import]', e);
  }
}

async function jtDoFinalImport(){
  if(jtUI.importBusy) return;
  if(!jtUI.importPreview) return;

  jtUI.importBusy = true;
  jtUI.importError = '';
  jtUI.importStep = t('secureStepImporting');
  jtRerenderSecure();

  try {
    // 用 setTimeout 让 UI 有机会刷新
    await new Promise(r => setTimeout(r, 50));

    const snap = jtUI.importPreview;

    // 1) 备份当前 state（在内存里）
    const prevState = JSON.parse(JSON.stringify(state));

    // 2) 应用导入
    try {
      jtApplySnapshotToState(snap);
    } catch(e){
      // 回滚
      state = prevState;
      saveState();
      throw e;
    }

    // 3) 验证导入结果
    jtUI.importStep = t('secureStepVerifyingResult');
    jtRerenderSecure();
    await new Promise(r => setTimeout(r, 50));

    const ok = (
      state.accounts.length === (snap.accounts ? snap.accounts.length : 0) &&
      state.transactions.length === (snap.transactions ? snap.transactions.length : 0) &&
      state.goals.length === (snap.goals ? snap.goals.length : 0) &&
      state.assets.length === (snap.assets ? snap.assets.length : 0) &&
      state.debts.length === (snap.debts ? snap.debts.length : 0) &&
      state.moneyGiven.length === (snap.moneyGiven ? snap.moneyGiven.length : 0)
    );

    if(!ok){
      // 回滚
      state = prevState;
      saveState();
      throw new Error('JT_VERIFY_MISMATCH');
    }

    // 4) 记录已导入
    if(jtUI.importPackageId){
      jtMarkPackageImported(jtUI.importPackageId, {});
    }

    // 5) 标记转移完成
    jtMarkTransferComplete('import', { packageId: jtUI.importPackageId || '' });

    jtUI.importDoneSnapshot = snap;
    jtUI.importPreview = null;
    jtUI.importContainer = null;
    jtUI.importDone = true;
    jtUI.importBusy = false;
    jtUI.importStep = '';

    // 重绘整个 UI（因为 state 变了）
    render({ top:true });
    toast(t('secureImportSuccessTitle'));
  } catch(e){
    jtUI.importBusy = false;
    jtUI.importError = t('secureImportFileCorrupted');
    jtRerenderSecure();
    console.error('[JT final import]', e);
  }
}

  try {
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(reg => {
          console.log('[Jiheng PWA] SW registered. Scope:', reg.scope);
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if(!nw) return;
            nw.addEventListener('statechange', () => {
              if(nw.state === 'installed' && navigator.serviceWorker.controller){
                showPwaUpdateAvailable();
              }
            });
          });
          setInterval(() => { reg.update().catch(() => {}); }, 60 * 60 * 1000);
        })
        .catch(err => {
          console.warn('[Jiheng PWA] SW registration failed:', err && err.message);
        });
    });
  } catch(e){
    console.warn('[Jiheng PWA] init error:', e);
  }
})();

function pwaT(key){
  const pack = I18N[LANG] || I18N.zh;
  return (pack.pwa && pack.pwa[key]) || (I18N.zh.pwa && I18N.zh.pwa[key]) || key;
}

function isStandalone(){
  try {
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.navigator && window.navigator.standalone === true) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: minimal-ui)').matches) return true;
  } catch(e){}
  return false;
}

function isIOSDevice(){
  const ua = navigator.userAgent || '';
  const iOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  return iOS || iPadOS;
}
function isAndroidDevice(){
  return /Android/i.test(navigator.userAgent || '');
}

let _deferredInstallPrompt = null;
const PWA_DISMISS_KEY = 'jiheng_pwa_dismissed_at_v1';
const PWA_DISMISS_DAYS = 14;

function wasPwaDismissedRecently(){
  try {
    const t = Number(localStorage.getItem(PWA_DISMISS_KEY) || 0);
    if(!t) return false;
    return (Date.now() - t) < PWA_DISMISS_DAYS * 86400000;
  } catch(e){ return false; }
}
function markPwaDismissed(){
  try { localStorage.setItem(PWA_DISMISS_KEY, String(Date.now())); } catch(e){}
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  setTimeout(() => {
    if(!isStandalone() && !wasPwaDismissedRecently()) showPwaInstallCard();
  }, 3000);
});

window.addEventListener('appinstalled', () => {
  _deferredInstallPrompt = null;
  hidePwaInstallCard();
  try{ toast(pwaT('installedToast')); }catch(e){}
});

function showPwaInstallCard(){
  const root = document.getElementById('pwa-install-root');
  if(!root) return;
  if(root.classList.contains('show')) return;

  const isIOS = isIOSDevice();
  const isAndroid = isAndroidDevice();
  let body = '';

  if(isIOS){
    body = `
      <div class="pi-title">${esc(pwaT('iosTitle'))}</div>
      <div class="pi-desc">${esc(pwaT('iosDesc'))}</div>
      <div class="pwa-install-steps">
        <b>${esc(pwaT('iosStepsTitle'))}</b>
        <ol>
          <li>${esc(pwaT('iosStep1'))}</li>
          <li>${esc(pwaT('iosStep2'))}</li>
          <li>${esc(pwaT('iosStep3'))}</li>
        </ol>
        <div style="margin-top:6px;color:var(--muted);font-size:11.5px;line-height:1.55">${esc(pwaT('iosDataNote'))}</div>
      </div>
      <div class="pi-acts">
        <button class="pi-btn ghost" data-pwa-dismiss>${esc(pwaT('gotIt'))}</button>
      </div>`;
  } else if(_deferredInstallPrompt){
    body = `
      <div class="pi-title">${esc(pwaT('androidTitle'))}</div>
      <div class="pi-desc">${esc(pwaT('androidDesc'))}</div>
      <div class="pi-acts">
        <button class="pi-btn primary" data-pwa-install>${esc(pwaT('installBtn'))}</button>
        <button class="pi-btn ghost" data-pwa-dismiss>${esc(pwaT('later'))}</button>
      </div>`;
  } else {
    return;
  }

  root.innerHTML = `
    <div class="pwa-install-card">
      <div class="pi-icon">📲</div>
      <div class="pi-body">${body}</div>
      <button class="pi-close" data-pwa-dismiss aria-label="Close">✕</button>
    </div>`;
  root.classList.add('show');

  root.querySelectorAll('[data-pwa-dismiss]').forEach(el => {
    el.addEventListener('click', () => { markPwaDismissed(); hidePwaInstallCard(); });
  });
  const installBtn = root.querySelector('[data-pwa-install]');
  if(installBtn){
    installBtn.addEventListener('click', async () => {
      if(!_deferredInstallPrompt) return;
      try {
        _deferredInstallPrompt.prompt();
        const choice = await _deferredInstallPrompt.userChoice;
        if(choice && choice.outcome === 'accepted'){
          hidePwaInstallCard();
        } else {
          markPwaDismissed();
          hidePwaInstallCard();
        }
      } catch(e){}
      _deferredInstallPrompt = null;
    });
  }
}
function hidePwaInstallCard(){
  const root = document.getElementById('pwa-install-root');
  if(root){ root.classList.remove('show'); root.innerHTML = ''; }
}

window.addEventListener('load', () => {
  setTimeout(() => {
    if(isStandalone()) return;
    if(wasPwaDismissedRecently()) return;
    if(isIOSDevice()){
      const isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(navigator.userAgent);
      if(isSafari) showPwaInstallCard();
    }
  }, 3500);
});

function showPwaUpdateAvailable(){
  if(document.getElementById('pwa-update-banner')) return;
  const el = document.createElement('div');
  el.id = 'pwa-update-banner';
  el.style.cssText = 'position:fixed;left:0;right:0;top:calc(8px + var(--safe-t));z-index:195;display:flex;justify-content:center;padding:0 16px;pointer-events:none;';
  el.innerHTML = `
    <div style="background:rgba(28,24,48,.94);color:#fff;font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;align-items:center;gap:10px;pointer-events:auto;max-width:100%;">
      <span style="overflow-wrap:anywhere;">${esc(pwaT('updateAvailable'))}</span>
      <button id="pwa-update-reload" style="border:none;background:var(--accent);color:#3d3158;font-size:12px;font-weight:800;padding:6px 12px;border-radius:9px;cursor:pointer;flex:0 0 auto;">${esc(pwaT('reload'))}</button>
    </div>`;
  document.body.appendChild(el);
  const btn = el.querySelector('#pwa-update-reload');
  if(btn) btn.addEventListener('click', () => {
    if(navigator.serviceWorker && navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
    }
    setTimeout(() => { window.location.reload(); }, 200);
  });
}

function updateOnlineStatus(){
  const root = document.getElementById('pwa-offline-root');
  if(!root) return;
  if(navigator.onLine){
    root.classList.remove('show');
    root.innerHTML = '';
  } else {
    root.innerHTML = `<div class="pwa-offline-pill"><span class="pwa-dot"></span>${esc(pwaT('offline'))}</div>`;
    root.classList.add('show');
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
window.addEventListener('load', () => { setTimeout(updateOnlineStatus, 500); });
</script>
</body>
</html>
