function openGoalDeposit(goalId){
  const g = getGoal(goalId);
  if(!g) return;
  if(!state.accounts.length){ toast(t('noAccountWarn')); return; }
  openSheet({
    title: t('goalDepositTitle'),
    submitText: t('goalDepositBtn'),
    body: `
      <label class="field">
        <span class="field-label">${esc(t('amount'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span>
          <input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal"></div>
      </label>
      <label class="field">
        <span class="field-label">${esc(t('fromAccount'))}</span>
        <select name="accountId">${accountOptions()}</select>
      </label>
      <div class="two-col">
        <label class="field">
          <span class="field-label">${esc(t('date'))}</span>
          <input name="date" type="date" value="${nowLocalDate()}" required>
        </label>
        <label class="field">
          <span class="field-label">${esc(t('time'))}</span>
          <input name="time" type="time" value="${nowLocalTime()}" required>
        </label>
      </div>
      <p class="hint">${esc(t('goalDepositHint', { amt: money(availableBalance()) }))}</p>
    `,
    onSubmit(d){
      const amount = round2(parseFloat(d.amount));
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      const acc = getAccount(d.accountId);
      if(!acc){ toast(t('accountNotExist')); return false; }
      if(round2(Number(acc.balance)||0) < amount){ toast(t('insufficientBalance')); return false; }
      acc.balance = round2((Number(acc.balance)||0) - amount);
      g.saved = round2((Number(g.saved)||0) + amount);
      state.transactions.push({
        id: uid(), type: 'goal_deposit', amount,
        date: combineDateTime(d.date || nowLocalDate(), d.time || nowLocalTime()),
        accountId: acc.id, goalId: g.id,
        category: 'Savings', note: '',
        createdAt: Date.now(), updatedAt: Date.now()
      });
      afterChange();
      toast(t('goalDeposited'));
      return true;
    }
  });
}

function openGoalWithdraw(goalId){
  const g = getGoal(goalId);
  if(!g) return;
  if(!state.accounts.length){ toast(t('noAccountWarn')); return; }
  const saved = round2(Number(g.saved)||0);
  if(saved <= 0){ toast(t('goalNoMoney')); return; }
  openSheet({
    title: t('goalWithdrawTitle'),
    submitText: t('goalWithdrawBtn'),
    body: `
      <label class="field">
        <span class="field-label">${esc(t('amount'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span>
          <input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal"></div>
      </label>
      <label class="field">
        <span class="field-label">${esc(t('toAccount'))}</span>
        <select name="accountId">${accountOptions()}</select>
      </label>
      <div class="two-col">
        <label class="field">
          <span class="field-label">${esc(t('date'))}</span>
          <input name="date" type="date" value="${nowLocalDate()}" required>
        </label>
        <label class="field">
          <span class="field-label">${esc(t('time'))}</span>
          <input name="time" type="time" value="${nowLocalTime()}" required>
        </label>
      </div>
      <p class="hint">${esc(t('goalWithdrawHint', { amt: money(saved) }))}</p>
    `,
    onSubmit(d){
      const amount = round2(parseFloat(d.amount));
      if(!(amount > 0)){ toast(t('invalidAmount')); return false; }
      const acc = getAccount(d.accountId);
      if(!acc){ toast(t('accountNotExist')); return false; }
      if(amount > round2(Number(g.saved)||0) + 0.001){ toast(t('goalExceed')); return false; }
      g.saved = round2((Number(g.saved)||0) - amount);
      acc.balance = round2((Number(acc.balance)||0) + amount);
      state.transactions.push({
        id: uid(), type: 'goal_withdraw', amount,
        date: combineDateTime(d.date || nowLocalDate(), d.time || nowLocalTime()),
        accountId: acc.id, goalId: g.id,
        category: 'Savings', note: '',
        createdAt: Date.now(), updatedAt: Date.now()
      });
      afterChange();
      toast(t('goalWithdrew'));
      return true;
    }
  });
}

function cancelGoal(id){
  const g = getGoal(id);
  if(!g) return;
  const saved = round2(Number(g.saved)||0);
  if(saved <= 0){
    confirmDialog(t('goalDeleteConfirm'), () => {
      state.goals = state.goals.filter(x => x.id !== id);
      afterChange();
      toast(t('goalDeleted'));
    });
    return;
  }
  if(!state.accounts.length){ toast(t('noAccountWarn')); return; }
  openSheet({
    title: t('goalCancelTitle'),
    submitText: t('goalCancelBtn'),
    body: `
      <p class="hint" style="margin-bottom:14px">${esc(t('goalCancelHint', { amt: money(saved) }))}</p>
      <label class="field">
        <span class="field-label">${esc(t('goalReturnAccount'))}</span>
        <select name="accountId">${accountOptions()}</select>
      </label>
    `,
    onSubmit(d){
      const acc = getAccount(d.accountId);
      if(!acc){ toast(t('accountNotExist')); return false; }
      acc.balance = round2((Number(acc.balance)||0) + saved);
      state.transactions.push({
        id: uid(), type: 'goal_withdraw', amount: saved,
        date: nowISO(), accountId: acc.id, goalId: g.id,
        category: 'Savings', note: 'Goal cancelled', createdAt: Date.now(), updatedAt: Date.now()
      });
      state.goals = state.goals.filter(x => x.id !== id);
      afterChange();
      toast(t('goalCancelled'));
      return true;
    }
  });
}

      const name = (d.name || '').trim();
      const price = round2(parseFloat(d.price));

        expectedYears: years, expectedMonths: months,

        manualValue: null, manualNote: '',

      });

function openAssetAdjust(id){
  const a = getAsset(id);
  if(!a) return;
  const c = assetCalc(a);
  openSheet({
    title: t('assetAdjustTitle'),
    submitText: t('assetAdjustBtn'),
    body: `
      <div class="asset-rows" style="margin-bottom:16px">
        <div class="ar"><span>${esc(t('assetSystemValue'))}</span><b>${money(c.systemValue)}</b></div>
        <div class="ar"><span>${esc(t('assetPrice'))}</span><b>${money(c.price)}</b></div>
      </div>
      <label class="field">
        <span class="field-label">${esc(t('assetAdjustValue'))}</span>
        <div class="input-wrap"><span class="prefix">RM</span>
          <input name="manualValue" type="number" step="0.01" min="0" placeholder="${esc(t('assetAdjustPlaceholder'))}"

        <span class="field-label">${esc(t('assetAdjustReason'))}</span>

      </label>
      <p class="hint">${esc(t('assetAdjustHint'))}</p>
    `,
    onSubmit(d){
      const raw = String(d.manualValue || '').trim();
      if(raw === ''){
        a.manualValue = null;

      toast(t('assetAdjusted'));

/* =========================================================================
   启动
   ========================================================================= */
(function boot(){
  state.accounts.forEach(a => { a.balance = round2(Number(a.balance) || 0); });
  state.goals.forEach(g => {
    g.saved = round2(Number(g.saved) || 0);
    g.targetAmount = round2(Number(g.targetAmount) || 0);
  });
  state.debts.forEach(d => {
    d.amount = round2(Number(d.amount)||0);
    d.paid = round2(Number(d.paid)||0);
    if(!Array.isArray(d.payments)) d.payments = [];
    if(d.purpose === undefined) d.purpose = '';
    if(d.purposeCustom === undefined) d.purposeCustom = '';
  });
  state.moneyGiven.forEach(m => {
    m.amount = round2(Number(m.amount)||0);
    if(m.purpose === undefined) m.purpose = m.giftType || '';
    if(m.purposeCustom === undefined) m.purposeCustom = '';
    if(m.method === undefined) m.method = '';
    if(m.methodCustom === undefined) m.methodCustom = '';
  });

  if(APP_VERSION_FALLBACK && APP_VERSION_FALLBACK > (META.appVersion || '0')){
    META.appVersion = APP_VERSION_FALLBACK;
  }
  if(!META.dataVersion || META.dataVersion < DATA_VERSION_FALLBACK){
    META.dataVersion = DATA_VERSION_FALLBACK;
  }
  META.lastUpdated = new Date().toISOString();
  saveMeta(META);

  if(loadResult.migrationFailed){
    setTimeout(() => toast(t('migrationFailed')), 800);
  }

  saveChangelog();
  saveState();
  checkAchievements();

  if(lockRecord && lockRecord.hash){
    isUnlocked = false;
    lockUI.mode = 'unlock';
  }else{
    isUnlocked = false;
    lockUI.mode = 'create';
  }
  renderLock();
  render({ top:true });
})();

window.addEventListener('storage', e => {
  if(e.key === STORAGE_KEY){
    const r = loadState();
    if(!r.migrationFailed){
      state = r.state;
      LANG = state.settings.lang || LANG;
      if(isUnlocked) render();
    }
  }
  if(e.key === LOCK_KEY){
    lockRecord = loadLock();
    if(!lockRecord){ isUnlocked = true; renderLock(); render({ top:true }); }
  }
  if(e.key === META_KEY){ META = loadMeta(); if(isUnlocked) render(); }
});
</script>
